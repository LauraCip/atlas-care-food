ted food. Saul left in 2012 to found Community Food Centres Canada, which has replicated the model in 15+ Canadian sites.", "fam": "D", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P6", "P7"], "why": "Clearest, most fully documented case of transition from charitable food assistance to rights-based food welfare; benchmark case for the most advanced rights-based model identified to date; D4 Transformative Capacity likely unmatched in the corpus so far.", "sources": "thestop.org; Charity Intelligence Canada; Wikipedia \"Nick Saul\"; U of T Magazine; McConnell Foundation; Food Tank (2015)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "M", "T", "T", "M", "M"], "nT": 6, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": "https://thestop.org"}, {"id": "F-05", "corpus": "food", "name": "The Food Project (TFP)", "place": "Greater Boston and North Shore, Massachusetts, USA", "period": "1991–present", "desc": "The Food Project is a nonprofit in Greater Boston and the North Shore, Massachusetts, that has used sustainable agriculture as a tool for youth development, food justice and community building since 1991. It works with teenagers, deliberately mixing youth from Lincoln and Roxbury, and with residents of majority-Black-and-Latinx Roxbury. It farms 70+ acres in Lincoln (Baker Bridge Farm, 31 acres), Boston/Dorchester, Lynn, Beverly and Wenham, including land on a 99-year Dudley Neighbors Incorporated lease, and ran a resident-led food-system assessment with Alternatives for Community and Environment. It involves 140 teenagers a year, runs 3 SNAP-accessible farmers markets, and has built 2,000+ raised beds through Build-a-Garden over 30 years. It has operated continuously for 34+ years.", "fam": "A", "fam2": null, "prim": ["P1", "P3", "P4", "P6", "P7"], "why": "Exemplary for Self-Determination and Collective Responsibility across 34 years — the Atlas’s longest-running, most thoroughly documented case of food justice through youth farming, one that incubated innovations later adopted as policy (EBT farmers markets in Massachusetts).", "sources": "thefoodproject.org; press archive (2018 State House rally); DNI lease documentation; ACE resident-led assessment", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "W", "T", "T", "M", "M"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: B, C  ·  No: –"}, "link": "https://thefoodproject.org"}, {"id": "F-06", "corpus": "food", "name": "Social Gastronomy Movement (SGM)", "place": "Global", "period": "2018–present", "desc": "The Social Gastronomy Movement is a global movement using food as a tool for social change, launched in January 2018 at the WEF in Davos by chef and social entrepreneur David Hertz, co-founder of Gastromotiva (Rio de Janeiro, founded 2006). It connects 400+ NGOs, activists and enterprises in 70+ countries and is a Cooperation Partner of the FAO World Food Forum (#RightToFood, #UniversalPlate). It began with a 3-year, $1.5M partnership with Cargill (2018-2021) and has expanded to the Amazon through a partnership with the Acariquara Institute. During Covid-19 its Refettorio Gastromotiva became a food bank and Solidarity Kitchens run by alumni served 5M+ meals across two countries; the Refettorio (Lapa, Rio), which saved 350 tonnes of food over a decade, closed permanently on 26 February 2026 when its municipal land concession expired.", "fam": "H", "fam2": null, "prim": ["P1", "P6"], "why": "Exemplary for Self-Determination and Interdependence at global scale, and for Responsiveness and Ecology of Care. The most developed conceptual framework in this corpus for food as a tool of systemic social change and welfare; Gastromotiva is a grounded, documented practice with measurable impacts and demonstrated capacity to adapt under crisis (Covid-19) and extend into new ecological registers (the Amazon).", "sources": "FAO World Food Forum #UniversalPlate/#RightToFood campaign materials; Gastromotiva official communications; press coverage of Refettorio closure (Feb 2026) and Cargill partnership", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "M", "M", "T", "M", "M", "M"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: A  ·  Partly: B  ·  No: C"}, "link": "https://socialgastronomy.org"}, {"id": "F-07", "corpus": "food", "name": "Wits Food Sovereignty Centre", "place": "University of the Witwatersrand, Johannesburg, South Africa", "period": "2015–present", "desc": "The Wits Food Sovereignty Centre is a university-hosted food sovereignty hub at the University of the Witwatersrand, Johannesburg, aimed at food-insecure students. It grew from a 2015 hunger march and a 2016 memorandum to University management by the student forum Inala, COPAC and SAFSC, after which the University renovated a building ('the Sanctuary') and allocated land for gardens. It now includes 6 agroecology gardens, a food forest, a monthly farmers' market and a food bank/communal kitchen run through the existing WCCO scheme. The campaign gathered an 8,000+ signature petition, has involved 150+ people, trained 40+ people in a single 2022 workshop week, and has had knock-on effects at 4 further universities. A second hub was launched in March 2022. Communal Kitchen & Gardens: Spaces where students can prepare their own meals according to personal taste and culture using produce grown in campus commons gardens. Wits Food Sovereignty Hub (West Campus): Opened in May 2025 as a regenerative urban farm and living classroom featuring indoor training workshops, a seedbank, a nursery, a compost site, and water-harvesting systems. Agroecology & Training: Offers zero-input farming workshops, permaculture education, and activist training in partnership with groups like COPAC, the South African Food Sovereignty Campaign (SAFSC), and the Inala Forum.", "fam": "A", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P5", "P6"], "why": "Clearest corpus case of a food-sovereignty rights claim converting successfully into funded institutional infrastructure within the very institution it targeted — read together with SAFSC as same framework achieving different institutional outcomes by scale/target.", "sources": "Wits Curiosity magazine (2019); candystick.co.za; Change.org petition; Daily Maverick (2022-03-21); Satgar (2024) Cambridge UP", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "T", "T", "M", "M", "M"], "nT": 6, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://www.wits.ac.za/curiosity/stories/appetite-for-dignity.html"}, {"id": "F-08", "corpus": "food", "name": "Agorà del Cibo — verso una Food Policy per Genova", "place": "Genoa, Italy", "period": "2025–present", "desc": "Agorà del Cibo is a participatory food-policy process in Genoa, run by Terra! and Rete Ricibo, led by Comunità San Benedetto al Porto and funded by Fondazione Compagnia di San Paolo. It addressed residents of six districts, central and peripheral: Voltri, Centro Storico, Certosa, Val Bisagno, Sampierdarena and Sturla, with food poverty as the first-listed priority theme. Six district assemblies held between May and October 2025, with 142 participants across 22 tables, produced a Documento di Raccomandazioni delivered to the Comune on 30 January 2026. The process strengthens and extends Genoa's Tavolo delle Food Policy, which has existed since 2023, in a city with 10,000t of food waste per year (only 4% recovered) and 28,000+ people using food-distribution services.", "fam": "C", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P8", "P9"], "why": "Well-documented, very recent Italian case of structured civic participation generating a specific reform agenda secured through a direct hearing from a sitting mayoral administration; instructive \"collaborative-mode\" Rights-Enacting case distinct from adversarial claims-making cases (e.g. SAFSC).", "sources": "Comune di Genova/Genova Smart (2026-01-30); Rete Ricibo \"Chi Siamo\"; Genova24 (2026-01-15, 01-30); Babboleo (2026-01-15); Riciblog.it (2026-02-28)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "M", "M", "M", "T", "T"], "nT": 6, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://unigesostenibile.unige.it/en/node/2078"}, {"id": "F-09", "corpus": "food", "name": "Amadiba Traditional Foodways & Amadiba Crisis Committee (Xolobeni)", "place": "Amadiba territory, Mpondoland, Wild Coast, Eastern Cape, South Africa", "period": "2007–present", "desc": "Amadiba Traditional Foodways is the living indigenous food system of the Amadiba (Mpondo people) in Mpondoland, on the Wild Coast of the Eastern Cape, South Africa, governed through customary Komkhulu structures and the imbuzo assembly. It has been sustained through a two-decade land and sea defence struggle led by the Amadiba Crisis Committee (ACC, founded 2007) against titanium mining at Xolobeni and offshore oil and gas exploration by Shell. The struggle secured a 2016 mining moratorium, extended in 2018, and a 2022 High Court judgment setting aside Shell's exploration rights. Fieldwork in 2021 comprised 40 interviews in 7 villages.", "fam": "B", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P6", "P7", "P8"], "why": "Clearest corpus example of Rights-Enacting status achieved with almost no formal institutionalisation, via customary rather than NGO/state-facing governance; extends the two-axis D3 model in a different direction than BPP (claims-making sustained indefinitely with institutionalisation deliberately refused, vs. BPP’s claims-making preceding forced institutionalisation elsewhere).", "sources": "Kesselman & Zukulu (2025) Grassroots-J.Political Ecology 32; Healy (2022) Geoforum 133; Goldman Environmental Prize (2024)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "M", "T", "T", "T", "W"], "nT": 7, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": "https://en.wikipedia.org/wiki/Amadiba_Crisis_Committee"}, {"id": "F-10", "corpus": "food", "name": "Fattoria del Dono — Agriparco e Fattoria di Comunità", "place": "San Lazzaro di Savena (Bologna), Italy", "period": "2021–present", "desc": "Fattoria del Dono is a 10-hectare agricultural estate in San Lazzaro di Savena (Bologna) donated in 2021 by citizen Stella Corazza to the Comune and converted from decades of conventional cereal monoculture to agroecology as an agripark and community farm. It includes labour inclusion for people involved with psychiatric services and other fragile people, and is connected to Emporio Solidale Amalio for food-welfare distribution. It received a €780,000 capital grant from Regione Emilia-Romagna through a formal Urban Regeneration Contract. Since April 2025 it has been managed by a four-organisation ATI (Campi Aperti, Coop Agriverde, Deafal ONG, Città Campagna/Arvaia) selected through public co-progettazione in 2023-24. It was inaugurated on 12 April 2025.", "fam": "A", "fam2": null, "prim": ["P6", "P7", "P9"], "why": "Exemplary for EC and CR as an Italian community-agroecology model with strong structurally embedded welfare vocation; most complete Italian case integrating private donation + public funding + third-sector management + agroecology + food-welfare linkage; the \"gift\" founding narrative is symbolically resonant.", "sources": "comune.sanlazzaro.bo.it (official pages); volabo.it (bando/co-progettazione); Il Resto del Carlino (2025-04-13, 2024-04-23); Sogni e Bisogni (2025-04-30)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "W", "W", "T", "T", "M", "T"], "nT": 3, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://www.comune.sanlazzaro.bo.it"}, {"id": "F-11", "corpus": "food", "name": "Community Cooking — Caritas Stadtteilarbeit Wien", "place": "Favoriten, Vienna, Austria", "period": "2015–present", "desc": "Community Cooking is a community kitchen at Kulturhaus Brotfabrik in the Kreta-Viertel of Favoriten, Vienna, run by Caritas Stadtteilarbeit since 2015. Its core programme is open to all residents. It offers weekly open cooking rounds and sub-programmes: Ministry of Food Vienna (2016-17, cooking-skills training), Kitchen Stories (virtual exchange, since 2020), ToNoWaste (2024, EU-funded food-waste workshops linked to the Caritas food bank Le+O) and paid Team Cooking corporate events; the kitchen was designed in 2014 by chmara.rosinke studio with the Jamie Oliver Foundation. Ministry of Food trained 183 people and ToNoWaste involved 125 participants. It has operated for about 10 years and is currently funded by the City of Vienna Culture Department (MA7).", "fam": "E", "fam2": null, "prim": ["P1", "P3", "P4", "P6", "P8"], "why": "Boundary/inclusion case for corpus discussion: primary identity is community/health/integration, not food welfare — flagged, not resolved. Exemplary for SD and IN as a decade-stable, design-founded community kitchen.", "sources": "caritas-stadtteilarbeit.at (official pages); chmararosinke.com; tonowaste.eu (2025-06-12)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "M", "T", "M", "T", "M"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: A, C  ·  No: B"}, "link": "https://caritas-stadtteilarbeit.at"}, {"id": "F-12", "corpus": "food", "name": "AgroFavela Refazenda — urban community garden in Paraisópolis", "place": "Paraisópolis, São Paulo, Brazil", "period": "2020–present", "desc": "AgroFavela Refazenda is a 900 sqm community urban farm in a converted concrete pavilion in Paraisópolis, São Paulo, run with G10 Favelas and relaunched in October 2020 on World Food Day. It serves the food-insecure population and is attentive to women survivors of domestic violence. It grows 60+ species in vertical and horizontal systems, about 960 plants per monthly cycle, is linked to the Mãos de Maria bistro and Hortas na Laje home gardens, and is partly funded by an 850 sqm 'FAVELA É AGRO' ad panel; in 2025-26 Guardiãs das Águas rainwater harvesting feeds its drip irrigation with partner Mosaic. Harvests grew from 300kg to 1.27t, 2t and 3+t over three years. It was replicated in Heliópolis in February 2021 with an adapted hydroponic model. The initiative arises from a collaboration between G10 Favelas, a collective of community leaders and social entrepreneurs, and the NGO Instituto Stop Hunger Brasil (part of the Sodexo group).", "fam": "A", "fam2": null, "prim": ["P1", "P3", "P4", "P5", "P6", "P7", "P8"], "why": "Exemplary for Ecology of Care and Self-Determination as a model of autonomous urban food production in a context of extreme structural vulnerability, and equally exemplary for Politics of Care, Attentiveness and Responsiveness. Among the Global South cases in this Atlas closest to a genuine food-sovereignty register.", "sources": "G10 Favelas official channels; Stop Hunger Brasil; TV Brasil (2023) broadcast coverage; press coverage of 'FAVELA É AGRO' campaign", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "T", "T", "T", "T", "W"], "nT": 7, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://www.instagram.com/agrofavela_refazenda/"}, {"id": "F-13", "corpus": "food", "name": "Another Provision (installation, publication and co-design process)", "place": "East London, UK", "period": "2021–2024", "desc": "Another Provision was a four-year (2021-2024) participatory art and research installation and co-design process, funded by a UCL public-art commission. It was developed through workshops with people with lived experience of receiving food aid and with food activists, anchored in the National Food Service London (NFSL) mutual-aid network. The project built a modular, reconfigurable physical structure for envisioning communal food infrastructures. It toured about 9 venues across Hackney, Tower Hamlets, Islington and Camden, plus Folkestone and Manchester. In 2024 it was extended as an exhibition to Berlin (Municipal Kitchens, nGbK gallery), and the project period ended in 2024. It was developed as a collaboration between researcher Hanna Baumann (UCL Institute for Global Prosperity) and artist Johann Arens, in close connection with the London chapter of the National Food Service (NFS), a community mutual-aid network.", "fam": "F", "fam2": null, "prim": ["P1", "P2", "P3", "P5", "P6", "P8"], "why": "Exemplary for Politics of Care and Attentiveness: built directly on the charity-versus-rights distinction central to the Care(full) Design framework, and one of the clearest cases of claims-making (in Fraser's sense) operationalised through participatory design with people with lived experience, rather than asserted on their behalf. Useful comparative case alongside LUPPA, Ghetto Gastro and Social Gastronomy Movement for structured discussion of what criterion B should require across the corpus.", "sources": "Project publication/exhibition materials; NFSL own communications; anotherprovision.org", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "M", "T", "T", "W", "T", "W"], "nT": 6, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: C  ·  No: B"}, "link": "https://anotherprovision.org"}, {"id": "F-14", "corpus": "food", "name": "Belo Horizonte Food Security Programme (SMSAN)", "place": "Belo Horizonte, Minas Gerais, Brazil", "period": "1993–present", "desc": "The Belo Horizonte Food Security Programme is an integrated municipal food-security system in Belo Horizonte, Brazil, a city of 2.5M inhabitants, formally launched in 1993 under Mayor Patrus Ananias, with an institutional prehistory from 1982. It runs 20+ programmes across three governance modes: direct provision (school meals, Restaurantes Populares, emergency distribution), regulated partnership (markets, organic fairs) and non-hierarchical networks (agroecology, participatory guarantee), with the COMUSAN council in place since 2003. It uses under 2% of the municipal budget, served as a direct template for Zero Hunger (2003) and LOSAN (2006), and received the Future Policy Award in 2009. It remains active after reforms in 2000, 2003, 2021 and 2025, holding COMUSAN's 5th Municipal Conference in 2023.", "fam": "C", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P5", "P7", "P8", "P9"], "why": "Exemplary for Institutionalisation and Responsiveness as the most advanced, longest-documented municipal food policy identified in this Atlas — and the corpus's clearest case of institutionalised bottom-up governance: formal absorption and legal codification, sustained across 33 years, of tools and demands first developed in 1970s-80s grassroots mobilisation, channelled through a standing elected-delegate participatory council.", "sources": "Magalhães & Coelho (2023) academic analysis; Change Stories (2025, University of Washington); Scielo study of Restaurante Popular users; Future Policy Award (2009) documentation", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "T", "M", "T", "T", "T"], "nT": 8, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": "https://prefeitura.pbh.gov.br/smasac/seguranca-alimentar-e-nutricional"}, {"id": "F-15", "corpus": "food", "name": "Botildenborg — urban farm and Stadsbruk incubator", "place": "Rosengård, Malmö, Sweden", "period": "2011–present", "desc": "Botildenborg is an urban farm and social enterprise on an 1876 farmhouse in Rosengård, a majority-migrant neighbourhood of Malmö, operated by Xenofilia (Lena Friblick) and governed by Stiftelsen Botildenborg, with about 10 founding members including public authorities, companies and Malmö University. It serves migrants, schools and local residents. It combines organic production, the Stadsbruk urban-farmer incubator methodology, vocational and language training (Växtplats Botildenborg, with the City of Malmö), schools programmes, community events and a commercial conference venue that funds operations. The Stadsbruk pilot with Vinnova (2014-16) involved 7 municipalities, 32 growers and 14 partner organisations. Activities began in 2011, and the building was renovated in 2017-19 and reopened in September 2019.", "fam": "A", "fam2": null, "prim": ["P1", "P4", "P6", "P7", "P8"], "why": "Exemplary for Contextual Sensitivity and Interdependence as a Nordic social-enterprise model using food/cultivation for migrant labour-market integration, now also for Collective Responsibility and Institutionalisation given the Foundation’s multi-stakeholder governance. Unique in this corpus as a dedicated urban-farmer incubator format.", "sources": "Vinnova project page; Pálsdóttir et al. (2021) Journal of Therapeutic Horticulture; botildenborg.se", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "T", "M", "T", "T", "T", "M"], "nT": 5, "depth": "Transformative", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://botildenborg.se"}, {"id": "F-16", "corpus": "food", "name": "Consiglio del Cibo di Roma — the 2026 School Meals Tender", "place": "Rome, Italy", "period": "2019–present", "desc": "The case is Rome's 2026 school meals tender, a four-year, €766 million public procurement contract for the city's entire school catering system, shaped by policy requests from the Consiglio del Cibo di Roma Metropolitana through its Tavolo Mense Scolastiche. It covers children in 816 schools across 15 Municipi, 23.6 million meals per year. The tender sets anti-caporalato and anti-mafia sourcing criteria, a fixed non-reducible meal price, environmental criteria (CAM, organic/DOP/IGP/seasonal) and consolidated parent Commissioni Mensa in all 15 Municipi. The Council was founded in 2019, formalised by Delibera Assemblea Capitolina n. 38/2021, and includes 50+ organisations. The tender was published on 16 July 2026 and closed on 15 September 2026, for a 2026-2030 contract.", "fam": "C", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P5", "P7", "P9"], "why": "Exemplary for Politics of Care and Institutionalisation as the clearest case of a food policy council's claims-making producing a binding, budgeted public instrument at metropolitan scale, with a self-documented anti-caporalato/anti-organised-crime sourcing mechanism unique among the corpus's cases. Makes Rome the strongest available case for a Milan-Rome institutional comparison on food governance.", "sources": "Terra! own published account (Tavolo Mense Scolastiche); Delibera Assemblea Capitolina n. 38/2021; Roma Capitale tender documentation (16 July 2026); Foodinsider observatory ranking", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "T", "W", "T", "M", "T"], "nT": 7, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": ""}, {"id": "F-17", "corpus": "food", "name": "Dispensa Sociale + Dispensa Re-Store", "place": "Bergamo, Italy", "period": "2019–present", "desc": "Dispensa Sociale and Dispensa Re-Store form a dual food-surplus system in Bergamo run by Namaste Cooperativa Sociale. Dispensa Sociale began in 2019 as an educational activity for people with disabilities in Namaste's supported apartments, who act as agents of recovery, and redistributes retail and wholesale surplus across the Bergamo area. Dispensa Re-Store, opened in 2022 with Foria S.r.l. and the Comune di Bergamo, distributes directly to individuals with no documentation required, on Mondays and Thursdays from 17 to 19h. Recovery grew from 69,780 kg in 2020 to 135,185 kg in 2023, with 60 partner organisations and 47 volunteers giving 4,968 hours in 2023. It is a founding co-author of the Food Pride Italia Manifesto.", "fam": "D", "fam2": null, "prim": ["P1", "P3", "P6", "P8", "P9"], "why": "Exemplary for Interdependence and Self-Determination as a food-welfare model that reverses the usual carer/cared-for relationship. Re-Store is among the most fully documented cases of unmediated universal food access identified in Italy. Its co-founding role in Food Pride Italia adds a documented claims-making dimension.", "sources": "Namaste/Dispensa Sociale annual reporting; press coverage of Re-Store opening (2022); Food Pride Italia Manifesto", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "M", "M", "T", "M", "T", "T"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: A, C  ·  No: B"}, "link": "https://www.foodtimes.eu/it/pianeta/re-store-il-progetto-di-economia-circolare-per-la-gdo-e-le-persone-con-disabilita-win-win/"}, {"id": "F-18", "corpus": "food", "name": "Kääntöpöytä (Turntable) — Pasila, Helsinki", "place": "Pasila, Helsinki, Finland", "period": "2009–present", "desc": "Kääntöpöytä (Turntable) is a community-run urban farm, greenhouse, café and event space built in and around a disused locomotive turntable in Helsinki's Pasila railway yard, initiated by the environmental NGO Dodo ry. It is open to participants in Dodo's urban-farming network, who pay a €20/year growing-sack fee. It began in 2009 as an unpermitted guerrilla garden box by Päivi Raivio, won a competitive World Design Capital 2012 grant to build permanent infrastructure, and links to the Satokartta foraging map and the ResAgri DIY agri-tech experiment. The wider Dodo network has about 1,000 participants, and the site has 2 beehives and 100+ Harvest Fest attendees a year. It now operates under formal land-use agreements with ongoing rent, on a site undergoing area redevelopment.", "fam": "A", "fam2": null, "prim": ["P3", "P4", "P5", "P7"], "why": "Exemplifies Collective Responsibility and Interdependence through adaptive reuse of disused railway infrastructure; a rare, well-documented case of transition from illegal guerrilla action to formal (if modest) institutional accommodation — useful contrast against rights-explicit cases (Rome, LUPPA) showing ecological/civic commoning vs rights/justice claims-making logics.", "sources": "kaantopoyta.fi; Torretta field interviews (2013-14); Torretta & Reitsma (2019) design-activism literature", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "T", "T", "T", "M", "T", "M", "W"], "nT": 4, "depth": "Transformative", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://kaantopoyta.fi"}, {"id": "F-19", "corpus": "food", "name": "LUPPA — Laboratório Urbano de Políticas Públicas Alimentares", "place": "Brazil (national)", "period": "2018–present", "desc": "LUPPA (Laboratório Urbano de Políticas Públicas Alimentares) is a governance methodology and peer-learning platform for Brazilian municipalities, not a physical site, run by Instituto Comida do Amanhã (founded 2018) as its main programme since 2021. It works with a rotating cohort of municipalities, reserving 40% of new places for the Legal Amazon, with LABs held in São Paulo, the Amazon region and Curitiba. Its cycle comprises a municipal food-system diagnostic matrix feeding the public Mapa LUPPA tool, workshops, an in-person 'LUPPA LAB', mentor-city pairing and 'Lupinhas' spin-off projects. It has reached about 50 cumulative cities across 5 editions. Since November 2024 it has been an implementation partner to the federal Ministry for Social Assistance and Development for Estratégia Alimenta Cidades (60 cities).", "fam": "C", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P6", "P8", "P9"], "why": "Exemplary for Institutionalisation and Politics of Care as the case that most fully closes the distance between food-sovereignty rhetoric and formal, documented, government-level institutional uptake — the clearest instance found so far of both strong rights language and institutional uptake occurring together and mutually reinforcing. Also exemplary for Attentiveness in an unusual register: directed at municipal civil servants themselves as under-recognised carers.", "sources": "Interview with the co-founder; SOFI 2023 (FAO/IFAD/UNICEF/WFP/WHO); IPES-Food 2023 (From Plate to Planet); HLPE-FSN 2024; Statement of Commitment to Global Alliance Against Hunger and Poverty (Nov 2024); luppa.comidadoamanha.org", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "M", "T", "M", "T", "T"], "nT": 7, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://luppa.comidadoamanha.org"}, {"id": "F-20", "corpus": "food", "name": "Manifesto per il Pride del Cibo — Food Pride Italia", "place": "Italy", "period": "2019–present", "desc": "Food Pride Italia is a national shared-values manifesto and network for Italian civil-society organisations working on surplus food recovery, anti-waste action and the right to food. It links local practices across Italian regions with the aim of building multi-scale, integrated and participatory food policies, and is structured around five principles: Partecipazione, Recupero, Inclusione, Distribuzione and Educazione. It originated in 2019 in Turin as 'Rete 29 Settembre', drafted the Manifesto through thematic tables in 2020 and launched it on 5 February 2021, Italy's anti-food-waste day, via livestream from 8 cities. It had 7 founding organisations, including co-author Dispensa Sociale (Bergamo), and dozens of signatories by 2022; its first in-person gathering, 'Food Pride Italia si racconta', took place in Turin in February 2022, and it is legally anchored to Associazione Eufemia (Turin) as capofila.", "fam": "C", "fam2": null, "prim": [], "why": "The single most politically significant textual contribution identified in the Italian corpus: states, in the network's own words, the conceptual condition for moving from charity-framed to rights-framed food welfare. Directly connects to Dispensa Sociale (founding co-author) and RECUP Milan (signatory).", "sources": "Manifesto text; foodpride.eu; Dispensa Sociale \"Dispensa Pride\" reporting", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "W", "M", "M", "W", "W", "M", "W", "W"], "nT": 0, "depth": "Emergent", "re": "P", "reCrit": "Yes: A  ·  Partly: –  ·  No: B, C"}, "link": "https://foodpride.eu"}, {"id": "F-21", "corpus": "food", "name": "Keep Growing Detroit (KGD)", "place": "Detroit, Highland Park, Hamtramck, Michigan, USA", "period": "2013–present", "desc": "Keep Growing Detroit (KGD) is an urban food sovereignty organisation working in Detroit, Highland Park and Hamtramck, Michigan, USA, founded in 2013 on the basis of the Garden Resource Program (2003) and the Grown in Detroit cooperative marketing scheme (2006). It supports a network of community gardens and growers, runs a 1.38-acre demonstration farm in Eastern Market, and set up the Detroit Black Farmer Land Fund in 2020 to address land-ownership inequality in a majority-Black city. The garden network grew from 2,029 gardens in 2022 to nearly 3,000 in 2025, with 500+ partner organisations, 70+ Grown in Detroit producers and 8,500 lbs of food distributed (2022 data). Co-director Tepfirah Rushdan was appointed the City's Director of Urban Agriculture in 2023, and her land-tax-policy advocacy is credited with a 2024 land-tax exemption.", "fam": "B", "fam2": null, "prim": ["P1", "P3", "P4", "P5", "P6", "P7", "P8"], "why": "Exemplary for Self-Determination, Ecology of Care, Institutionalisation and Politics of Care in urban food sovereignty — the KGD-to-municipal-department trajectory is a rare corpus example of grassroots advocacy producing not just influence but a named government office.", "sources": "detroitagriculture.net; 2022 KGD health study (peer-reviewed); Harvesting Sustainable Water Solutions (2020)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "T", "T", "T", "T", "M"], "nT": 7, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://detroitagriculture.net"}, {"id": "F-22", "corpus": "food", "name": "R-Urban Poplar / Teviot People's Kitchen (TPK)", "place": "Poplar, London, UK", "period": "2012–present", "desc": "R-Urban Poplar is an eco-civic hub built from shipping containers on a former car park on the Teviot Estate, Poplar, Tower Hamlets, London, on a 450 sqm site leased at peppercorn rent from the housing association Poplar HARCA. R-Urban began in 2012 as a mobile hub in Hackney Wick and moved to Poplar in 2017; the Teviot People's Kitchen (TPK) was set up in 2024 with JustFACT support. The hub comprises 100 sqm of growing space, a classroom and kitchen, composting, an anaerobic digester, vertical planting, greywater beds, a dry toilet, offices, a workshop and a tool library, and is an accredited AQA UAS Centre for Level 2 sustainable food-growing qualifications. It has received three international design awards (Zumtobel, Curry Stone, New European Bauhaus) and belongs to the transnational R-Urban network; the funded TPK pilot concluded with a final report in October 2025. The hub was initiated by the participatory architecture and art practice Public Works (London) and Atelier d'Architecture Autogérée (AAA, Paris), and is now supported by community ecological-transition programmes such as JustFACT and the Women's Environmental Network (Wen).", "fam": "A", "fam2": null, "prim": ["P2", "P3", "P4", "P5", "P6", "P7", "P8"], "why": "Exemplifies Self-Determination and Ecology of Care through a closed-loop, architecturally designed food-waste-to-food system that catalysed a self-organised, community-led group explicitly working toward a just food system. Its most distinctive value may now be as an unusually candid case study of the gap between community-building success and economic/institutional self-sufficiency, documented in the project's own first-person final report, not by external critique.", "sources": "r-urban-poplar.net; Teviot People’s Kitchen final report (Oct 2025); Belfield & Petrescu (2025) comparative academic study; ProSHARE study", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "T", "T", "T", "T", "T", "T", "T", "M"], "nT": 7, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: C  ·  No: B"}, "link": "https://r-urban-poplar.net"}, {"id": "F-23", "corpus": "food", "name": "Indigenous Food Lab (IFL) — NĀTIFS", "place": "Minneapolis, Minnesota, USA", "period": "2014–present", "desc": "The Indigenous Food Lab (IFL) is a professional Indigenous kitchen, culinary training centre, Native-foodways research initiative and retail space (IFL Market) run by the nonprofit NĀTIFS (North American Traditional Indigenous Food Systems) in Minneapolis, Minnesota, USA. It responds to the destruction of Native foodways, which the sources link to Native health disparities including the highest diabetes prevalence in the US. It grew from Sean Sherman's catering venture The Sioux Chef (2014) into NĀTIFS (2017) and then IFL (2023, Midtown Global Market), which moved to the Woyute Thipi Building in 2025 and opened a second hub in Bozeman, Montana, with Montana State University in late 2025. Its sister restaurant Owamni won the James Beard Award for Best New Restaurant in 2022 and is relocating to the Guthrie Theater in 2026; a Julia Child Award followed in 2023.", "fam": "B", "fam2": null, "prim": ["P1", "P4", "P6", "P7", "P8"], "why": "Exemplary for Politics of Care and Self-Determination as a radically decolonial Indigenous food-sovereignty practice — the case that most fully interrogates the colonial dimension of the food system while achieving institutional recognition (James Beard, Julia Child Award) without losing its political content.", "sources": "natifs.org (blog updated through May 2026); seansherman.com; Wikipedia; Stolz (2021) Pathfinder 2(2); nativenewsonline.net (2023-10-27)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "T", "M", "T", "T", "T", "M"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: B, C  ·  No: –"}, "link": "https://natifs.org"}, {"id": "F-24", "corpus": "food", "name": "Nourish Hub — Shepherd’s Bush, London", "place": "Shepherd's Bush, London, UK", "period": "2022–present", "desc": "Nourish Hub is a community kitchen and food hub in a converted former post office on the Edward Woods Estate, Shepherd's Bush, London, run by UKHarvest with the London Borough of Hammersmith & Fulham, the borough with the city's highest food-bank dependency. It opened on 10 February 2022 and offers 'donate as you dine' daily meals (12-3pm), a teaching kitchen (NourishEd), meals-on-wheels, growing towers and co-working space. It was co-designed with RCKa architects, 200 residents and 20 organisations and funded with £2.3M from the Council plus the Mayor of London's Good Growth Fund, reported as either £850k or £1.1M. It delivered 4,000 meals-on-wheels in its first 4 months, UKHarvest recovered 616 tonnes of surplus food in 2023, and the project won the RIBA Journal MacEwen Award in 2022.", "fam": "D", "fam2": null, "prim": ["P1", "P3", "P6", "P8"], "why": "Exemplary for Contextual Sensitivity and Interdependence as a community food hub built through extensive, precisely documented co-design — the clearest European Atlas case of architectural/participatory design deliberately used as a food-welfare instrument.", "sources": "nourishhub.org.uk; ukharvest.org.uk; rcka.co.uk (incl. MacEwen Award page); goodfellowcommunications.com (Architects’ Journal case study)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "M", "W", "T", "M", "T", "M"], "nT": 4, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: C  ·  No: A, B"}, "link": "https://nourishhub.org.uk"}, {"id": "F-25", "corpus": "food", "name": "Black Panther Party — Free Breakfast for School Children Program", "place": "Oakland, California, USA", "period": "1969–early 1970s (federal suppression); some chapters continued longer", "desc": "The Free Breakfast for School Children Program was a community breakfast programme run before school in Black urban neighbourhoods of the USA by the Black Panther Party, aimed at poor Black children. It was launched on 20 January 1969 at St. Augustine's Episcopal Church, Oakland, California, by Ruth Beckford and Father Earl Neil, as part of the Party's Survival Programs ('survival pending revolution'), with political education built into the meals. By the end of 1969 it fed about 20,000 children a day across 23 chapters, more than the State of California according to 1969 Senate testimony, and it reached 36 cities at its peak. The FBI's COINTELPRO sabotaged it through false letters to donors and raids; the programme is credited with pressuring the 1975 national expansion of the School Breakfast Program.", "fam": "D", "fam2": null, "prim": ["P4"], "why": "Clearest historical anchor for the argument that Rights-Enacting ≠ top rung of a single ladder: strongest PC score while at the bottom of institutional depth.", "sources": "BlackPast.org; FoundSF; Heynen (2009) Annals AAG; Patel (2012) Food First; KQED (2026) Ruth Beckford profile; NYT (1969-06-15)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "T", "W", "M", "A", "W", "W"], "nT": 1, "depth": "Emergent", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://www.blackpast.org"}, {"id": "F-26", "corpus": "food", "name": "MigreRETE — Cittadini Protagonisti di Filiere Agroalimentari Solidali e Sostenibili", "place": "Italy", "period": "2025–present", "desc": "MigreRETE is an Italian research-action network and dossier mapping agroecological cooperatives founded by migrants and farmworkers, one of the most exploited groups in Italian agriculture. It is led by ARCS - Arci Culture Solidali with ReOrient, FairWatch, Nonna Roma and Slow Food Roma, and funded by the Chiesa Valdese 8x1000. The dossier, published in September 2025, covers five regions: Calabria, Lazio, Campania, Tuscany and Emilia-Romagna. Its flagship case is Barikamà in Rome, a cooperative making artisan yogurt, founded in 2014 by survivors of the 2010 Rosarno revolt, with about 10 members and a €25,000 crowdfunding raised in one month; a second case is Dokulaa in Catania, founded after the pandemic.", "fam": "A", "fam2": null, "prim": ["P1", "P3", "P4", "P6"], "why": "Distinctive Italian corpus case inverting the typical migrant/food-welfare relationship: migrants as producers/founders, not recipients. Useful contrast with SAFSC on institutional strategy (market-building vs. claims-making).", "sources": "arcsculturesolidali.org (2025-09-26); reorient.it; Il Fatto Quotidiano (2025-09-30); Collettiva.it (2025-03-22)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "W", "T", "M", "M", "W"], "nT": 4, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: A, C  ·  No: B"}, "link": "https://arcsculturesolidali.org"}, {"id": "F-27", "corpus": "food", "name": "Incredible Edible Todmorden (IET)", "place": "Todmorden, West Yorkshire, UK", "period": "2008–present", "desc": "Incredible Edible Todmorden (IET) is a guerrilla-gardening and community urban-agriculture movement that plants food in public space in Todmorden, West Yorkshire, a town of about 16,000 people. It is open to local residents and runs on a 'three spinning plates' model (community, business, learning), with a toolkit designed for reinterpretation elsewhere. First planting took place in March 2008, the Ltd/CIC was set up in 2010 and the Network was formalised in 2012; about 70 sites in Todmorden have been planted with vegetables, herbs and fruit without permission. The movement now counts 1,000+ groups worldwide (other sources give 700+), and its Right to Grow campaign, asking local authorities to guarantee community land for growing, was debated in the House of Lords, passed as a Hull council motion in 2023 and was cited in UK Government Food Policy in July 2025.", "fam": "A", "fam2": null, "prim": ["P1", "P3", "P4", "P6", "P7", "P8", "P9"], "why": "Exemplary for Collective Responsibility, Ecology of Care, Politics of Care and Institutionalisation — this card’s most significant finding is that IET evolved from a purely informal, non-institutional practice into a case with genuine dated ongoing policy influence, worth treating as a case study of informal commons maturing into rights-based advocacy without losing grassroots character.", "sources": "incredible-edible-todmorden.co.uk; Right to Grow campaign materials; UK Government Food Policy (2025-07); Hull council motion (2023)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "M", "T", "T", "T", "T"], "nT": 7, "depth": "Transformative", "re": "P", "reCrit": "Yes: B  ·  Partly: A  ·  No: C"}, "link": "https://incredible-edible-todmorden.co.uk"}, {"id": "F-28", "corpus": "food", "name": "Tribal Elder Food Box Program (TEFBP) — GLIFC", "place": "Wisconsin, USA", "period": "2021–present", "desc": "The Tribal Elder Food Box Program (TEFBP) delivers monthly, culturally specific food boxes to tribal elders aged 55+ of Wisconsin's 11 Tribal Nations, with urban distribution in Milwaukee, Green Bay and Madison. It is coordinated by the Great Lakes Intertribal Food Coalition (GLIFC), formed in 2022 by elected representatives of the 11 Tribes, with Feeding America Eastern Wisconsin as logistics and fiscal sponsor, and sources food from Native and local producers. The pilot began in August 2021 with 7 Tribes (10,800 boxes); all 11 joined in 2022 (24,400 boxes, 59% Native-sourced) and 2024 saw 31,230 boxes from 40 producers. After USDA ended Wisconsin's federal LFPA funding in March 2025, the state allocated $1.5M a year; in 2025 the programme worked with 70+ producers, invested $2.43M locally and passed 127,000+ cumulative boxes, with contracts running into 2026-27.", "fam": "B", "fam2": null, "prim": ["P1", "P4", "P5", "P6", "P7", "P9"], "why": "Exemplary for Contextual Sensitivity, Institutionalisation, Politics of Care and Self-Determination as a system institutionalising Indigenous food sovereignty as public policy — one of very few corpus cases where a real funding crisis and its resolution can both be traced in the documentary record.", "sources": "feedingamericawi.org/our-programs/tribal (updated April 2026); greatlakesintertribalfood.org; firstnations.org; cnn.com (2025-03-30); cheesereporter.com (2025-03-21)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "W", "M", "T", "T", "T", "T", "M", "T"], "nT": 6, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": "https://greatlakesintertribalfood.org"}, {"id": "F-29", "corpus": "food", "name": "Soul Fire Farm", "place": "Grafton/Petersburg, Upper Hudson Valley, New York, USA", "period": "2006–present", "desc": "Soul Fire Farm is an Afro-Indigenous-centred community farm and training centre of about 80 acres in Grafton, New York, on Stockbridge-Munsee Mohican territory, founded in 2006 and opened in 2010-11 by Leah Penniman and Jonah Vitale-Wolff. It trains BIPOC farmers and serves households including in Albany's majority-Black South End. It runs the sliding-scale Ujamaa Farm Share CSA (SNAP/EBT accepted, free Solidarity Shares for refugees and formerly incarcerated people), BIPOC farmer training, a reparations programme and the Victory Bus Project; the land is held by a housing co-op in which the land has a voting, veto-empowered seat. The CSA reaches about 100 families a week, 350+ farmers have been trained since 2011 against a goal of 10,000, 10,000 people were served in 2019, and soil organic matter rose from 3% to 12%.", "fam": "B", "fam2": null, "prim": ["P1", "P2", "P4", "P5", "P6", "P7", "P8"], "why": "Exemplary for Politics of Care, Self-Determination and Ecology of Care as a food-sovereignty practice rooted in Black liberation, with the land itself holding a formal governance role — most complete Atlas case of a farm functioning as a political community presidium.", "sources": "soulfirefarm.org; Southard (2021) Agriculture and Human Values 38; Emergence Magazine (2019-10-07); Oxford Magazine (Oxfordshire)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "M", "T", "T", "T", "T", "T", "W"], "nT": 7, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: B  ·  No: C"}, "link": "https://soulfirefarm.org"}, {"id": "F-30", "corpus": "food", "name": "Cocina CoLaboratorio (Colaboratory Kitchen)", "place": "Loma Bonita and two other regions, Mexico", "period": "2018–present", "desc": "Cocina CoLaboratorio is a transdisciplinary situated practice of chefs, artists, farmers, scientists and community members working on biocultural food systems, food sovereignty and community innovation in Loma Bonita (Chiapas), Santo Domingo Tomaltepec (Oaxaca) and Xochimilco (Mexico City), Mexico. It works through three 'arenas' (the Kitchen, the Agroecological Plot and the Living Biocultural Archive of seeds, recipes, sounds and stories), community innovation labs, Radio Móvil and participatory research. It started with a 2018 pilot of 15 people and took its three-territory structure and dedicated funding from 2020, with support from UNAM, Wageningen University, CONAHCYT and CONABIO/GEF. It now has about 100 regular participants and, by 2025, 4 academic papers, 30 student projects and 4 exhibitions, including extensions to London (Delfina Foundation, 2022) and Berlin (nGbK, 2024).", "fam": "B", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8"], "why": "Exemplary for Contextual Sensitivity and Ecology of Care as a Global South transdisciplinary practice most fully embodying situated, relational, ecological care design — and equally exemplary for Politics of Care, Responsiveness and Self-Determination. The Atlas case that most radically integrates food sovereignty, biocultural heritage, participatory design and care ethics into a single, peer-reviewed, self-critical practice.", "sources": "Project peer-reviewed academic publications; archivo.bio (Living Biocultural Archive); Asquel Carvajal (2023) on Santo Domingo women's care work; team self-assessment (Oct 2022)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "T", "T", "T", "T", "W"], "nT": 8, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: C  ·  No: B"}, "link": "https://www.delfinafoundation.com/in-residence/cocina-colaboratorio/"}, {"id": "F-31", "corpus": "food", "name": "Rete Semi Rurali (RSR)", "place": "Scandicci (Florence), Italy", "period": "2007–present", "desc": "Rete Semi Rurali (RSR) is a second-level association, a network of associations, working to protect agricultural biodiversity, with its legal seat in Scandicci, Tuscany, Italy, and further hubs in Emilia-Romagna, Lombardy and Veneto. It works mainly with farmers already engaged in organic and peasant agriculture, and was formalised after seven years of informal activity. It runs campaigns for peasant seed protection in EU and international law, participatory research (SELIANTHUS, CEREA+CONNECT, RevAgroForMed), publications (Pentagora), the 700 Grani pasta supply chain, coordination of the Bagno a Ripoli organic district (2026) and Alpine climate-adaptation programmes. It has 42 member associations (unconfirmed), belongs to the Let's Liberate Diversity network (170 organisations in 21 countries), had a Quirinale presidential meeting in 2019, and proposes a European Benefit-Sharing Fund under the FAO Treaty's Farmers' Rights (Article 9).", "fam": "A", "fam2": null, "prim": ["P1", "P3", "P4", "P6", "P7"], "why": "Exemplary for Ecology of Care, Responsiveness, Politics of Care and Institutionalisation — a network protecting agricultural biodiversity as a common good with real institutional traction across municipal, regional, national and international-treaty levels; before food, there is seed.", "sources": "rsr.bio; Pentagora series; Edizioni Semirurali; ECLLD/Let’s Liberate Diversity network materials", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "M", "T", "T", "M", "M"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: B  ·  No: C"}, "link": "https://rsr.bio"}, {"id": "F-32", "corpus": "food", "name": "Seikatsu Club Consumers’ Co-operative Union (SCCCU)", "place": "Tokyo, Japan", "period": "1965–present", "desc": "The Seikatsu Club Consumers' Co-operative Union (SCCCU) is a federation of 33 consumer cooperatives in 21 Japanese prefectures with about 341,000-400,000 members, founded and largely made up of housewives. It began in 1965 when 200 housewives in Setagaya, Tokyo, formed a milk-buying group after postwar food-contamination scandals (Minamata mercury); the federal union was launched in 1990. Members are organised in han units of 8-10 families that pre-order 'consumer materials' collectively, with participatory product specification, direct producer audits and the Co-developed Rice Fund (1993), which shares risk between consumers and producers. The Group includes 600+ workers' collectives, a welfare programme of 17+ billion yen and Seikatsu Club Energy Co., has been GMO-Free since 1997, and has seen 100+ members elected to local government since 1979 through the Seikatsusha Network.", "fam": "G", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8"], "why": "Exemplary for Interdependence, Collective Responsibility and Institutionalisation as the most advanced cooperative food system documented worldwide; the only Asian case in this corpus and structurally essential to its geographic balance; the Co-developed Rice Fund is arguably the single most concrete collective-responsibility mechanism identified anywhere in this Atlas.", "sources": "seikatsuclub.coop; Right Livelihood Award (1989) documentation", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "T", "T", "T", "T", "W"], "nT": 8, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, C  ·  Partly: B  ·  No: –"}, "link": "https://seikatsuclub.coop"}, {"id": "F-33", "corpus": "food", "name": "Shenzhen Smart Food Bank — Futian District Smart Cabinet System", "place": "Futian District, Shenzhen, China", "period": "2022–present", "desc": "The Shenzhen Smart Food Bank is a technology-based food bank in Futian District, Shenzhen, China, initiated and run by the Futian District Civil Affairs Bureau. It uses QR-code-activated refrigerated smart cabinets at community centres and subway exits; corporate-donated near-expiry food is screened, transported by cold chain and loaded daily by volunteers. Eligible users are verified through a government database app, community grid managers help residents with limited digital skills, and after 8pm the cabinets open to the general public to prevent waste. It launched in May 2022 according to three 2025-26 sources and had 22 cabinets by April 2026, up from about 10 in a December 2024 source; reported savings are 100-195 tonnes of food and 200-390 tonnes of avoided CO2 (2024-2026 figures, varying by source).", "fam": "D", "fam2": null, "prim": [], "why": "Exemplary for Attentiveness and Institutionalisation as a government-initiated, tech-enabled food bank operationalising dignity-by-design at city scale. Distinctive for its Chinese context: a model without Western church-based charity networks, building a food-welfare public utility through digital technology grafted onto existing government social infrastructure rather than NGO/civil-society mobilisation. Useful contrast case against the corpus's more contested Rights-Enacting candidates.", "sources": "Xinhua; CGTN; People’s Daily; China Daily; Sixth Tone; Blue Whale/Futu News", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "W", "W", "A", "W", "W", "M", "M", "M"], "nT": 0, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://www.sz.gov.cn/en_szgov/news/latest/content/post_12576550.html"}, {"id": "F-34", "corpus": "food", "name": "South African Food Sovereignty Campaign (SAFSC)", "place": "South Africa", "period": "2015–present", "desc": "The South African Food Sovereignty Campaign (SAFSC) is a national alliance working in all nine provinces of South Africa that unites small farmers, farmworkers, the landless, and environmental-justice and solidarity-economy movements, placing 'the hungry, small-scale farmers, the landless and workers' in its leadership. It grew out of province-wide dialogues convened by COPAC in 2014 and was launched in February-March 2015 by 50+ founding organisations. It drafted the People's Food Sovereignty Act, launched at a People's Parliament on 12 November 2016, and a Climate Justice Charter, and has built 30+ local hubs since 2017. It has held a seat on the SAHRC Section 11 Committee since 2018 and in 2024 marched to Parliament and the Cape Town Metro and delivered a Memorandum of Demands to named ministers; the People's Food Sovereignty Act has not been enacted.", "fam": "C", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P6", "P7", "P8"], "why": "Among the strongest Rights-Enacting cases identified in the corpus on all three criteria simultaneously; rare Type B case with dense sourced Care Ethics vocabulary in its own self-theorisation.", "sources": "safsc.org.za; copac.org.za; Satgar (2024) Cambridge UP; Satgar & Cherry (2020) Globalizations 17(2)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "M", "T", "T", "T", "W"], "nT": 7, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": "https://safsc.org.za"}, {"id": "F-35", "corpus": "food", "name": "The Okra Project", "place": "Brooklyn, New York, USA", "period": "2018–present", "desc": "The Okra Project is a mutual-aid organisation based in Brooklyn, New York, addressing food insecurity among Black transgender, nonbinary and gender-expansive people, with aid reaching nearly every US state. It was founded in January 2018 by Ianne Fields Stewart and Chef Meliq August, and first hired Black trans chefs to cook African-diasporic meals in recipients' homes in New York, New Jersey and Philadelphia; COVID forced a shift to grocery stipends, memorial mental-health funds and mutual aid. It has funded 21 programmes, received 11,000+ applications and given $260,000+ in direct food and housing support to 1,389 people, funding only 13% of applicants each year; FY2024 showed $291K revenue, $374K expenses and $146,724 net assets. It became an independent 501(c)(3) in January 2024; in October 2024 former ED Dominique Morgan was charged with theft from the organisation, and ED Gabrielle Souza (since 2023) leads a rebuild.", "fam": "E", "fam2": null, "prim": ["P1", "P5", "P8"], "why": "Distinctive corpus case for Contextual Sensitivity and Self-Determination: peer-staffing model (community members cooking for community members) as central design principle; also a rare, honestly documented case of institutional fragility (publicly reported governance/financial crisis), a useful counterpoint when discussing risks of under-resourced identity-specific mutual aid.", "sources": "Forbes (2020-06-12); NYT (2024-10-29); The Advocate (2025-11, Souza op-ed); Wikipedia \"The Okra Project\"; GuideStar/Candid; ProPublica Nonprofit Explorer", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "M", "T", "M", "M", "T", "A"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://theokraproject.com"}, {"id": "F-36", "corpus": "food", "name": "Disco Soup / Schnippeldisko", "place": "Global", "period": "2012–present", "desc": "Disco Soup, or Schnippeldisko, is a public event format against food waste that began in January 2012 in Berlin, Germany, as a 'protest soup' organised by Slow Food Deutschland and partners. It is open to anyone and uses a deliberately festive format to remove the stigma of eating 'ugly' food. Participants peel, cut and cook 'imperfect' vegetables, rejected by markets for their shape or size but perfectly edible, into a collective soup while DJs play. The first edition, in the Cabuwazi circus tent, fed hundreds of people. The format then spread internationally as World Disco Soup Day, organised by local groups and the Slow Food Youth Network, and has reached thousands of participants in dozens of countries.", "fam": "E", "fam2": null, "prim": ["P3", "P4", "P7"], "why": "Exemplary for Attentiveness and Ecology of Care: turns ecological care into a global, locally replicable movement; pioneer in using the party as a political care device (\"protest soup\").", "sources": "slowfood.com/events/world-disco-soup-day · slowfoodyouthnetwork.org · Stuart, T. (2009), Waste, Penguin Books.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "T", "T", "W", "M", "T", "M", "W"], "nT": 3, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://www.slowfood.com/events/world-disco-soup-day"}, {"id": "F-37", "corpus": "food", "name": "Conflict Kitchen", "place": "Pittsburgh, Pennsylvania, USA", "period": "2010–2017", "desc": "Conflict Kitchen was a public-art takeout restaurant window in East Liberty, Pittsburgh, Pennsylvania, USA, conceived by Jon Rubin, a Carnegie Mellon University professor, and artist Dawn Weleski. It served only food from countries in conflict with the USA: Iran, Afghanistan, Cuba, North Korea, Venezuela, Palestine and the Iroquois Nation. Each iteration was based on field research and interviews with residents and diaspora members, and food wrappers carried first-person quotes from people in the featured country. The menu rotated every 3-5 months across these seven cuisines, and a 2014 Palestinian menu led to a documented controversy. It operated from 2010 to 2017 and then closed.", "fam": "F", "fam2": null, "prim": ["P1"], "why": "Exemplary for Politics of Care and Attentiveness as a public-art practice using food to produce political empathy; the only case in this batch explicitly using food as an artistic medium with a documented political/security dimension.", "sources": "conflictkitchen.org · CK Palestine Book (2024), squarespace.com", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "W", "W", "M", "A", "W", "A"], "nT": 1, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://conflictkitchen.org"}, {"id": "F-38", "corpus": "food", "name": "Cucine Popolari", "place": "Bologna, Italy", "period": "2015–present", "desc": "Cucine Popolari is a network of community kitchens in Bologna, Italy, promoted by Roberto Morgantini and the CIVIBO founding group; CIVIBO ODV was established in October 2014 from Auser Volontariato Bologna and Fondazione Duemila. The kitchens serve free hot meals to a deliberate mix of referred vulnerable guests and any neighbourhood resident who wants company, avoiding a visibly separate table for poor people. The first kitchen opened on 21 July 2015 in via del Battiferro, Navile (Bolognina), and the work relies on unpaid volunteers. Four kitchens now operate in Bologna (Battiferro, San Donato/San Vitale with Opera Padre Marella, Saffi and Savena), and the model has been replicated in 5 Italian cities, per the source. Since 2023 Cibo.net, a digital surplus-exchange platform, has connected more than 40 organisations.", "fam": "D", "fam2": null, "prim": ["P4", "P5", "P8"], "why": "Exemplary for Contextual Sensitivity and Interdependence as a popular-kitchen model surpassing assistential-canteen logic; the Italian case that most explicitly theorises care for relationship as the primary objective, not the meal itself.", "sources": "cucinepopolari.org · CIVIBO institutional documentation", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "T", "T", "M", "W", "T", "W"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://cucinepopolari.org"}, {"id": "F-39", "corpus": "food", "name": "FoodForward SA + Food Gardens Connect", "place": "South Africa", "period": "2009–present", "desc": "FoodForward SA (FFSA), founded in Cape Town in 2009, is a food-redistribution organisation described as the largest in Africa, operating nationally across all 9 South African provinces. It supplies surplus food to 2,500 Beneficiary Organisations, which reach people in need, using the FoodShare digital platform. Its Food Gardens Connect (FGC) programme, with Soil for Life as training partner, targets unemployed community members in under-served areas and turns them into agricultural producers through a guaranteed buy-back mechanism. In 2024/25 FFSA distributed 83 million meals, reaching 935,000 people daily at a cost of R0.50 per meal. FoodForward SA grows seedlings in its own greenhouses, gives them to participants, teaches agroecology and offers a guaranteed buy-back of surplus harvest, so that growers obtain fresh food for their households and a regular income.", "fam": "D", "fam2": null, "prim": ["P1", "P2", "P6", "P8"], "why": "Relevant as Africa’s largest national food-security infrastructure with digital innovation (FoodShare), and as a laboratory for transition toward food sovereignty (FGC).", "sources": "foodforwardsa.org · Harvard Law School Food Law and Policy Clinic & GFN (2022), Food Donations Policy Atlas.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "M", "W", "W", "T", "M", "T", "W"], "nT": 4, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: B  ·  No: A, C"}, "link": "https://foodforwardsa.org"}, {"id": "F-40", "corpus": "food", "name": "The Food Bank Singapore (FBSG)", "place": "Singapore", "period": "2012–present", "desc": "The Food Bank Singapore (FBSG), founded in 2012, is Singapore's first foodbank accredited by the Global FoodBanking Network and operates entirely on private funding, without government support. It serves people and families facing food insecurity through more than 370 Beneficiary Partners, including family service centres, homes, soup kitchens, voluntary welfare organisations and schools. It collects surplus from companies, retailers, restaurants and consumers and redistributes it; its Mobile Food Pantry, a vending-machine model sited in residential heartland neighbourhoods, gives 24/7 access through a prepaid card. FBSG reaches more than 300,000 people and 100,000 families, and its Hunger Report (2018 and 2022, with the Lien Centre for Social Innovation, SMU) found that 1 in 10 Singaporeans face food insecurity.", "fam": "D", "fam2": null, "prim": ["P1", "P2"], "why": "Exemplary for Attentiveness and Institutionalisation of Care through technology as a device for recognising need — the 24/7 vending machine eliminates time as a barrier; the Hunger Report is the most relevant act of political attentiveness, making food insecurity visible in a high-income city.", "sources": "foodbank.sg · Lien Centre for Social Innovation & FBSG (2018, 2022), The Hunger Report, SMU.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "M", "M", "W", "M", "M", "W", "W"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: B  ·  No: A, C"}, "link": "https://foodbank.sg"}, {"id": "F-41", "corpus": "food", "name": "ReFoodGees", "place": "Rome, Italy", "period": "2017–present", "desc": "ReFoodGees is a volunteer food-recovery initiative in Rome, Italy, started in September 2017 by Viola De Andrade Piroli after meeting Paolo Hutter of RePoPP at Turin's Porta Palazzo market. It began with 2 to 3 friends at Mercato Alberone collecting unsold produce that traders would otherwise discard, and now runs a stall at the Esquilino Market, in a multiethnic neighbourhood, open to all and with refugees involved as co-organisers as well as recipients. Its 'Ai Fornelli' programme offers partially paid cooking work, mainly for migrant women and homeless people. The group saves 800 to 1,200 kg of food each week and more than 200,000 kg since 2017, and received symbolic recognition from the Comune di Roma in 2024.", "fam": "D", "fam2": null, "prim": ["P3", "P8"], "why": "Exemplary for Interdependence and Collective Responsibility as an intercultural food-recovery practice including refugees as co-protagonists; the Atlas case most explicitly using food as a medium for building interdependence between different cultures in a multiethnic urban market.", "sources": "refoodgees.org · ilgiornaledelcibo.it/refoodgees-roma-salvacibo", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "W", "T", "W", "W", "M", "M", "T", "A"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: C  ·  No: A, B"}, "link": "https://refoodgees.org"}, {"id": "F-42", "corpus": "food", "name": "Beacon Food Forest", "place": "Seattle, Washington, USA", "period": "2012–present", "desc": "Beacon Food Forest is a seven-layer permaculture agroforestry site on a south-facing slope by the Beacon Hill Reservoir, on Seattle Public Utilities land in Seattle, Washington, USA. It serves the ethnically diverse Beacon Hill neighbourhood, where 44% of residents are foreign-born, with multilingual signage in 5 languages, ADA-accessible paths (Phase 2) and public recognition of Duwamish land. The project began in 2009 as a Permaculture Design Course final project taught by Marisha Auerbach and Kelda Miller; a student group led by Jacqueline Cramer and Glenn Herlihy chose the site and, after public meetings and negotiation with the city, opened it in 2012. It includes an Indigenous medicinal garden and a Food Bank Plot that donates more than 700 lbs of produce to local food banks each year, and it has been open since 2012.", "fam": "A", "fam2": null, "prim": ["P1", "P3", "P6", "P7", "P9"], "why": "Exemplary for Ecology of Care and Self-Determination as an urban food commons on public land with real collective governance; the clearest case in this batch of food sovereignty realised as physical, productive infrastructure rather than only advocacy.", "sources": "beaconfoodforest.org · Pacific Horticulture (2023) · Edible Seattle (2012)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "W", "T", "M", "M", "T", "T", "M", "T"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: B, C  ·  No: –"}, "link": "https://beaconfoodforest.org"}, {"id": "F-43", "corpus": "food", "name": "SOUL Food Project EU", "place": "Europe", "period": "2023–2025", "desc": "SOUL Food Project EU is an Erasmus+ Strategic Partnership funded by the European Commission that uses culinary skills as a means of social and professional integration. It is aimed explicitly at migrant women, identified as facing a double vulnerability linked to gender and migration status. The project offers a modular, integrated pathway that treats participants' existing cooking abilities as cultural heritage and professional competence, and combines them with citizenship education on social systems, rights and local services, and with digital skills. It is delivered by a consortium of partners across several EU countries and ran from 2023 to 2025, with the project ending in 2025.", "fam": "H", "fam2": null, "prim": ["P4", "P5", "P6"], "why": "Exemplary for Interdependence and Self-Determination as a European programme using food as a tool of integration and empowerment for migrant women; a complementary dimension to the corpus’s cases of direct food production or redistribution.", "sources": "soulfoodproject.eu", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "T", "T", "T", "A", "M", "A"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://soulfoodproject.eu"}, {"id": "F-44", "corpus": "food", "name": "Queer Soup Night", "place": "Brooklyn, New York, USA", "period": "2017–present", "desc": "Queer Soup Night is a recurring, chapter-based soup event network that began in Brooklyn, New York, USA, and has spread through local chapters across the country. It was started on 8 November 2016, the night of Donald Trump's election, by Liz Alpern, chef and co-founder of The Gefilteria, who invited fellow protesters to share a pot of soup. Local chapters cook and serve soup on a solidarity-pricing basis, with a suggested donation of $10 to 20, so that those who can pay more subsidise those who cannot. Proceeds go to organisations working on queer rights, including housing, immigration, anti-violence and civil rights. Events are alcohol-free and non-centralised, with shared minimum standards and local chapter autonomy.", "fam": "E", "fam2": null, "prim": ["P1", "P3", "P8"], "why": "Exemplary for Collective Responsibility and Interdependence as a practice of joyful political resistance through food; the clearest case in this batch explicitly theorising joy and pleasure as components of political care and resistance.", "sources": "queersoupnight.com · Civil Eats · BuzzFeed · Hey Alma", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "W", "T", "M", "M", "M", "A", "T", "W"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://queersoupnight.com"}, {"id": "F-45", "corpus": "food", "name": "Mariposas Rebeldes", "place": "Atlanta, Georgia, USA", "period": "2020–present", "desc": "Mariposas Rebeldes is an informal collective in Atlanta, Georgia, USA, creating community space for queer and trans people of colour, with particular attention to Latinx and Indigenous people, to learn about plants and agriculture. It grew out of conversations between Wvkto Tristan and Israel Tordoya during a 2019 trip to Mexico and started in February 2020 as a garden at Tordoya's home; the name links queer identity (mariposa), resistance and the migration of monarch butterflies. It now operates Bosque Itzpapalotl in South Atlanta, on land it recognises as unceded Muscogee (Creek) land, and takes part in the coalition opposing 'Cop City'. The source cites a figure of 1 in 4 LGBTQIA+ adults as food insecure; the collective faced an eviction in 2020 and has been active since February 2020.", "fam": "B", "fam2": null, "prim": ["P1", "P3", "P4", "P6", "P7"], "why": "Exemplary for Politics of Care and Ecology of Care as a radically intersectional decolonial food-sovereignty practice connecting queer identity, Indigenous heritage and land justice.", "sources": "mariposasrebeldes.org · opencollective.com/mariposasrebeldes · atmos.earth", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "T", "M", "T", "T", "M", "A"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: B, C  ·  No: –"}, "link": "https://mariposasrebeldes.org"}, {"id": "F-46", "corpus": "food", "name": "Fermenti (Municipio VIII, Roma)", "place": "Rome, Italy", "period": "2023–present", "desc": "Fermenti is a right-to-food project active in Municipio VIII of Rome, Italy, since 2023, within Roma Capitale's Poli Civici Integrati di Mutualismo Sociale (PCMS) framework. It addresses social disadvantage in Municipio VIII, a diverse and economically mixed area that includes Ostiense. Its stated mission is to generate participatory processes around the right to food and resilient, inclusive and sustainable local food systems. It runs four interconnected programmes with more than 10 partner civil-society organisations: a social support desk, a community kitchen, an urban-fruit recovery project and Festival PROVVISTE, a three-day public event on the right to food as a civic practice.", "fam": "C", "fam2": null, "prim": [], "why": "Exemplary for Institutionalisation of Care and Collective Responsibility as a neighbourhood-scale project operationalising the right to food as collective civic practice; connects directly to Consiglio del Cibo Roma (this corpus).", "sources": "fermentiottavo.it · instagram.com/fermenti.ottavo", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "W", "M", "M", "M", "M", "M", "M", "M"], "nT": 0, "depth": "Emergent", "re": "P", "reCrit": "Yes: A  ·  Partly: B  ·  No: C"}, "link": "https://fermentiottavo.it"}, {"id": "F-47", "corpus": "food", "name": "Andria Food Policy Hub", "place": "Andria, Puglia, Italy", "period": "2023–present", "desc": "The Andria Food Policy Hub is a local food-policy initiative of the Comune di Andria in Puglia, Italy, arising from a municipal public tender for social innovation within a Regione Puglia FESR funding framework. It serves Andria, a city of about 97,000 inhabitants in the province of Barletta-Andria-Trani, and aims to connect local food-system actors, including farmers, schools, markets and GAS. The Comune converted the Chiostro di San Francesco, a partly disused historic monument, into the Hub's seat, and the City Council approved a food regulation unanimously. The Hub reaches more than 800 students a year through food education, results are documented for the first year only, and a Food Council is still being formed.", "fam": "C", "fam2": null, "prim": ["P2", "P7", "P9"], "why": "Exemplary for Institutionalisation of Care and Contextual Sensitivity as a local food-policy model for a medium-sized Italian city.", "sources": "osservatoriofoodpolicy.it/esperienza/food-policy-hub-di-andria · governareilterritorio.net", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "T", "M", "M", "M", "M", "T", "M", "T"], "nT": 3, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: B  ·  No: A, C"}, "link": "https://osservatoriofoodpolicy.it/esperienza/food-policy-hub-di-andria"}, {"id": "F-48", "corpus": "food", "name": "Cresco CSA", "place": "Valle Varaita, Cuneo, Italy", "period": "2020–present", "desc": "Cresco CSA is a community-supported agriculture farm in Valle Varaita, an Occitan mountain area at the foot of Monviso in the province of Cuneo, Italy, at risk of depopulation. It was founded by Lorenzo Barra as an agricultural enterprise and became a CSA when Pietro Cigna joined. Member families pay an annual upfront quota, share the farm's agricultural risks and benefits and contribute time; the farm manages 7,500 sqm at 500 to 900 m altitude using regenerative practices. The first auction in December 2020 drew 82 participants, and there are now 85 member families. Cresco belongs to RICSA, the Italian CSA Network, and takes part in the Numes research project; it has no solidarity-access mechanism for families unable to pay the quota.", "fam": "G", "fam2": null, "prim": ["P3", "P7"], "why": "Exemplary for Collective Responsibility and Ecology of Care as a mountain CSA with an explicit anti-capitalist vocation; relevant as a food-sovereignty model based on solidarity economy in a marginal, depopulation-risk territory.", "sources": "noisiamocresco.it · cibotoday.it · Altreconomia (2022) · RICSA", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "W", "T", "W", "M", "M", "T", "M", "W"], "nT": 2, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://noisiamocresco.it"}, {"id": "F-49", "corpus": "food", "name": "CORE — Coltivare la Resilienza in Burkina Faso", "place": "Pabré, Ouagadougou, Burkina Faso", "period": "2022–present", "desc": "CORE (Coltivare la Resilienza in Burkina Faso) is a development-cooperation project run by WeWorld with Boorea and DEAFAL, supported by Regione Emilia-Romagna, in Pabré, a peri-urban area north of Ouagadougou, Burkina Faso. It targets the most vulnerable families, predominantly internally displaced people and women, in a country facing humanitarian and political crisis since 2022, with 1.7 million people displaced nationally. It aims to improve nutrition and food security through drip irrigation, agricultural training and independent production capacity. The source cites about €45M in total Italian cooperation funding and a city population of 2.5 million; DEAFAL is also a partner of Fattoria del Dono. The source advises that the project's current status should be re-verified.", "fam": "A", "fam2": null, "prim": ["P1", "P6"], "why": "Exemplary for Responsiveness and Contextual Sensitivity as a systematic capacity-building response to acute food insecurity in a humanitarian-crisis context; directly connected to Fattoria del Dono (this corpus) via shared partner DEAFAL.", "sources": "weworld.it · acra.it · ouagadougou.aics.gov.it", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "A", "NV", "T", "M", "W", "W"], "nT": 2, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://www.weworld.it"}, {"id": "F-50", "corpus": "food", "name": "Jigeenyi", "place": "Turin, Italy", "period": "2021–present", "desc": "Jigeenyi is a training and hospitality project in Turin
