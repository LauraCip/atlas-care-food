<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care(full) Design for Urban Food Welfare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Xanh+Mono:ital@0;1&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
/* Layout: a field guide and a specimen atlas — guide pages read like index cards, the Atlas like a drawer of specimens */
:root{
  --bg:#F7EFE6; --surface:#FFFAF4; --sunk:#EFE4D7; --ink:#2B2522; --muted:#6B5F57; --line:#E2D4C4;
  --terra:#C87456; --sage:#7E8F62; --rose:#C9607A; --maroon:#6E2C2C; --on-accent:#FFFAF4;
  --fA:#7E8F62; --fB:#6E2C2C; --fC:#B5643F; --fD:#C9607A; --fE:#B08A2E; --fF:#4F6B7A; --fG:#5E7A4A; --fH:#8A4F7D;
  --display:"Xanh Mono", "Courier New", ui-monospace, monospace;
  --body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --s-xs:.8125rem; --s-sm:.9375rem; --s-md:1.0625rem; --s-lg:1.375rem; --s-xl:2rem; --s-xxl:clamp(2.4rem,6vw,4.2rem);
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1614; --surface:#251E1B; --sunk:#2E2522; --ink:#F2E8DD; --muted:#B8A99C; --line:#3E332E;
  --terra:#E2906F; --sage:#A9B98C; --rose:#E68AA0; --maroon:#E3A39A; --on-accent:#1C1614;
  --fA:#A9B98C; --fB:#E3A39A; --fC:#E2906F; --fD:#E68AA0; --fE:#D9B45C; --fF:#8DB0C2; --fG:#9CBF85; --fH:#CF9AC4; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1614; --surface:#251E1B; --sunk:#2E2522; --ink:#F2E8DD; --muted:#B8A99C; --line:#3E332E;
  --terra:#E2906F; --sage:#A9B98C; --rose:#E68AA0; --maroon:#E3A39A; --on-accent:#1C1614;
  --fA:#A9B98C; --fB:#E3A39A; --fC:#E2906F; --fD:#E68AA0; --fE:#D9B45C; --fF:#8DB0C2; --fG:#9CBF85; --fH:#CF9AC4; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--s-md);line-height:1.55;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:72rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prose{max-width:40rem}
.eyebrow{font-size:var(--s-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-block:.7rem}
.brand{font-family:var(--display);font-size:1.25rem;text-decoration:none;margin-right:auto}
.brand em{font-style:normal;color:var(--terra)}
nav.main{display:flex;gap:.25rem;flex-wrap:wrap}
nav.main a{text-decoration:none;padding:.35rem .7rem;border-radius:999px;font-weight:500;font-size:var(--s-sm)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.main a:hover{background:var(--sunk)}
nav.main a[aria-current="page"]:hover{background:var(--ink)}
main{padding-block:2rem 4rem}
.view{display:grid;gap:2.5rem}
/* home */
.hero{display:grid;gap:1.25rem;padding-block:1.5rem 0}
.hero h1{font-size:var(--s-xxl)}
.hero h1 em{font-style:italic;color:var(--terra)}
.hero .lede{font-size:var(--s-lg);line-height:1.4;max-width:38rem;color:var(--muted)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.door{display:grid;gap:.5rem;align-content:start;text-decoration:none;padding:1.25rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s}
.door:hover{border-color:var(--terra)}
.door h2{font-size:var(--s-xl)}
.door .count{font-family:var(--display);font-size:var(--s-sm);color:var(--terra)}
.door p{color:var(--muted);font-size:var(--s-sm)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:2rem;align-items:start}
.sec-h{display:grid;gap:.4rem;margin-bottom:1rem}
.sec-h h2{font-size:var(--s-xl)}
.sec-h p{color:var(--muted);max-width:40rem}
table.start{width:100%;border-collapse:collapse;font-size:var(--s-sm)}
table.start td,table.start th{padding:.6rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.start th{font-weight:600;color:var(--muted);font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.06em}
.tbl{overflow-x:auto}
.wm-link{font-family:var(--display);text-decoration:none;border-bottom:1px solid var(--terra);white-space:nowrap}
/* manifesto */
.manifesto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding-block:clamp(1.5rem,5vw,3.5rem);display:grid;justify-items:center}
.manifesto .inner{max-width:38rem;display:grid;gap:1.1rem;padding-inline:clamp(1rem,5vw,3rem)}
.manifesto h1{font-size:clamp(2.2rem,5vw,3.4rem);text-align:left}
.manifesto .sub{font-family:var(--display);font-style:italic;color:var(--terra);font-size:var(--s-lg);line-height:1.3}
.manifesto p{font-size:1.08rem}
.manifesto p.oltre::first-line{}
.manifesto p.oltre b{font-family:var(--display);font-weight:400;color:var(--maroon);font-size:1.25rem;display:block;margin-bottom:.15rem}
.manifesto p.big{font-family:var(--display);font-size:1.45rem;line-height:1.3;color:var(--maroon)}
.manifesto p.close{border-top:1px solid var(--line);padding-top:1.2rem;font-weight:600}
.card-note{font-size:var(--s-xs);color:var(--muted)}
/* guide */
.guide{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:2.5rem;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.5rem);display:grid;gap:.15rem;font-size:var(--s-sm)}
.toc a{text-decoration:none;padding:.3rem .5rem;border-radius:4px;color:var(--muted)}
.toc a:hover{background:var(--sunk);color:var(--ink)}
.toc .n{font-family:var(--display);color:var(--terra);display:inline-block;width:1.6rem}
.gsec{display:grid;gap:1.25rem;padding-bottom:2.5rem;border-bottom:1px solid var(--line);scroll-margin-top:5rem}
.gsec:last-child{border-bottom:0}
.gsec>h2{font-size:var(--s-xl)}
.gsec>h2 .n{color:var(--terra);margin-right:.5rem}
.gsec .q{font-family:var(--display);font-style:italic;color:var(--muted);font-size:var(--s-lg)}
.prin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1rem}
details.prin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
details.prin summary{cursor:pointer;list-style:none;display:grid;gap:.35rem}
details.prin summary::-webkit-details-marker{display:none}
details.prin .pid{font-family:var(--display);color:var(--terra)}
details.prin .pname{font-weight:600;font-size:var(--s-md)}
details.prin .psol{font-size:var(--s-sm);color:var(--muted)}
details.prin .more{font-size:var(--s-xs);color:var(--terra);font-weight:600}
details.prin[open] .more{display:none}
.pbody{display:grid;gap:.8rem;margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--line);font-size:var(--s-sm)}
.lbl{font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:.15rem}
.en{font-style:italic}
.rde{display:grid;gap:.4rem}
.rde div{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.4rem}
.rde b{font-family:var(--display);font-weight:400;color:var(--terra)}
.example{background:var(--sunk);border-radius:4px;padding:.6rem .7rem;display:grid;gap:.2rem}
.example a{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:var(--s-xs);font-weight:600;padding:.15rem .55rem;border-radius:999px;border:1px solid var(--line);white-space:nowrap;text-decoration:none}
.pill .dot{width:.55rem;height:.55rem;border-radius:50%}
.small{font-size:var(--s-sm);color:var(--muted)}
/* process */
.proc{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.proc svg{display:block;min-width:40rem;width:100%;height:auto}
.proc .nd rect{transition:opacity .15s}
.proc a:hover .nd rect,.proc a:focus .nd rect{opacity:.85}
.wm-list{display:grid;gap:.75rem}
.wm-row{display:grid;grid-template-columns:9rem minmax(0,1fr) auto;gap:1rem;align-items:center;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none}
.wm-row:hover{border-color:var(--terra)}
.wm-row .nm{font-family:var(--display);font-size:1.15rem}
.wm-row .sp{font-size:var(--s-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.wm-row .dd{font-size:var(--s-xs);color:var(--muted)}
.bullets{margin:0;padding-left:1.1rem;display:grid;gap:.3rem}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;display:grid;gap:.6rem;align-content:start;font-size:var(--s-sm)}
.role h3{font-size:1.3rem}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1rem}
.fam{display:grid;gap:.5rem;align-content:start;padding:1rem 1.1rem;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--fc);text-decoration:none;font-size:var(--s-sm)}
.fam:hover{border-color:var(--fc)}
.fam .code{font-family:var(--display);font-size:1.6rem;color:var(--fc);line-height:1}
.fam .tr{font-weight:600;font-size:var(--s-md)}
.fam .th{color:var(--muted)}
.fam .n{font-size:var(--s-xs);color:var(--muted)}
.limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;counter-reset:lim}
.limit{padding:1rem 1.1rem;border-left:3px solid var(--maroon);background:var(--surface);display:grid;gap:.4rem;font-size:var(--s-sm)}
.limit b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--maroon)}
/* work mode page */
.wm-head{display:grid;gap:.6rem}
.wm-head h1{font-size:var(--s-xxl)}
.wm-head .sub{font-family:var(--display);font-style:italic;font-size:var(--s-lg);color:var(--terra)}
.crumbs{font-size:var(--s-sm);color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.wm-body{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:2.5rem;align-items:start}
.blocks{display:grid;gap:1.4rem}
.block{display:grid;gap:.4rem}
.block h3{font-family:var(--body);font-weight:600;font-size:var(--s-md)}
.block h3 .pp{font-family:var(--display);font-weight:400;color:var(--terra);margin-left:.4rem;font-size:var(--s-sm)}
.block .ask{font-style:italic;color:var(--maroon)}
.aside{display:grid;gap:1rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.5rem)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;display:grid;gap:.5rem;font-size:var(--s-sm)}
.panel.atl{background:var(--sunk);border-color:transparent}
.atl-item{display:grid;gap:.15rem;padding-top:.5rem;border-top:1px solid var(--line)}
.atl-item a{font-weight:600}
.brief{display:grid;gap:0;counter-reset:b;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.brief div{display:grid;grid-template-columns:2rem 13rem minmax(0,1fr);gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);font-size:var(--s-sm)}
.brief div:last-child{border-bottom:0}
.brief .i{font-family:var(--display);color:var(--terra)}
.brief .k{font-weight:600}
.next{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:1rem}
.next a{text-decoration:none;font-family:var(--display);font-size:1.1rem}
/* atlas */
.filters{display:grid;gap:.75rem;padding:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{font:inherit;font-size:var(--s-sm);padding:.35rem .75rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.frow{display:flex;flex-wrap:wrap;gap:.75rem;align-items:end}
.frow label{display:grid;gap:.2rem;font-size:var(--s-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.frow select,.frow input{font:inherit;font-size:var(--s-sm);padding:.4rem .55rem;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.frow input{width:16rem}
.count{font-size:var(--s-sm);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:1.1rem}
.spec{display:grid;grid-template-rows:auto auto 1fr;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.spec:hover{border-color:var(--fc,var(--terra))}
.ph{aspect-ratio:4/3;max-width:100%;position:relative;background:
  repeating-linear-gradient(135deg, color-mix(in srgb,var(--fc,var(--muted)) 14%, transparent) 0 2px, transparent 2px 11px),
  color-mix(in srgb,var(--fc,var(--muted)) 10%, var(--surface));display:grid;place-items:center;overflow:hidden}
.ph .lt{font-family:var(--display);font-size:3.2rem;color:var(--fc,var(--muted));opacity:.55}
.ph img{width:100%;height:100%;object-fit:cover}
.credit{font-size:.72rem;color:var(--muted);padding:.3rem .75rem;border-bottom:1px solid var(--line);background:var(--surface)}
.spec .b{padding:.75rem .85rem .9rem;display:grid;gap:.35rem;align-content:start}
.spec h3{font-family:var(--body);font-weight:600;font-size:var(--s-md);line-height:1.25}
.spec .pl{font-size:var(--s-xs);color:var(--muted)}
.spec .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.2rem}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:none}
.mapbox .land{fill:var(--sunk);stroke:var(--line);stroke-width:.5}
.mapbox .sphere{fill:var(--bg)}
.mapbox circle{stroke:var(--surface);cursor:pointer}
.mapbox circle:hover{stroke:var(--ink)}
.maptools{display:flex;flex-wrap:wrap;gap:.35rem;padding:.6rem;border-bottom:1px solid var(--line);align-items:center}
.maptools .small{margin-left:auto}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:var(--s-xs);padding:.3rem .5rem;border-radius:4px;max-width:16rem}
.nogeo{padding:.6rem .8rem;font-size:var(--s-xs);color:var(--muted);border-top:1px solid var(--line)}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:.12rem .5rem;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.st-research{color:var(--sage)} .st-cases{color:var(--fF)} .st-adapted{color:var(--fE)} .st-proposal{color:var(--terra)} .st-partial{color:var(--fG)}
.promise{border-left:3px solid var(--terra);padding:.2rem 0 .2rem 1.1rem;font-size:1.12rem;max-width:42rem}
.mat{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem 1.25rem;font-size:var(--s-sm)}
.mat b{display:block}
.v2 h2{font-family:var(--body);font-weight:600;font-size:var(--s-sm);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.4rem}
.v2 section{display:grid;gap:.3rem}
.dolist{list-style:none;margin:0;padding:0;display:grid;gap:.6rem;counter-reset:d}
.dolist li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.4rem;counter-increment:d}
.dolist li::before{content:counter(d);font-family:var(--display);color:var(--terra)}
.asklist{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.asklist li{font-style:italic;color:var(--maroon)}
details.why{border-top:1px solid var(--line);padding-top:.8rem}
details.why summary{cursor:pointer;font-family:var(--display);font-size:1.15rem}
details.why .wl{display:grid;gap:.6rem;margin-top:.7rem}
details.why .wl div{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.6rem;font-size:var(--s-sm)}
details.why .wl b{font-family:var(--display);font-weight:400;color:var(--terra)}
/* case page */
.case{display:grid;grid-template-columns:minmax(0,22rem) minmax(0,1fr);gap:2.5rem;align-items:start}
.case .media{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.case .media .credit{border-bottom:0;border-top:1px solid var(--line);padding:.5rem .8rem}
.meta{display:grid;gap:.1rem;margin-top:1rem;font-size:var(--s-sm)}
.meta div{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--line)}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.case h1{font-size:clamp(1.9rem,4vw,2.8rem)}
.case .main{display:grid;gap:1.4rem}
.case .desc{font-size:1.15rem;line-height:1.5;max-width:40rem}
.case .sect{display:grid;gap:.35rem;max-width:40rem}
.case .sect h2{font-family:var(--body);font-weight:600;font-size:var(--s-sm);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.todo{font-size:var(--s-xs);color:var(--muted);font-style:italic}
.worknote{background:color-mix(in srgb,var(--terra) 12%,var(--surface));border:1px dashed var(--terra);border-radius:4px;padding:.6rem .75rem;font-size:var(--s-sm)}
.linked{display:grid;gap:.4rem}
.linked a{font-weight:600}
@media (max-width:52rem){
  .guide{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;display:flex;flex-wrap:wrap;gap:.25rem}
  .wm-body{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .case{grid-template-columns:minmax(0,1fr)}
  .brief div{grid-template-columns:1.6rem minmax(0,1fr)}
  .brief div .v{grid-column:2}
  .wm-row{grid-template-columns:minmax(0,1fr)}
  .frow input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
footer{border-top:1px solid var(--line);padding-block:1.5rem;font-size:var(--s-xs);color:var(--muted)}

.mech{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.2rem;margin-top:.6rem;align-items:start}
.mfam ul{display:grid;gap:.35rem}
.mfam h3 .small{display:block;font-family:var(--body);margin-top:.15rem}
.mfam{border-left:3px solid var(--fc);padding:.2rem 0 .2rem .8rem;display:grid;gap:.4rem}
.mfam h3{font-size:1.1rem}.mfam .code{color:var(--fc)}
.mfam li{font-size:var(--s-sm)}
.cl a{font-weight:500}
.quant{display:grid;gap:.5rem}
.lv{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.lv span{display:grid;justify-items:center;gap:1px;font-size:.72rem;padding:.25rem 0;border-radius:4px;background:var(--sunk);color:var(--muted)}
.lv span b{font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--ink)}
.lv span.T{background:var(--fc);color:var(--on-accent)} .lv span.T b{color:var(--on-accent)}

<script>
const DATA = {"families": [{"code": "A", "trans": "Capacity & Control", "thesis": "Cultivating Autonomy", "q": "Who can produce and control food?", "move": "From providing food to enabling people to produce it and to control its conditions: land, seeds, supply chains, skills.", "caution": "A great deal can be transformed without naming a right: in this family, ten cases out of twelve have Transformative depth, but only one is fully Rights-Enacting.", "emerging": false}, {"code": "B", "trans": "Authority & Self-determination", "thesis": "Reclaiming Food", "q": "Who decides which food system should exist, and according to which knowledges?", "move": "Authority over food, land and knowledge. The production and preparation of food become part of processes of cultural, epistemic and political reappropriation.", "caution": "Institutionalisation is not always the goal: in this family, remaining autonomous can be a political choice.", "emerging": false}, {"code": "C", "trans": "Governance & Collective Responsibility", "thesis": "Caring for the System", "q": "How are decisions, resources and responsibilities organised?", "move": "The rules, resources and decision-making arrangements through which the food system is governed. Design works on the institutional relationships that make services possible.", "caution": "Declaring a commitment and building a system of governance are not the same thing.", "emerging": false}, {"code": "D", "trans": "Access & Redistribution", "thesis": "From Charity to Care", "q": "How are access, dignity and agency organised in redistribution?", "move": "The relationships, rules and infrastructures through which food reaches those who need it: less stigma, more dignity, more agency, more collective responsibility.", "caution": "Changing the experience of access does not, on its own, change the causes of food insecurity.", "emerging": false}, {"code": "E", "trans": "Recognition & Belonging", "thesis": "Eating Together", "q": "Which relationships and forms of belonging does food make possible?", "move": "Food as an infrastructure of recognition, identity and belonging: cooking and eating together create spaces in which marginalised experiences are recognised.", "caution": "Recognition does not, on its own, generate political agency.", "emerging": false}, {"code": "F", "trans": "Visibility & Intelligibility", "thesis": "Making Care Visible", "q": "What remains invisible, and how can it become open to discussion?", "move": "The conditions of visibility: design and research artefacts make resources, relationships or injustices perceptible, so that they can be discussed.", "caution": "Seeing a resource or an injustice does not mean being able to change it. Emerging family.", "emerging": true}, {"code": "G", "trans": "Collective Ownership & Commoning", "thesis": "Owning Together", "q": "Who owns and governs food infrastructures?", "move": "The ownership and governance of food infrastructures: economic cooperation becomes a political and relational infrastructure of care.", "caution": "Those who are not members remain outside. Emerging family.", "emerging": true}, {"code": "H", "trans": "Skills & Work", "thesis": "Cooking as Capability", "q": "Can culinary knowledge become skill, work and autonomy?", "move": "Culinary knowledge stops being a need to be met and becomes a recognised skill, a pathway towards work and autonomy.", "caution": "Employability can individualise a structural exclusion. Emerging family.", "emerging": true}], "principles": [{"id": "P1", "name": "Contextual sensitivity", "ref": "Collins, 2025, p. 15", "concept": "Consider care as contextual knowledge: it emphasises the cultural specificities, capabilities, vulnerabilities, and interdependencies of agents and contexts.", "solution": "Solutions that are situated: they respond to the specific cultural conditions and relational histories of the context, and resist the imposition of universal models in favour of locally grounded responses.", "op": "Design situated strategies/tools that enable attentive listening and the deployment of critical skills to expand awareness.", "rde": {"R": "Conduct situated and participatory awareness-driven research (e.g. tactical ethnography); use sensitising concepts as analytical lenses to re-read field data.", "D": "Adapt co-design protocols to local language, cultural practices, and relational norms."}, "ask": {"R": "What knowledges, experiences, living conditions and relationships characterise this context? Who knows them, and which voices risk remaining unheard?", "D": "How can the project challenge dominant models and start from local knowledges, practices and priorities, without imposing categories and solutions defined elsewhere?"}, "ex": {"id": "RIO-19", "txt": "The project takes shape through visits, listening and the collection of culinary memories, involving communities in defining the contents and the project. The different food traditions maintain their own identity, and their holders are recognised as authors and transmitters of knowledge."}, "examples": [{"id": "RIO-19", "name": "Cozinha das Tradições", "tag": "Designing from local knowledges", "txt": "The project takes shape through visits, listening and the collection of culinary memories, involving communities in defining the contents and the project. The different food traditions maintain their own identity, and their holders are recognised as authors and transmitters of knowledge."}, {"id": "RIO-17", "name": "PNAE", "tag": "Recognising differences within a universal system", "txt": "The national school feeding programme incorporates respect for local food habits into the rules of the service and differentiates funding for some communities. It shows how contextual sensitivity can be embedded in public policies, while encountering limits in local implementation and in working conditions."}, {"id": "F-30", "name": "Cocina CoLaboratorio", "tag": "Designing with territories", "txt": "The collective develops different tools and activities in relation to the ecologies, histories and knowledges of the communities with which it works. The co-design of kitchens, gardens and living archives shows how design can start from local specificities."}, {"id": "F-28", "name": "Tribal Elder Food Box Program", "tag": "Bringing cultural specificity into food assistance", "txt": "The programme distributes culturally significant foods to the elders of the Tribal Nations of Wisconsin, adapting the boxes to the preferences gathered from the communities. Contextual sensitivity thus enters directly into the organisation of food assistance, recognising the value of Indigenous food traditions and systems."}], "exTable": [["Cozinha das Tradições", "In the process of listening and co-design"], ["PNAE", "In the rules and mechanisms of a public policy"], ["Cocina CoLaboratorio", "In design differentiated by territory"], ["Tribal Elder Food Box Program", "In the contents and organisation of food assistance"]]}, {"id": "P2", "name": "Attentiveness & vulnerability", "ref": "Tronto, 2013, p. 35; Puig de la Bellacasa, 2011, p. 88", "concept": "Consider vulnerability as a political act of resistance: it reveals intersectionality and positionality, giving recognition and representation to those who are most at risk of harm, yet whose concerns are often ignored or underrepresented.", "solution": "Solutions that make visible those whom the existing system does not see, name their needs as rights rather than deficits, and integrate spaces or tools to actively recognise intersectionality, vulnerability, and systemic injustice.", "op": "Design strategies/tools that enable attentive listening and critical recognition of structural injustice.", "rde": {"R": "Actively seek out those whose voices are structurally absent from existing data and policy. Use snowball sampling from the margins and trauma-response research protocols.", "D": "Use visibility-making tools and critical cartography to render structural invisibility legible and contestable."}, "ask": {"R": "Who remains excluded from existing data, policies, and decision-making processes? What structural conditions contribute to this exclusion, and how can we engage with the people concerned without exposing them to further risks?", "D": "How can design make visible the inequalities and injustices that the system tends to overlook, making space for the perspectives of those affected and opening up possibilities for contestation and change?"}, "ex": {"id": "F-19", "txt": "The laboratory supports Brazilian municipalities in diagnosing their food policies. Surfacing the limits of census categories in detecting the food insecurity of quilombola communities contributed, for example, to the inclusion of a dedicated chapter in the food plan of Rio de Janeiro."}, "examples": [{"id": "F-19", "name": "LUPPA", "tag": "Making visible those whom the data do not record", "txt": "The laboratory supports Brazilian municipalities in diagnosing their food policies. Surfacing the limits of census categories in detecting the food insecurity of quilombola communities contributed, for example, to the inclusion of a dedicated chapter in the food plan of Rio de Janeiro."}, {"id": "MI-20", "name": "Ronda Carità e Solidarietà", "tag": "Food as an occasion for listening", "txt": "With «Anche l’Ascolto Nutre» (Listening Also Nourishes), the mobile unit pairs food distribution with listening to the needs of the people met on the street. The municipal recognition and funding of this aim make listening part of the objectives of the service, beyond the delivery of the meal."}, {"id": "F-54", "name": "Night-Time Food Deserts", "tag": "Mapping an absence", "txt": "The project combines GIS maps and testimonies to document the difficulties in accessing food faced by those who work at night in London. The mapping relates people's experiences to the gaps in information infrastructures and in the food offer."}, {"id": "F-34", "name": "South African Food Sovereignty Campaign", "tag": "Giving public space to testimony", "txt": "Through the Hunger Tribunal, organised with the South African Human Rights Commission, and the public assemblies on drought, the campaign brings direct experiences of hunger into public space. The testimonies link people's needs to institutional responsibilities and to the conditions that produce food insecurity."}], "exTable": [["LUPPA", "In the categories and data of public policies"], ["Ronda Carità e Solidarietà", "In the everyday relationship of the service"], ["Night-Time Food Deserts", "In mapping infrastructural and information gaps"], ["SAFSC", "In public spaces of testimony and claim-making"]]}, {"id": "P3", "name": "Collective responsibility", "ref": "Kittay, 1999, p. 113; Puig de la Bellacasa, 2017; Collins, 2025, p. 90", "concept": "Consider justice as a balance of “collective” care: distributed and shared responsibilities beyond contracts or individual choices. Consider care as a collective force that sustains the world, an “alter biopolitics”: an ontological condition rooted in our interdependence.", "solution": "Solutions that redistribute care across multiple actors, making the terms of distribution explicit, contestable, and not reducible to individual charity or voluntary provision. Solutions that practise collective and participatory models of care through co-responsibility and co-governance by different agencies.", "op": "Design strategies/tools that enable discussion of accountability and collective distribution of power and care.", "rde": {"R": "Consider care materiality within the design process; map and analyse care ecosystems in a participatory way.", "D": "Design governance models and communication artefacts that activate collective care and prototype the transition.", "E": "Assess care materiality, distribution, and responsibility."}, "ask": {"R": "Who takes care of whom, with what resources, and who is accountable for it?", "D": "Does the proposal distribute responsibility among several actors, or does it shift it onto those who already carry the load?", "E": "After the intervention, is responsibility more shared and explicit than before?"}, "ex": {"id": "F-04", "txt": "The centre has broadened its response to food insecurity by adding kitchens, gardens, peer advocacy activities and public policy initiatives to distribution. Responsibility is not exhausted in the delivery of aid; it is articulated across different activities and subjects."}, "examples": [{"id": "F-04", "name": "The Stop Community Food Centre", "tag": "From food bank to community centre", "txt": "The centre has broadened its response to food insecurity by adding kitchens, gardens, peer advocacy activities and public policy initiatives to distribution. Responsibility is not exhausted in the delivery of aid; it is articulated across different activities and subjects."}, {"id": "F-32", "name": "Seikatsu Club", "tag": "Sharing risk", "txt": "With the Co-developed Rice Fund, consumers and producers contribute equal shares to a common reserve. The fund has been used to compensate farmers after poor harvests, translating risk-sharing into a concrete economic mechanism."}, {"id": "RIO-04", "name": "Hortas Cariocas", "tag": "Recognising community work through public resources", "txt": "The municipal programme directly remunerates those who cultivate the community gardens and provides for the harvest to be divided between donation and income. The involvement of residents' associations and the economic recognition of labour link the community initiative to public responsibility."}, {"id": "MI-14", "name": "Selinunte", "tag": "Overcoming the division between those who receive and those who contribute", "txt": "Around thirty families who receive food aid take part as volunteers in the activities of the hub's food laboratory. The case challenges the separation between recipients and operators of the service, recognising for the people involved an active role in its organisation."}], "exTable": [["The Stop", "In the broadening of the service's functions"], ["Seikatsu Club", "In the economic mechanisms of risk-sharing"], ["Hortas Cariocas", "In the public recognition of community work"], ["Selinunte", "In the redefinition of roles within the service"]]}, {"id": "P4", "name": "Politics of care & agonism", "ref": "Tronto, 2013, p. 35; Collins, 2025, p. 13; Mouffe, 2000, 2013", "concept": "Consider care as a public ethic: a shared awareness that concerns everyone, extending into broader social and political contexts, a collective political act aimed at addressing structural injustices.", "solution": "Solutions that create spaces of claim-making: highlight care conflicts and structural/systemic injustices and open them up for collective political discussion. Solutions that integrate agonistic spaces for dissent and co-decision-making processes.", "op": "Design strategies and tools for collectively recognising and representing conflicts and dissent, explicit or hidden.", "rde": {"R": "Map who currently bears the cost of care before defining the problem. Use participatory design tools for mapping system inequalities and hidden conflicts as political issues.", "D": "Design artefacts and processes that name inequalities explicitly rather than neutralising them. Prefer agonistic facilitation over consensus-building formats that suppress contestation.", "E": "Evaluate whether the process has shifted the distribution of care responsibilities or left existing arrangements intact."}, "ask": {"R": "Who bears the cost of care today, and which conflicts, including latent ones, reveal it?", "D": "Where can disagreement be voiced? Do the chosen formats name inequalities or neutralise them?", "E": "Has the process shifted the distribution of responsibilities, or left it as it was?"}, "ex": {"id": "MI-05", "txt": "Starting from the experience of food recovery in markets, the association promoted a petition for a national law on unsold food and for representation at the table established by Law 166/2016. Everyday practice thus becomes the starting point for a claim addressed to decision-making bodies."}, "examples": [{"id": "MI-05", "name": "RECUP", "tag": "From recovery to a regulatory claim", "txt": "Starting from the experience of food recovery in markets, the association promoted a petition for a national law on unsold food and for representation at the table established by Law 166/2016. Everyday practice thus becomes the starting point for a claim addressed to decision-making bodies."}, {"id": "F-27", "name": "Incredible Edible Todmorden", "tag": "From shared gardens to claiming the right to land", "txt": "With the Right to Grow campaign, the movement extends the experience of shared cultivation into a request addressed to local administrations: guaranteeing access to public land for growing food. The initiative shifts the issue from informal uses of space to a question of access to and governance of land."}, {"id": "F-53", "name": "Manifesto del Dono, Caritas Reggio Emilia-Guastalla", "tag": "Questioning charity from within", "txt": "The manifesto, which originated within the world of food aid, challenges a response based exclusively on distribution, which risks mitigating the effects of inequalities without addressing their causes. By claiming a public role for rights and for the discussion of policies, it proposes a critical reflection on charitable practice itself."}], "exTable": [["RECUP", "In the regulatory claim"], ["Black Panther Party", "In the public denunciation of institutional shortcomings"], ["Incredible Edible Todmorden", "In claiming access to land"], ["Manifesto del Dono", "In the critique of charity as a sufficient response"]]}, {"id": "P5", "name": "Responsiveness", "ref": "Tronto, 2013, p. 35", "concept": "Consider care reaction as a practical and political assessment: actively understand human and non-human feedback to care practices.", "solution": "Adaptive solutions that include structured mechanisms for receiving feedback and adjusting to changing or expressed needs. It is designed to evolve, not to fix a final arrangement. Solutions that integrate the ability to respond and adapt care services/programmes to social change.", "op": "Design iterative, participatory, adaptive strategies/tools that enable spaces for ongoing assessment and consultation.", "rde": {"D": "Design feedback mechanisms from the beginning, not as evaluation afterthoughts: community review sessions, iterative co-design loops, adaptation checkpoints. Prototype adaptive governance structures.", "E": "Test responsiveness explicitly: present preliminary proposals to participants and redesign based on the reactions, including negative ones."}, "ask": {"D": "Through which channels will care-receivers and care-givers be able to say that something is not working, and who will have to respond?", "E": "Have the proposals really changed in response to reactions, including negative ones?"}, "ex": {"id": "F-13", "txt": "People with direct experience of food insecurity took part in design cycles. The exchange led to modifying the initial idea of a single «egalitarian» table, introducing different configurations in response to the participants' observations."}, "examples": [{"id": "F-13", "name": "Another Provision", "tag": "A project that changes through critique", "txt": "People with direct experience of food insecurity took part in design cycles. The exchange led to modifying the initial idea of a single «egalitarian» table, introducing different configurations in response to the participants' observations."}, {"id": "F-29", "name": "Soul Fire Farm", "tag": "Adapting the service to living conditions", "txt": "Faced with access difficulties linked to the lack of reliable transport and to working hours, the farm introduced free home delivery. It also developed sliding-scale pricing integrated with SNAP benefits."}, {"id": "MI-12", "name": "Lambrate Hub", "tag": "Using results to inform public decisions", "txt": "The measured results of the first neighbourhood hub contributed to the Municipality of Milan's decision to open a second one. The case shows a form of responsiveness that links the monitoring of a service to decisions on its possible replication."}, {"id": "F-22", "name": "Teviot People’s Kitchen, R-Urban Poplar", "tag": "Revising the format through collective evaluation", "txt": "After experimenting with workshops led by a single person, the group moved to collectively run seasonal fairs. The change of format arose from the participants' shared reflection on the experience."}], "exTable": [["Another Provision", "In the participatory revision of the project"], ["Soul Fire Farm", "In adapting access arrangements and prices"], ["Lambrate Hub", "In the link between monitoring and public decisions"], ["Teviot People’s Kitchen", "In the collective revision of activities"]]}, {"id": "P6", "name": "Competence, self-determination & respect for autonomy", "ref": "Tronto, 2013, pp. 32, 35; The Care Collective, 2020, p. 4", "concept": "Consider the ability to care as a technical and moral competence, requiring knowledge and curiosity about the other's needs. Consider self-determination as a collective right — creating or maintaining the social, emotional, and material infrastructure that enables individuals to act autonomously within a supportive community — and relational, interdependent autonomy as the starting point of democracy.", "solution": "Solutions that build collective capacities and relational, interdependent autonomy rather than creating dependency on the provider. They treat those who receive care as co-producers, and ensure care work is performed with adequate knowledge, resources, and recognition. Solutions that promote widespread and enabling skills, ensuring effective collective care through training and shared knowledge.", "op": "Design strategies/tools that enable skill exchange and new models of learning and participation in care practices.", "rde": {"R": "Document existing local caring knowledge and set Action Research or co-creation approaches that centre community knowledge production (pay attention to extractivist models).", "D": "Design participatory processes where communities define their own needs and priorities; build on and strengthen local knowledge; use skill-sharing structures. Co-develop governance protocols, shared resources, peer networks. Avoid solutions that create dependency on the designer or the service provider.", "E": "Assess whether the process leaves participants more capable than before; evaluate success by whether collective self-determination capacity and relational autonomy have increased."}, "ask": {"R": "What care knowledges already exist, and who controls their documentation?", "D": "Who defines needs and priorities? Will the solution work without those who designed it?", "E": "Do those who took part come out of the process more capable than before?"}, "ex": {"id": "RIO-16", "txt": "The inhabitants of the Comunidade do Horto take care of the environment and claim the right to continue living in the territory. In 2025 the residents' association signed an agreement on permanence with the institutions and the Ministério Público."}, "examples": [{"id": "RIO-16", "name": "Horto Natureza", "tag": "From caring for the territory to claiming rights", "txt": "The inhabitants of the Comunidade do Horto take care of the environment and claim the right to continue living in the territory. In 2025 the residents' association signed an agreement on permanence with the institutions and the Ministério Público."}, {"id": "F-17", "name": "Dispensa Re-Store", "tag": "Choosing without having to prove need", "txt": "The social grocery does not require documents or checks to access food: people can choose what they need instead of receiving a predefined parcel. The people with disabilities involved in running it are also recognised as active subjects of the service."}, {"id": "F-31", "name": "Rete Semi Rurali", "tag": "Returning control of seeds to farmers", "txt": "Through participatory selection and seed houses, the network supports farmers in choosing the varieties to grow and reproduce. Self-determination thus concerns control over genetic resources and over the knowledges needed to reproduce agricultural systems."}, {"id": "F-12", "name": "AgroFavela Refazenda", "tag": "Supporting pathways to autonomy", "txt": "At the end of the urban agriculture course, the women receive a kit to start their own gardens and can sell seedlings and vegetables. The project aims to support the capacity to produce food and develop economic activities, going beyond responding to immediate need alone."}], "exTable": [["Horto Natureza", "In the claiming of rights and in the governance of the territory"], ["Dispensa Re-Store", "In the access rules and in freedom of choice"], ["Rete Semi Rurali", "In the control of seeds and agricultural knowledges"], ["AgroFavela Refazenda", "In the capacity to produce and generate income"]]}, {"id": "P7", "name": "Ecology of care & sustainability", "ref": "Puig de la Bellacasa, 2017, p. 164", "concept": "Consider that care extends beyond humans, as a practice that repairs and sustains the vital bonds between humans and non-humans.", "solution": "Solutions that take into account the environmental and social costs of the entire system in which they operate, and that consider how to avoid passing those costs on to human or non-human actors, either now or in the future.", "op": "Design strategies/tools that treat the maintenance of ecological bonds as constitutive of care quality, not as an additional criterion.", "rde": {"D": "Prototype maintenance protocols alongside initial solutions. Test whether proposed solutions externalise ecological harm, and redesign if they do.", "E": "Evaluate ecological impact as constitutive of care quality, not as a separate criterion."}, "ask": {"D": "Who will take care of maintenance? Does the proposal offload harm onto others, human or non-human, now or in the future?", "E": "Has the ecological impact been assessed as part of the quality of care?"}, "ex": {"id": "RIO-14", "txt": "The biogas produced from organic waste fuels the food bank's van, while the compost goes to the Hortas Cariocas gardens. Waste management, food logistics and horticultural production are linked through shared resource flows."}, "examples": [{"id": "RIO-14", "name": "Ecoparque do Caju", "tag": "Integrating social and ecological infrastructures", "txt": "The biogas produced from organic waste fuels the food bank's van, while the compost goes to the Hortas Cariocas gardens. Waste management, food logistics and horticultural production are linked through shared resource flows."}, {"id": "F-42", "name": "Beacon Food Forest", "tag": "Designing space as an ecosystem", "txt": "Seattle's food forest combines multi-layered crops, collective management of public land, a plot reserved for food banks and an Indigenous medicinal garden. The space integrates food production, biodiversity and care practices, although its different purposes need to be considered together in its management."}, {"id": "F-16", "name": "Rome school canteens tender, Food Council", "tag": "Translating sustainability into procurement requirements", "txt": "The tender incorporates environmental criteria, seasonality, monitoring of waste and reduction of the impacts linked to transport and packaging. Sustainability thus enters the conditions that govern the award of the school catering service."}, {"id": "F-09", "name": "Amadiba Traditional Foodways", "tag": "Protecting the relations between communities and ecosystems", "txt": "Customary norms forbid the felling of wild fruit trees and guarantee collective access to foraging. Care for the territory is expressed through rules that connect the use of resources, the community and relations with the natural world."}], "exTable": [["Ecoparque do Caju", "In the circular flows between waste, energy and food production"], ["Beacon Food Forest", "In the ecological and social organisation of space"], ["Rome canteens tender", "In the environmental requirements of public procurement"], ["Amadiba", "In customary norms of access to and protection of resources"]]}, {"id": "P8", "name": "Interdependence & reciprocity", "ref": "Puig de la Bellacasa, 2017, p. 166", "concept": "Consider interdependence as an ontological condition: agents in a web of life in which every being depends on the care provided by others to survive and flourish. Consider reciprocity triggered by curiosity and attentiveness to the rhythms and needs of the other, especially when the other is a non-human being.", "solution": "Solutions that acknowledge webs of interdependency, human and non-human, as constitutive of the design problem, and that recognise and sustain mutual dependence among communities, institutions, humans and non-humans as contextual and subject to temporality.", "op": "Design strategies/tools that enable the construction of reciprocal, non-unidirectional care relationships and infrastructures.", "rde": {"R": "Map webs of interdependency, human and non-human, within local systems and what sustains them. Attend to non-verbal and non-linguistic feedback.", "D": "Design reciprocal exchange structures rather than one-directional provision.", "E": "Evaluate whether the process has strengthened or weakened existing webs of care, including ecological ones."}, "ask": {"R": "On which relations, human and non-human, does this situation depend, and what sustains them?", "D": "Does the proposal create reciprocal exchanges or a one-way provision?", "E": "Do existing care networks, including ecological ones, come out strengthened or weakened?"}, "ex": {"id": "RIO-09", "txt": "The MST cooperative network connects agrarian reform settlements with urban consumers. Food distribution builds relationships between those who produce and those who buy, reducing the logistical and relational distance between countryside and city."}, "examples": [{"id": "RIO-09", "name": "Armazém do Campo", "tag": "Connecting rural production and urban consumption", "txt": "The MST cooperative network connects agrarian reform settlements with urban consumers. Food distribution builds relationships between those who produce and those who buy, reducing the logistical and relational distance between countryside and city."}, {"id": "F-52", "name": "Arvaia CSA", "tag": "Building a supply chain of reciprocal relationships", "txt": "The wheat grown by Arvaia is milled into flour by the Cenacchi mill, made into pasta by the Iris cooperative and into bread by Forno Brisa, which also uses the CSA's vegetables. The supply chain thus takes the form of a network of relationships between producers and processors, based on exchanges and interdependencies that connect the different stages of food production."}, {"id": "F-24", "name": "Nourish Hub", "tag": "Sharing the meal beyond the distinction between those who give and those who receive", "txt": "With the Donate as you dine formula, those who can afford it pay a little more, contributing to the meal of those who cannot. Support takes shape around the same tables, in the shared space of eating together, where the act of giving does not distinguish those who offer from those who receive, but makes them part of a common experience."}, {"id": "MI-01", "name": "Milan Food Aid Hub System", "tag": "Organising interdependence through a shared network", "txt": "The Milan hubs share a digital platform, municipal coordination, monitoring and part of their relations with large-scale retail. Interdependence is built into the organisation of the network, rather than left solely to the relationships between individual operators."}], "exTable": [["Armazém do Campo", "In the relations between rural production and urban consumption"], ["Arvaia CSA", "In the exchanges along the cooperative supply chain"], ["Nourish Hub", "In the sharing of resources and of the meal"], ["Milan Hub System", "In coordination and shared infrastructures"]]}, {"id": "P9", "name": "Institutionalisation of care", "ref": "Tronto, 2013", "concept": "Consider the process through which informal practices of care become durable, resourced, and accountable components of public infrastructure — without eroding the agency, quality, and relational character of care itself.", "solution": "Solutions that translate informal care practices into institutional arrangements without eroding agency, quality, or relational depth. Solutions that institutionalise spaces and practices of collective care so as to make care a structural part of urban policies.", "op": "Design strategies/tools that enable new forms of social and multi-agency care infrastructures (participatory “councils” · policy prototyping · RtD with communities and institutions · institutional translation protocols).", "rde": {}, "ask": {"": "What should be made durable, by whom and with what rules? What would be lost in terms of agency and relationships? What will remain at the end of the project, and for whom?"}, "note": "In the Framework, P9 is part of Politics of care and is kept separate for analytical reasons.", "ex": {"id": "RIO-03", "txt": "The solidarity kitchens born within social movements and occupations were recognised and funded through Law 14.628/2023. The case shows both the possibility of integrating grassroots initiatives into public policies and the fragility of financial continuity, as the case of the Lapa kitchen highlights."}, "examples": [{"id": "RIO-03", "name": "Programa Cozinha Solidária", "tag": "Recognising and supporting grassroots practices", "txt": "The solidarity kitchens born within social movements and occupations were recognised and funded through Law 14.628/2023. The case shows both the possibility of integrating grassroots initiatives into public policies and the fragility of financial continuity, as the case of the Lapa kitchen highlights."}, {"id": "F-14", "name": "Belo Horizonte, SMSAN", "tag": "Making public responsibility permanent", "txt": "Since 1993, the Municipality has had a secretariat dedicated to food security and a multi-actor council, alongside conferences with elected delegates. The presence of dedicated administrative and participatory structures sustains the continuity of policies, which nonetheless remains exposed to changes in political will."}, {"id": "F-47", "name": "Andria Food Policy Hub", "tag": "Institutionalising food policy in a medium-sized city", "txt": "The Municipality established a permanent physical space in the Cloister of San Francesco, a Food Council and a regulation approved unanimously. The case shows how food policy can acquire stable venues, bodies and rules also outside large metropolitan areas."}, {"id": "MI-11", "name": "Isola Hub", "tag": "Giving continuity to a model through agreements and monitoring", "txt": "Milan's first neighbourhood hub originated from a 2016 memorandum of understanding and has been monitored continuously by the Politecnico. The experience served as the reference for the subsequent replication of the model in the other city hubs."}], "exTable": [["Cozinha Solidária", "In the legislative recognition of grassroots practices"], ["Belo Horizonte", "In permanent administrative and participatory structures"], ["Andria", "In the formalisation of municipal spaces, bodies and rules"], ["Isola Hub", "In the agreements and monitoring that sustain replication"]]}], "dms": [{"id": "FRAME", "code": "DM-01", "space": "Setting up", "rde": "", "sub": "Orienting the project through care", "q": "With whom are we designing, towards what change, and from what position?", "status": "proposal", "one": "Defining the orientation of the design process by making explicit who takes part in setting it up, whom it addresses, what change it intends to pursue and from what position the intervention is made.", "does": ["FRAME orients the design process by defining the change or transition to strive towards, the point of entry into the context and the actors to be involved. The care lens invites us to question these choices from the outset, making explicit how the design challenge is defined, by whom and from which perspectives.", "It is also the moment at which the designer makes their positioning explicit and defines what role they take on, as a designer, within the process. This framing can be reconsidered during the process, when actors, conflicts or responsibilities that were not initially recognised emerge."], "when": ["At the start of a project or design process.", "When entering a new organisation, network or territory.", "When the mandate, the actors involved or the available resources change.", "When EVALUATE + REPAIR highlights changes in the starting conditions that require reconsidering the initial framing."], "do": [["Clarify the mandate", "Make explicit who commissions or promotes the process, with what objectives, timeframes and resources, and which decisions have already been taken."], ["Formulate the design challenge", "Gather the initial formulation, identifying who defined it, from what perspective and which voices were left out."], ["Map the interdependencies", "Identify the people, organisations, institutions, places, resources and more-than-human actors on which the situation depends, highlighting existing relationships and missing presences."], ["Define the conditions of participation", "Agree on accessible timeframes and modalities, forms of recognition or compensation for contributions, conditions of consent, ways of reporting back and criteria for the use of the knowledge gathered."], ["Make the positioning and the design role explicit", "Clarify on whose behalf the intervention is made, to whom one is accountable, which responsibilities are taken on and which decisions remain with other actors."]], "ask": [["P2, P4", "Who defined the design challenge in these terms, and which voices were left out?"], ["P3", "Who already sustains the work and costs of care in the situation considered?"], ["P2", "Which decisions belong to the designer and which must remain with the other actors involved?"]], "why": [["P2, P3, P8", "Dependence on care is a shared condition, but responsibilities and burdens are unequally distributed. Framing the project from this awareness makes it possible to recognise the interdependencies between people, institutions, places and more-than-human forms of life, without reducing relationships to a distinction between those who help and those who receive help."], ["P2, P4", "The formulation of a design challenge determines which issues become relevant and which perspectives are recognised. Making it explicit makes it possible to question who defined it, which interests it reflects and who already bears the costs of the situation."], ["P1, P6", "Those who live a situation have knowledge that cannot be replaced by the designer's gaze. Recognising this knowledge means involving it in defining the challenge and the process, respecting the conditions under which it is shared and providing appropriate forms of recognition."], ["P3, P6", "Design processes also require care: time, availability and relational work. Without a conscious distribution of responsibilities and recognition of contributions, participation risks adding further care work for those who already carry its burden."], ["P2", "Designers, too, intervene from a situated position, defined by skills, responsibilities and power relations. Making this position explicit helps to clarify the limits of one's mandate and to distinguish the contribution of design from the decisions that belong to others."]], "tools": ["TOOL-05"], "toolsNote": "FRAME has no specific tools developed and tested within the research. The grammar of care (P1, P2, P3, P6, P8) orients the framing through its questions; the interdependence map is an operational proposal developed to support this step.", "produce": ["A first formulation of the design challenge, explicit and open to verification.", "A preliminary map of interdependencies, including more-than-human actors.", "A collaboration agreement, even an informal one, clarifying the mandate, constraints and conditions of participation.", "The identification of the point of entry into the context — a practice, a territory or a conflict — and of the design role from which to start the process."], "role": "FRAME is the moment at which the position from which to start the process is clarified, choosing among the three design roles identified by the approach. This choice is not final and can be reconsidered in the light of what emerges during the work.", "atlas": [{"id": "F-19", "w": "It requires cities to make a public political commitment as a condition for taking part in the laboratory, making the institutional mandate an explicit component of the start of the process."}, {"id": "F-53", "w": "It makes explicit the reciprocal responsibilities between the different subjects, rendering visible the relationships that orient shared action."}], "limit": "If the mandate does not allow the people directly involved to influence decisions, improving facilitation is not enough to overcome exclusion. The conditions of the mandate need to be negotiated or redefined; when this is not possible, the limit must be made explicit and brought to the attention of those who have the power to change it.", "next": [["SITUATE", "if the process starts from an existing practice or from an urban system to be explored"], ["SURFACE", "if the point of entry is a conflict, to investigate its causes, actors and systemic conditions"]], "evidence": "The proposal derives from the elaboration of the research findings and from fieldwork experience; it has not been observed or evaluated as a stand-alone operation.", "atlasNote": "The cases presented were not developed through Care(full) Design. They illustrate practices that offer elements useful for understanding how some of the issues addressed by this design move can manifest themselves in processes and organisational configurations."}, {"id": "SITUATE", "code": "DM-02", "space": "Space of reading", "rde": "R", "sub": "Reading practices and the system through care", "q": "How is care organised, in the practice and in the system?", "status": "research", "one": "Reading how care is organised in the practice and in the urban system of which it is part, questioning interdependencies, ecological relations, the specificities of the context and the distribution of responsibility and power.", "does": ["SITUATE reads care in its situated and relational dimension: how it is organised through activities and interdependencies, who takes on its responsibilities and which social, institutional and ecological conditions make it possible. The reading can start from a practice or from the urban system of which it is part. The two scales, distinct but interdependent, make it possible to grasp how the dynamics of a practice reflect wider conditions and how these, in turn, influence its functioning.", "It fits into existing design research methods, introducing specific tools and a lens that makes care an explicit dimension of the inquiry. This perspective also invites a distinction between a practice's capacity to respond to needs and its capacity to recognise and make effective the rights of the people involved."], "when": ["When entering an existing practice to understand how it works, its relations of care and its possibilities of transformation.", "When entering a territory or a network whose actors, interdependencies and operating conditions are not yet known.", "When EVALUATE + REPAIR brings out gaps or changes that require a new reading of the practice or of the system of which it is part."], "do": [["Read the practice through the Care Matrix", "Analyse how care is organised, which relationships and capacities sustain it, which forms of care it is important to preserve and where interruptions, asymmetries or critical issues emerge."], ["Extend the reading to the urban system", "Locate the practice on the Care Spot Map, relating it to services, organisations and territorial networks. Gaps may depend not only on the absence of services but also on missing connections or fragile collaborative relationships."], ["Make care work visible", "Identify who carries out the activities necessary for the practice to function, how responsibilities are distributed and which contributions remain invisible, unrecognised or inadequately supported."], ["Document the situated reading", "Use the guided diary to record observations, interpretations, conditions of the context and reflections on one's own positioning, distinguishing the evidence gathered from the assessments of those conducting the research."]], "ask": [["P1", "What situated knowledges have developed through the practice, and which conditions allow them to be recognised?"], ["P3", "Who takes on the responsibilities of care, and who concretely sustains its work, including the least visible?"], ["P9", "Which institutional gaps or system shortcomings does the practice address, and with what consequences?"], ["P8", "On which relations and interdependencies, human and more-than-human, does its functioning depend?"], ["P2, P6", "What voice and decision-making capacity do care-receivers have in defining and organising the practice?"], ["P4", "To what extent is the response to needs accompanied by the recognition of rights and by the possibility of claiming them?"]], "why": [], "tools": ["TOOL-01", "TOOL-02", "TOOL-04"], "toolsNote": "", "produce": ["A profile of the practices analysed through the Care Matrix, making explicit the dimensions of care observed and the evidence supporting the reading.", "A Care Spot Map of the territory or of the urban network, representing the practices, the relationships and the possible discontinuities in the organisation of care.", "A reasoned reading of the forms of care to be preserved and of the gaps to be addressed, distinguishing the evidence gathered from the questions that require further investigation."], "role": "Embedded Collaborator", "atlas": [{"id": "MI-15", "w": "It is useful because it shifts attention from designing a new facility to recognising and connecting resources that are already present. It is a concrete example of reading territorial infrastructures, although it is not equivalent to a systematic mapping of care."}, {"id": "F-08", "w": "Public assemblies, questionnaires and working tables helped to surface needs and information useful for defining the recommendations for Genoa's food policy."}, {"id": "CW-06", "w": "The Municipality reads the distribution of services, mobility and access to urban spaces through a gender lens. The mapping makes legible the territorial differences in access to services and opportunities, showing how a spatial reading can contribute to recognising needs and inequalities."}], "limit": "A weak dimension in the Care Matrix does not, on its own, indicate where or how to intervene. Critical issues may depend on political constraints, insufficient resources or responsibilities that fall outside design's possibilities of action. Moreover, the presence of care practices does not exclude conflicts, inequalities or unfair distributions of work: making them visible is a starting point, not a guarantee of transformation.", "next": [["SURFACE", "to surface tensions, conflicts and needs that a first reading of the context does not reveal"], ["ACTIVATE", "to bring gaps, resources and responsibilities into a space of discussion and negotiation"]], "evidence": "Tested directly in the Atlas and in the research activities in Rio de Janeiro and Milan. The collective use of the Care Matrix has not yet been tested.", "atlasNote": "The cases reported were not designed through Care(full) Design. They document practices and tools that, albeit with different aims and modalities, help to read the context, recognise presences of care and identify the conditions on which an intervention can leverage."}, {"id": "SURFACE", "code": "DM-03", "space": "Space of reading", "rde": "R", "sub": "Reading the urban system through conflicts", "q": "Which conflicts run through the system, and how can they be made visible through design practices?", "status": "research", "one": "Exploring conflicts to understand the inequalities, contested responsibilities and tensions that run through the urban system.", "does": ["Starting from a conflict means investigating not only the declared problem but also the conditions that produce it and the different positions of those involved. SURFACE explores what a reading centred on needs or solutions risks leaving in the background: power relations, contested responsibilities, little-recognised dependencies and costs unequally distributed among people, territories and more-than-human systems.", "In the agonistic perspective of the Framework, conflict is a lens for understanding the tensions, divergent interests and power relations that run through an urban system. It can concern different issues — from access to resources to territorial rights, from infrastructural choices to public policies — and does not necessarily have to have care as its explicit object.", "The care lens acts on the way in which these conflicts are read: it makes it possible to question, where relevant, the dependencies that involve the actors, the responsibilities at stake, the vulnerabilities produced or aggravated by decisions and the distribution of costs and consequences over time and space. It does not replace the other keys for reading conflict; it broadens their field of observation, including the relationships and conditions that may remain at the margins of dominant representations.", "SURFACE therefore investigates not only which conflicts run through the system, but also how they are defined, by whom, which positions manage to emerge and which remain excluded or exposed to risks. In this sense, SURFACE and SITUATE offer complementary readings of the same context: the tensions that run through it and the presences, relationships and infrastructures of care that sustain it."], "when": ["When a conflict is already explicit and its causes, actors and stakes need to be understood.", "When a practice seems to work, but tensions, exclusions or costs that are not recognised emerge.", "When the reading of presences of care brings out absences, inequalities or responsibilities that remain unexplained."], "do": [["Map conflicts in a participatory way", "Use the PUCM protocol to reconstruct who is involved, what issue is at stake, where it manifests itself and how it has changed over time."], ["Distinguish between explicit and latent conflicts", "Identify which tensions are named and discussed, which remain implicit and which conditions hinder their expression."], ["Read the warning signs through the Care Matrix", "Examine the alerts on the invisibilisation of conflict and on care-washing, checking whether the language of care conceals power relations, neglected responsibilities or unequal distributions of costs."], ["Assess the conditions of visibility", "Decide together with the people involved which information to make public, for which audiences and in what ways, considering who may benefit from visibility and who may suffer its consequences."], ["Relate the maps to each other", "Compare the Conflict Map with the Care Spot Map to identify where care practices are crossed by conflicts and where tensions reveal needs, responsibilities or forms of care that are not recognised."]], "ask": [["P4", "Who bears the costs of care, and which conflicts reveal their unequal distribution?"], ["P2", "Who is unable to give voice to tensions? Who is at risk when these become visible?"], ["P3", "Which care work remains unrecognised, and by whom?"], ["P7, P8", "Which costs are transferred onto other actors, human and more-than-human, in the present or in the future?"]], "why": [], "tools": ["TOOL-03", "TOOL-01"], "toolsNote": "", "produce": ["An Urban Food Conflict Map that conveys the spatial distribution of conflicts and the relations between the actors involved.", "A synthesis of the conflicts identified, the positions at stake, the conditions of visibility and the costs borne by the different actors.", "An agreement, defined with the people potentially exposed, on the information not to be disclosed or to be made accessible in protected form."], "role": "Agonistic Mediator", "atlas": [{"id": "F-37", "w": "A Pittsburgh restaurant serves dishes from countries in conflict with the United States, using food to open a space of discussion on geopolitical conflicts. The reactions to the 2014 Palestinian menu, including the threats received by the project, show the risks associated with taking a public stance."}, {"id": "F-54", "w": "Maps and testimonies made visible the food access conditions of night workers, who are poorly represented in the available data."}, {"id": "CW-11", "w": "In a collaboration between Georgia Tech's Public Design Workshop and the inhabitants of two Atlanta neighbourhoods, residents take part in defining and collecting data on the housing and environmental conditions of their area, using them to claim public resources."}], "limit": "Making a conflict visible does not mean resolving it. Visibility can give recognition to marginalised positions, but it can also expose people and communities to risks, retaliation or new forms of vulnerability. Moreover, when the conflict requires political, administrative or legal decisions, SURFACE can help to document the tensions and responsibilities at stake, but it does not replace the action of those who have the power and the duty to intervene.", "next": [["SITUATE", "to read the presences, relationships and dependencies that run through the conflict"], ["ACTIVATE", "to build possibilities for dialogue and identify room for action, once the actors involved, the tensions and the risks have been clarified"]], "evidence": "Tested directly through participatory conflict-mapping activities in Milan and Rio de Janeiro.", "atlasNote": "The cases reported were not designed through Care(full) Design. They illustrate ways in which conflicts, exclusions and asymmetries can be made visible through research practices, representation tools or claim-making processes."}, {"id": "ACTIVATE", "code": "DM-04", "space": "Space of making", "rde": "D", "sub": "Creating spaces to imagine and claim together", "q": "How can we create spaces to imagine and claim together?", "status": "partial", "one": "Designing the conditions for collective exploration and design, making room for disagreement and turning needs, conflicts and claims into matter for discussion and design.", "does": ["ACTIVATE concerns the design of the spaces and processes through which people and organisations can compare their perspectives, challenge existing priorities and imagine alternatives. Design does not merely facilitate a discussion: it contributes to defining who can take part, which forms of knowledge are recognised, how the discussion is structured and what possibilities exist to influence decisions. The outcomes can take different forms, from scenarios to design proposals, from claims to alliances between actors.", "When preceded by SITUATE or SURFACE, ACTIVATE makes it possible to bring into the discussion the presences of care, the gaps, the practices to be preserved, the conflicts and the responsibilities that have emerged. It can also be used on its own: in this case, the care lens orients the exploration towards relations of dependency, the distribution of responsibilities and the conditions necessary for proposals to be socially and environmentally sustainable.", "Consistently with the agonistic perspective of the Framework, the discussion does not necessarily have to produce consensus. Disagreement can remain open and become a resource for exploring alternatives, provided that the different positions can be expressed and that power asymmetries are not neutralised by the participatory format. Territorial assemblies, food councils, scenario workshops and spaces of dialogue between movements and institutions are some of the possible configurations. Designing these devices also means questioning their limits: taking part does not necessarily mean having decision-making power."], "when": ["When people and communities express needs or claims but have few opportunities to influence decisions.", "When the reading of the context has brought out gaps, conflicts or responsibilities that require a discussion among the actors involved.", "When a proposal or a prototype highlights the absence of some perspectives and requires the design process to be reopened."], "do": [["Define the conditions of participation", "Establish whom to involve, in what ways and at which stage of the process. Consider timeframes, accessibility, necessary resources, recognition of knowledges and the distribution of the work required, avoiding transferring further burdens onto people already engaged in care activities."], ["Bring the issues into the discussion", "Make the gaps, the practices to be preserved, the conflicts and the responsibilities that emerged from previous readings open to discussion, distinguishing the available evidence from the interpretations and priorities of the different actors."], ["Use the Atlas as a critical repertoire", "Explore solutions, forms of organisation and devices for dialogue that have already been tested, questioning their conditions of effectiveness, limits and transferability, instead of replicating them as predefined models."], ["Develop plural alternatives", "Use imagination and design tools to formulate different scenarios, proposals and claims, without prematurely reducing divergences to a single shared solution."], ["Clarify the possibilities and limits of design action", "Distinguish the issues that can be addressed through design from those that require political decisions, public resources, regulatory changes or the intervention of institutionally responsible subjects. For the latter, identify interlocutors and possible paths of claim-making."]], "ask": [["P4", "Where and by whom can disagreement be expressed? Do the chosen formats make inequalities visible, or do they risk neutralising them?"], ["P6", "Who defines needs and priorities, and who decides which ideas to develop and which resources to mobilise?"], ["P2", "How do marginalised experiences enter the discussion, and which conditions allow them to influence decisions?"]], "why": [], "tools": [], "toolsNote": "Outcomes of the previous readings; the Atlas as a repertoire of solutions and forms of dialogue; participatory and scenario-building tools.", "produce": ["Alternative scenarios that make explicit the different visions of the future and their implications.", "Articulated claims, identifying their addressees and the decisions requested.", "Alliances and configurations of collaboration between actors, with roles and responsibilities to be further explored.", "An overview of the issues that exceed design's field of action, indicating the institutional interlocutors and the resources or changes needed"], "role": "Agonistic Mediator; Provocateur / Scenario Builder", "atlas": [{"id": "F-08", "w": "Territorial assemblies involved citizens and local actors in formulating proposals for the city's food policy."}, {"id": "F-16", "w": "The Food Council offers a space of dialogue between different actors on food policies, including the rules and procurement of school catering."}, {"id": "F-34", "w": "Through territorial dialogues in nine provinces, the campaign gathered experiences and claims on food sovereignty, contributing to the formulation of a grassroots legislative proposal."}, {"id": "CW-13", "w": "Communities marginalised in planning processes mapped their own climate vulnerabilities and collaborated in formulating proposals for adaptation policies more res
