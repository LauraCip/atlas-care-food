, Italy, started in 2021 by Renken ETS, active in Italy-Senegal cooperation since 2006, and Ricette d'Africa APS. Its name means 'women' in Wolof, and it trains African and Middle Eastern women, whose culinary skills are not recognised as professional competence in the Italian labour market, for decent work in the hospitality sector. It operates from a refurbished multipurpose space that serves as bar, restaurant, event room and association headquarters, affiliated with Arci and partnering with the Comune di Torino on events. The project was based in Barriera di Milano from 2021 to 2023 and has been in the multiethnic Borgo Dora/Balon area since 2025.", "fam": "H", "fam2": null, "prim": ["P1", "P6"], "why": "Exemplary for Interdependence and Attentiveness as a practice of decolonial social gastronomy connecting African culinary tradition, professional training and women’s empowerment.", "sources": "renken.it/jigeenyi · editorialedomani.it · torinotoday.it (April 2025)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "W", "M", "M", "M", "T", "W", "M", "A"], "nT": 2, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://renken.it/jigeenyi"}, {"id": "F-51", "corpus": "food", "name": "Community Shop (UK social supermarkets)", "place": "United Kingdom", "period": "2013–present", "desc": "Community Shop, part of Company Shop Group, opened the UK's first social supermarket in 2013 in Goldthorpe, South Yorkshire, one of the UK's most deprived areas. It serves low-income members facing food insecurity. It collects safe and edible but unsellable surplus from large retailers and manufacturers and sells it to members at heavily discounted prices, 30% of the normal price or less, relying on donated surplus combined with public grants from local authorities. The source cites a membership fee of about £3 to 5 per week and savings of £20 to 30 per week for families. The model has since been replicated by other UK social-supermarket operators.", "fam": "D", "fam2": null, "prim": [], "why": "Exemplary for Attentiveness and Self-Determination as a model of intermediate food welfare between charity food banks and the conventional market, explicitly flagged in the source as \"transitional\" with real structural limits.", "sources": "sustainweb.org · london.gov.uk · theconversation.com · Lambie-Mumford & Dowler (2015), British Food Journal. Caraher & Furey (2018).", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "W", "M", "A", "M", "M", "M", "M", "M"], "nT": 0, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://companyshopgroup.co.uk/community-shop"}, {"id": "F-52", "corpus": "food", "name": "Arvaia CSA", "place": "Bologna, Italy", "period": "2013–present", "desc": "Arvaia is a community-supported agriculture cooperative in Bologna, Italy, founded in February 2013 by 7 members and inspired by Jardin de Coccagne in Geneva and Gartencop in Freiburg; its name comes from arvajja, Bolognese dialect for pea. Members pay an annual quota of about €780 for vegetables, with a partial work-for-share option for those who cannot pay in full, and the farm preserves peri-urban agricultural land in Parco Città Campagna. The land belongs to the Comune di Bologna and is leased at market price for €24,000 a year, with more land added after a 2015 municipal tender. Its supply chain links member organisations: grain is milled at the Cenacchi mill, made into pasta by the Iris cooperative and into bread by Forno Brisa, which also uses Arvaia's vegetables. In 2023 crops were damaged by an Animal Liberation Front act of vandalism.", "fam": "G", "fam2": null, "prim": ["P3", "P7", "P8"], "why": "Exemplary for Interdependence as the Italian CSA with the most developed integrated member supply chain (grower-miller-baker-pasta maker all mutually members), demonstrating that a CSA can extend well beyond direct vegetable-box distribution into a full circular local food economy.", "sources": "arvaia.it · Altreconomia (CSA article) · DEAFAL + Fondazione Finanza Etica + Univ. Bolzano, Pisa, Urbino (2022), NUMES: Le CSA oltre l’emergenza.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "T", "W", "M", "M", "T", "T", "M"], "nT": 3, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://arvaia.it"}, {"id": "F-53", "corpus": "food", "name": "Manifesto del Dono (Caritas Reggio Emilia-Guastalla)", "place": "Reggio Emilia, Italy", "period": "2024–present", "desc": "The Manifesto del Dono is a 2024 values manifesto of Caritas Reggiana, the diocesan Caritas network of Reggio Emilia-Guastalla, Italy, developed in research-action collaboration with Laura Cipriani's research group. It opens by noting that full refrigerators and empty pantries coexist in the same territory, and states that food poverty also reflects job precarity, insecure housing, loneliness and weakened local ties. It sets out reciprocal commitments addressed to six stakeholder groups: organisations, donors, recipients, institutions, volunteers and the community. Section 3.5, 'Oltre l'emergenza: giustizia e diritti', commits to a public voice that defends rights, and Principle 1 affirms the right to adequate, safe, healthy and culturally appropriate food. The document references DGR 793/2022 of Regione Emilia-Romagna, and no implementation evidence is yet available.", "fam": "C", "fam2": null, "prim": ["P4", "P8"], "why": "Exemplary for Politics of Care, Attentiveness and Self-Determination as the most complete Italian values-manifesto identified in this batch — the single strongest explicit right-to-food textual foundation in the Italian corpus, combined with a direct institutional-accountability claim.", "sources": "caritasreggiana.it/il-manifesto-del-dono/ · Manifesto del Dono, Caritas Reggio Emilia-Guastalla (PDF) · DGR n. 793/2022, Regione Emilia-Romagna", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "T", "M", "M", "M", "T", "W"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: A  ·  Partly: B  ·  No: C"}, "link": "https://caritasreggiana.it/il-manifesto-del-dono/"}, {"id": "F-54", "corpus": "food", "name": "Night-Time Food Deserts (Data After Dark)", "place": "London, UK", "period": "2023–present", "desc": "Night-Time Food Deserts (Data After Dark) is a research collaboration between UCL Urban Laboratory (Bartlett School of Architecture), the UCL Social Data Institute, the Greater London Authority (GLA) and Didobi Ltd, funded by the Mayor of London from 2023 to 2025. It focuses on London's night workers, about a quarter of the workforce or 1.32 million people working between 6pm and 6am, whose food access is barely covered by existing data; per the source they are concentrated in gig-economy and hospitality work and are predominantly BAME and migrant. The project developed a Local Night-time Classification (LNC), a small-area geodemographic tool that shows night workers' food-access barriers to planners. It also produced an ArcGIS StoryMap and qualitative documentation of lived experience.", "fam": "F", "fam2": null, "prim": ["P1", "P2"], "why": "Exemplary for Attentiveness and Politics of Care as a critical mapping project making visible the invisibilised food insecurity of London’s night workers; distinctive for using GIS and geodemographic classification as care-ethics research tools.", "sources": "storymaps.arcgis.com/stories/13e44bf09f1542669932e2517fdf0eb0 · dataafterdark.org · UCL Bartlett (2024) · Mavrogeni et al. (2025), Environment and Planning B.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "M", "M", "A", "A", "A", "M", "W"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: B  ·  No: A, C"}, "link": "https://dataafterdark.org"}, {"id": "F-55", "corpus": "food", "name": "Food Sharing Map EU", "place": "Europe", "period": "2023–present", "desc": "The Food Sharing Map EU is an interactive, AI-supported platform developed by Sharing Solutions, in the Geography department of Trinity College Dublin, Ireland, as part of the CULTIVATE project (Horizon Europe, grant 101083377). It is aimed at citizens, local authorities and food-policy offices, making free or low-cost food-sharing resources visible to people who may not know they exist. It classifies and geolocates food-sharing initiatives, covering growing, cooking, distributing and gifting, across the participating cities. CULTIVATE involves 19 partners in 9 European cities, including Milan, where CARE Cargobike is one of its local Action Plans. The Map is designed to continue as a civic tool after the project ends.", "fam": "F", "fam2": null, "prim": [], "why": "Exemplary for Institutionalisation of Care and Interdependence as a digital cartographic infrastructure making urban food-sharing practices legible to both citizens and institutions across 9 European cities simultaneously.", "sources": "sharingsolutions.eu/food-sharing-map · cultivate-project.eu · eu-cap-network.ec.europa.eu (CULTIVATE practice abstract)", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["W", "M", "M", "A", "A", "A", "M", "M", "W"], "nT": 0, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://sharingsolutions.eu/food-sharing-map"}, {"id": "CW-01", "corpus": "crossdomain", "name": "Manzanas del Cuidado", "place": "Bogotá, Colombia", "period": "2020–present", "desc": "", "fam": null, "fam2": null, "prim": [], "why": "", "sources": "sdmujer.gov.co · Bakker (2024) Social Politics · Gómez-Correal & Vásquez-Cardona (2025)", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": null, "link": "https://bogota.gov.co/mi-ciudad/mujer/bogota-tiene-nueva-manzana-del-cuidado-en-centro-el-camino-de-engativa"} hip coverage (2024) · Visit Rio, official listing · ArchDaily, METRO Arquitetos project page (2016) · Euronews (2017) · viajarverde.com.br, volunteer first-person account (2017).", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["T", "M", "T", "M", "M", "T", "M", "T", "M"], "nT": 4, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: C  ·  No: A, B"}, "link": "https://gastromotiva.org"}, {"id": "RIO-03", "corpus": "rio", "name": "Programa Cozinha Solidária (Federal) — a national legal framework for a distributed network of community-run solidarity kitchens", "place": "Brazil (national)", "period": "1980–present", "desc": "A national programme, set in law in 2023, that recognises and funds community-run solidarity kitchens. Many of these kitchens were created by social movements; the programme supports them without replacing them with a government-run service.", "fam": "C", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P6", "P7", "P8", "P9"], "why": "Cozinha Solidária is included in the Atlas as a particularly clear example of how a grassroots social technology can be recognised, supported and networked through a structural public policy infrastructure. The model emerged from locally organised practices of collective food provision and social movements, and was subsequently incorporated into federal law and a national programme. Rather than replacing these practices with a single standardised service, the programme creates an institutional framework that connects and supports diverse, locally governed kitchens. The Rio de Janeiro cases make this particularly visible, showing how a common federal architecture can accommodate different organisational, territorial and community configurations. The case therefore exemplifies grassroots innovation becoming institutional infrastructure: the State does not invent the social technology, but recognises, resources and connects practices that have already been developed on the ground.", "sources": "Primary / academic sources: Bello, E.; Oliveira, F.A. de; Mascarello, R.P. (2023). \"Cozinhas Solidárias e Direito à Cidade: dos movimentos sociais à política pública, uma análise a partir da Cozinha da Lapa, Rio de Janeiro.\" Revista Brasileira de Direito Urbanístico, ano 9, n.17, p.83-108. DOI: 10.52028/RBDU.v09.i17-ART04.RJ · Sordi, D. de (2023). \"Cozinhas Solidárias do Movimento dos Trabalhadores Sem Teto (MTST): solidariedade e reconstrução da esfera pública (2021-2022).\" Mundos do Trabalho, v.15. | Legal / institutional sources: Lei nº 14.628, de 20 de julho de 2023 (Planalto) · Decreto nº 11.937/2024 · Portarias MDS nº 977, 978/2024 and 1.188/2026 · gov.br/mds, Programa Cozinha Solidária (official programme pages, multiple news releases 2024-2026) · cozinhasolidaria.digital. | Rio de Janeiro-specific sources: Author's own Care Spot Map — Rio (uMap dataset, sites: Lapa/MTST, Rocinha/Gastromotiva, Rocinha/MTST, Vidigal/Cozinha do Arrocha, Chapéu Mangueira/Cozinha do Chef) · Brasil de Fato, ALERJ Comissão de Segurança Alimentar coverage (May 2024) and DF solidarity event coverage (Feb. 2025) · encontrariodejaneiro.com.br, ALERJ tribute to 112 Rio state kitchens (May 2026) · gov.br/mds, II Encontro Nacional do Programa Cozinha Solidária, Rio de Janeiro/Fiocruz (Sept. 2025) · CrazyKiwi, \"Cozinhas Solidárias Gastromotiva\" (programme origin, March 2020).", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "M", "T", "T", "T", "T"], "nT": 8, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://www.gov.br/mds"}, {"id": "RIO-04", "corpus": "rio", "name": "Hortas Cariocas — Rio de Janeiro Urban Green Gardens Programme", "place": "Rio de Janeiro, Brazil", "period": "2006–present", "desc": "Rio de Janeiro's municipal urban garden programme. Residents farm vegetable gardens on empty and often difficult plots across the city; half the produce is sold at low prices and half is donated.", "fam": "A", "fam2": null, "prim": ["P1", "P2", "P3", "P6", "P7", "P8", "P9"], "why": "P6 — Self-Determination and Competence. The programme makes autonomy an explicit feature of its support model: public resources, training and differentiated assistance are used to build the productive and organisational capacity of community-managed gardens, with support progressively reduced as gardens become self-sustaining. This is closely connected to P9 — Institutionalisation of Care, as a pre-existing collective practice is embedded in public planning, funding and infrastructure while institutional support is designed to enable, rather than permanently replace, local capacity.", "sources": "Primary / institutional sources: UN DESA Sustainable Development, SDG Actions Platform, \"Hortas Cariocas - Rio Urban Green Gardens\" (#SDGAction33527) and \"Hortas Cariocas (Urban Green Gardens)\" (#SDGAction43629) · Milan Urban Food Policy Pact, \"Hortas Cariocas Program\" project page (2019 submission) · carioca.rio (Portal Carioca Digital), official municipal service page (updated 15/12/2025) · rio.rj.gov.br/web/smac/hortas-cariocas. | Academic sources: Krell et al. (2023). \"How is a community urban garden program related to the Law? Analysis of Hortas Cariocas (Rio de Janeiro, Brazil).\" University of St. Thomas Journal of Law & Public Policy, Vol. XVI, No. 1 — includes direct interview with the programme's founder, Rio City Hall (Oct. 2020). | News & secondary sources: NBC News Latino, \"A huge lot used to smoke crack is now Latin America's largest urban garden\" (Manguinhos) · Malay Mail / Reuters, same story, additional photo documentation · Green My Favela, \"Hortas Cariocas\" (independent NGO documentation, ongoing since 2015).", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "W", "M", "T", "T", "T", "T"], "nT": 7, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: ter, node/183 · Relação de Entidades PAA (CEASA/RJ, published list). | Academic / international sources: FAO, Family Farming Knowledge Platform, PAA case profile · Global Alliance Against Hunger and Poverty, \"Programa de Compra de Alimentos do Brasil (PAA)\" country example · UFRRJ (Instituto de Agroecologia), PAA programme page.", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["T", "M", "T", "M", "M", "T", "T", "T", "T"], "nT": 6, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://www.gov.br/mds"}, {"id": "RIO-09", "corpus": "rio", "name": "Armazém do Campo — Cesta Terra Crioula", "place": "Rio de Janeiro, Brazil", "period": "2016–present", "desc": "Shops run by Brazil's Landless Workers' Movement (MST) that sell food grown in agrarian-reform settlements, including subscription baskets in Rio. Agroecological produce reaches city residents without passing through conventional retail.", "fam": "G", "fam2": null, "prim": ["P1", "P4", "P7", "P8"], "why": "The case is particularly relevant because it exemplifies how a movement can build an alternative food-market infrastructure around food sovereignty, agroecology and rural–urban interdependence. Through its network of stores, subscription schemes and multifunctional spaces, Armazém do Campo makes producers, production conditions and food-system relations more visible while creating alternative channels between MST settlements and urban consumers. It therefore offers a particularly strong example of P7 Ecology of Care, P8 Interdependence and Reciprocity, and P4 Politics of Care, with P6 Self-Determination and Competence also strongly expressed on the producer side.", "sources": "Primary sources: rio.armazemdocampo.com.br (store site, current pricing and product listings, Aug. 2026 access). | News & institutional sources: Brasil de Fato, \"MST comemora sete anos do Armazém do Campo no Rio com música, comida orgânica e defesa da agricultura familiar\" (15 Sept. 2025) · UCCLA, \"Armazém do Campo é declarado Património Cultural Imaterial do Rio de Janeiro\" (10 Aug. 2024), citing Brasil de Fato's original coverage (16 Aug. 2024).", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "W", "W", "T", "W", "M", "T", "T", "W"], "nT": 4, "depth": "Transformative", "re": "P", "reCrit": "Yes: A  ·  Partly: –  ·  No: B, C"}, "link": "https://rio.armazemdocampo.com.br"}, {"id": "RIO-10", "corpus": "rio", "name": "Restaurante do Povo + Café do Trabalhador — Governo do Estado do Rio de Janeiro", "place": "Rio de Janeiro state, Brazil", "period": "2000–present", "desc": "", "fam": "D", "fam2": null, "prim": [], "why": "", "sources": "News sources — Restaurante do Povo: Diário do Rio de Janeiro, \"Só R$ 1! Restaurante popular da Central do Brasil serve mais de 20 mil refeições em menos de 1 mês\" · Diário do Rio de Janeiro, \"Programa 'Restaurante do Povo' atinge a marca de 10 milhões de refeições servidas\" · Revista Fator Brasil / Brasil de Fato, coverage of the August 2023 Central do Brasil reopening · Sesc RJ, \"Restaurante Popular da Central do Brasil\" (operational partner page) · Wikipédia, \"Restaurante Popular (Rio de Janeiro).\" | News sources — Café do Trabalhador: Diário do Rio de Janeiro / Portal Multiplix / Rio de Janeiro em Pauta, Teresópolis unit-opening coverage (Feb. 2026) · Diário do Rio de Janeiro, Volta Redonda second-unit coverage (July 2026) · Diário do Rio de Janeiro, São Francisco de Itabapoana unit-opening coverage (Jan. 2026) · Diário do Rio de Janeiro / Jornal do Noroeste Online, \"Programa Café do Trabalhador completa 2 anos na Região Norte/Noroeste\" (July 2024).", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["M", "W", "M", "W", "W", "W", "W", "W", "M"], "nT": 0, "depth": "Emergent", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://www.rj.gov.br"}, {"id": "RIO-11", "corpus": "rio", "name": "Sacolão Itinerante — Sacolão na Comunidade (CEASA-RJ) + ESDI-UERJ redesign project", "place": "Rio de Janeiro, Brazil", "period": "2010–present", "desc": "", "fam": "D", "fam2": null, "prim": [], "why": "", "sources": "Primary sources: ESDI-UERJ, \"Sacolão Itinerante\" project record, esdi.uerj.br/projetos (archive entry, undated in the record consulted) · ESDI-UERJ, Freddy Van Camp esdiano profile page, citing the same project description. | Institutional sources: CEASA-RJ / Conacca institutional publication (June 2010), naming Sacolão na Comunidade alongside Panela Cheia and Sopa da Cidadania as CEASA-RJ social programmes.", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["M", "M", "M", "W", "M", "A", "W", "M", "M"], "nT": 0, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://esdi.uerj.br/projetos"}, {"id": "RIO-12", "corpus": "rio", "name": "Favela Orgânica — Regina Tchelly", "place": "Rio de Janeiro, Brazil", "period": "2011–present", "desc": "", "fam": "B", "fam2": null, "prim": ["P1", "P6", "P7"], "why": "", "sources": "Primary sources: favelaorganica.com.br (PT and EN) · instagram.com/favela_organica (113K followers). | Academic / institutional sources: Circular Economy For Food (Università di Scienze Gastronomiche di Pollenzo), \"Favela Orgânica\" case fact sheet, Gastronomic Design Sciences course (2025) · Towards the Human City, \"Initiative 17: Favela Orgânica, Rio de Janeiro\" · Wikipédia, \"Regina Tchelly\" (with Prêmio Jabuti and award citation trail). | News & secondary sources: G1, \"Ex-doméstica vence prêmio Jabuti com livro de receitas para reaproveitar alimentos\" (13 Apr. 2024) · Cultures of Resistance, \"Favela Orgânica\" CoR Award page (2024) · Brasil de Fato, Porto Alegre coverage (5 Sept. 2024) · Agência Brasil, Xodó de Cozinha feature (19 Apr. 2025) · Sesc Roraima, event announcement (May 2026) · TV Brasil/Bravos!, \"Regina Tchelly: a cozinha como transformação social\" (2017) · ANEGEPE, Video-Case 18 (educational case study).", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["T", "M", "M", "M", "W", "T", "T", "M", "M"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://favelaorganica.com.br"}, {"id": "RIO-13", "corpus": "rio", "name": "Ingresso Solidário / Ingresso Social", "place": "Brazil (national)", "period": "2000–present", "desc": "", "fam": "D", "fam2": null, "prim": ["P8"], "why": "", "sources": "Explainer sources: opusentretenimento.com, \"Ingresso Solidário\" · dreamfest.com.br, \"Qual a diferença entre os ingressos: inteira, meia entrada e solidário?\" (explicit definitional distinction, 40% discount example). | Legislative sources: Câmara dos Deputados / Portal do Comércio / Bom Dia Sorocaba, \"Comissão de Cultura aprova ingresso social que troca meia-entrada por doação\" (PL 3195/25, Jan. 2026) · Ministério Público do Piauí, \"Meia-entrada solidária: boa ação é doação\" project page. | Scale-example sources: G1 Ribeirão Preto e Franca, João Rock 2026 flood-relief donation coverage (27 July 2026) · Sesc-RS, \"Ingresso solidário na Arena Nº1 arrecada mais de 8 toneladas de alimentos para o Programa Sesc Mesa Brasil\" (July 2026) · Blog do Exército de Salvação, Caetano Veloso \"Pista Solidária\" coverage (2023) · Unoeste, \"Ingresso solidário faz nova entrega de alimentos\" (Comedy Produções, 2023) · Mais Goiás, Expoana 2026 food-for-ticket coverage · Câmara Municipal de Novo Hamburgo, pet-food solidarity-ticket coverage.", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["M", "W", "M", "M", "W", "W", "A", "T", "M"], "nT": 1, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://opusentretenimento.com"}, {"id": "RIO-14", "corpus": "rio", "name": "Ecoparque do Caju — Banco de Alimentos + circular waste-to-food system (COMLURB)", "place": "Rio de Janeiro, Brazil", "period": "2014–present", "desc": "A municipal waste-treatment site in Caju, one of Rio's poorest districts and a recognised food desert. Organic waste becomes compost and biogas, the compost supplies urban gardens and a local food bank was set up, within a climate partnership with a German city.", "fam": "A", "fam2": null, "prim": ["P7", "P8", "P9"], "why": "The case is included because it demonstrates how food welfare can be embedded within a circular municipal infrastructure, connecting food redistribution with organic-waste recovery, energy generation and urban agriculture. It is particularly relevant for P7 because ecological and social functions are materially interconnected; for P8 because care is sustained through dense relationships among municipal, private, academic and international actors and through connected material flows; and for P9 because these functions are embedded within long-term municipal infrastructure, policy frameworks and institutional partnerships.", "sources": "Primary / institutional sources: comlurb.prefeitura.rio, \"Ecoparque do Caju Comlurb\" (official project page, multiple embedded press releases) · Engagement Global / SKEW, \"Cologne – Rio de Janeiro: 'The partnership helps us reflect on our own actions'\" (2024 interview with Bernardo Ornelas, COMLURB, and Ute Dreiocker, City of Cologne). | News & secondary sources: G1 Rio de Janeiro, \"Veja como energia do lixo ajuda no combate à fome no Rio\" (5 Aug. 2025) · Ambiente do Meio, \"Projeto ambiental do Ecoparque do Caju da Comlurb fecha o ciclo da economia circular\" (8 Aug. 2025). | Related international documentation: EPE (Empresa de Pesquisa Energética), factsheet on Brazilian biogas (referencing Ecoparque-type biomethanization) · C40 Cities, Sustainable Waste Systems Accelerator Report (2025), situating Rio/COMLURB within a global municipal-waste-innovation network.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "M", "M", "M", "T", "T", "T"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://diariodorio.com/comlurb-celebra-parceria-internacional-para-desenvolvimento-de-projetos-no-ecoparque-do-caju/"}, {"id": "RIO-15", "corpus": "rio", "name": "Horta Comunitária Vidigal — biophilic design and Bem Viver", "place": "Rio de Janeiro, Brazil", "period": "2021–present", "desc": "", "fam": "A", "fam2": null, "prim": ["P1", "P7"], "why": "", "sources": "Primary / academic sources: Muniz, E. de P.; Costa, C.E.F. da; Sarinho, R.L.T. (2023). \"Ressignificando Espaços na Comunidade do Vidigal/RJ em Busca de uma Educação Ecológica.\" IV Colóquio de Pesquisa em Design e Arte, PUC-Rio, 13-16 Nov. 2023 · Ethnographic field diary, session RIO_2025.10.21_HORTAVIDIGAL (the researcher, visit + semi-structured interview, 21 October 2025, 13:30-16:30). | Theoretical sources cited in the primary paper: Kellert, S. & Calabrese, E. (2015), The Practice of Biophilic Design · Acosta, A. (2016), O Bem Viver · Wilson, E.O. (1984), Biofilia · Gehl, J. (2013), Cidades Para Pessoas · Latour, B. (2020), Diante de Gaia · Krenak, A. (2020), A Vida Não É Útil · Pernes, F. (2019), master's dissertation on community gardens service design, PUC-Rio · Manzini, E. (2008), Design para a Inovação Social e Sustentabilidade · Papanek, V. (1971/2014), Design para o Mundo Real · Couto, R. (2017), Eco Visões Projetuais · Tuan Yi-Fu (1983), Espaço e Lugar.", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["T", "M", "M", "W", "W", "M", "T", "M", "W"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: C  ·  Partly: –  ·  No: A, B"}, "link": "https://www.even3.com.br/anais/iv-coloquio-de-pesquisa-em-design-e-arte/672616-ressignificando-espacos-na-comunidade-do-vidigalrj---em-busca-de-uma-educacao-ecologica/"}, {"id": "RIO-16", "corpus": "rio", "name": "Horto Natureza — Comunidade do Horto", "place": "Rio de Janeiro, Brazil", "period": "1808–present", "desc": "A community of about two centuries living beside Rio's Botanical Garden, descended from enslaved families who worked the land. Threatened with eviction on environmental grounds, residents turned their care of river and forest into a claim to stay, reaching a collective agreement in 2025.", "fam": "B", "fam2": null, "prim": ["P1", "P2", "P3", "P4", "P6", "P7", "P8"], "why": "Horto Natureza is particularly relevant as a case where ecological care, collective responsibility and territorial political agency become mutually reinforcing. Its environmental practices are embedded in a broader community infrastructure of river care, cultivation, environmental monitoring and territorial knowledge. These practices do more than maintain a green space: they contribute to making ecological conditions visible, organising collective action and connecting environmental stewardship with the defence of territorial permanence. The case therefore extends the understanding of food and ecological care beyond service provision, showing how caring for a territory can also generate capacities for collective organisation and rights-claiming.", "sources": "Primary field sources: Ethnographic field diary, session RIO_2025.09.26_HORTONATUREZA (the researcher, guided visit, 26 September 2025, 13:00-17:00). | News & institutional sources: RioOnWatch, \"Projeto Horto Natureza Limpa Rio dos Macacos e Amplia Luta por Permanência\" (Emerson de Souza & Taísa Sanches, 1 May 2021) · Greenpeace Brasil, \"Adaptação de base comunitária: o exemplo da Comunidade do Horto\" (Camila Doretto, 10 Nov. 2025) · G1 Rio de Janeiro, \"Guardião do Horto alerta para a necessidade de preservação do Rio dos Macacos\" (5 Feb. 2023) · JB em Folhas, \"A natureza do Horto em pessoa\" and \"Vida Livre, um espaço para a fauna chamar de sua\" · Projeto Colabora, \"Jardim Botânico do Rio vai ganhar área de soltura de animais silvestres\" · museudohorto.org · institutovidalivre.org.br · gov.br/jbrj, \"Primeiro Seminário de Vida Livre\" programme.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "T", "T", "W", "T", "T", "T", "M"], "nT": 7, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B, C  ·  Partly: –  ·  No: –"}, "link": "https://museudohorto.org"}, {"id": "RIO-17", "corpus": "rio", "name": "PNAE — Programa Nacional de Alimentação Escolar (Merenda Escolar)", "place": "Brazil (national)", "period": "1955–present", "desc": "Brazil's national school-meals programme, a constitutional right for every public-school pupil. It reaches over forty million students a day, and part of the food must be bought from family farmers, with priority for Indigenous and quilombola communities.", "fam": "C", "fam2": null, "prim": ["P1", "P4", "P5", "P9"], "why": "The PNAE is significant for the Atlas not simply as a large-scale school-meal programme, but as a rights-based public infrastructure connecting food access, education, social protection, local food systems and public procurement. Its universal design makes access independent of household income or individual poverty assessment: students enrolled in public basic education receive meals without being identified or stigmatised as food-insecure. The case is particularly relevant for showing how the right to food can be translated into a durable public service, supported by constitutional and statutory provisions, recurring public funding and formal social oversight.", "sources": "Institutional sources: gov.br/fnde, \"Publicada nova resolução que reajusta valores do Programa Nacional de Alimentação Escolar\" (19 Feb. 2026) and \"Lei amplia compra da agricultura familiar para o Pnae\" (1 Oct. 2025) · gov.br/mec, \"Publicada resolução que reajusta repasses por aluno no Pnae\" (19 Feb. 2026) · gov.br/secom, \"Com reajuste de 14,35%, Programa Nacional de Alimentação Escolar acumula valorização de 55% desde 2023\" (9 Feb. 2026) · Resolução CD/FNDE nº 1/2026 and nº 4/2026 · Lei nº 15.226/2025 · Lei nº 11.947/2009. | Secondary sources: Wikipédia, \"Programa Nacional de Alimentação Escolar\" · UNDIME, \"Publicada nova resolução que reajusta valores do PNAE\" · IFZ (ifz.org.br), \"PNAE 2026: FNDE eleva para 45% compras da agricultura familiar\" · Sistema Toth, \"PNAE 2026: Reajuste de 14,3% na Merenda Escolar e Novas Regras.\"", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "T", "T", "W", "M", "M", "T"], "nT": 4, "depth": "Transformative", "re": "Y", "reCrit": "Yes: A, B  ·  Partly: C  ·  No: –"}, "link": "https://www.gov.br/fnde"}, {"id": "RIO-18", "corpus": "rio", "name": "Maré de Sabores + Comida de Favela Festival (Redes da Maré)", "place": "Complexo da Maré, Rio de Janeiro, Brazil", "period": "2010–present", "desc": "", "fam": "H", "fam2": null, "prim": ["P1", "P3", "P4", "P6", "P8"], "why": "", "sources": "Primary / institutional sources: redesdamare.org.br, \"Maré de Sabores\" and \"Comida de Favela\" project pages · redesdamare.org.br, \"Entrevista: Maré de Sabores completa 11 anos de trajetória\" · maredesabores.com.br, \"Quem Somos.\" | Official government source: prefeitura.rio, \"Prefeitura completa um ano do 1° Encontro Latino-americano do Pacto de Milão sobre Política de Alimentação Urbana\" (2020, describing the 2019 event and Maré de Sabores' catering role). | News & secondary sources: Metrópoles, \"Conheça projeto da Maré premiado por revista britânica de gastronomia\" (2022) · Rede Food Service, \"Gastronomia e sustentabilidade? É com a Redes da Maré!\" (2021) · Transforma FBB (Fundação Banco do Brasil), \"Maré de Sabores\" technology-social profile · Caprichar, \"Maré de Sabores\" (2017).", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["T", "M", "T", "T", "W", "T", "W", "T", "W"], "nT": 5, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://redesdamare.org.br"}, {"id": "RIO-19", "corpus": "rio", "name": "Cozinha das Tradições (CdT)", "place": "Rio de Janeiro, Brazil", "period": "2023–present", "desc": "A kitchen and gathering space in central Rio built by a university design school. Its design came from months of visits to Indigenous, quilombola, fishing and other traditional communities, whose food knowledge it records and shares.", "fam": "B", "fam2": null, "prim": ["P1", "P2", "P7", "P8"], "why": "Cozinha das Tradições exemplifies design that allows territorial context and situated food knowledge to shape the intervention from the outset. Its strongest contribution is the movement from encountering knowledge in its territories → collectively shaping the design → creating a permanent infrastructure for continued circulation of that knowledge. P1 is therefore closely connected to attentiveness, ecological care and interdependence.", "sources": "Primary / institutional sources: esdi.uerj.br/extensao/11282/cozinha-das-tradicoes (official ESDI project page) · instagram.com/cozinhadastradicoes.esdi. | News & movement sources: cba.aba-agroecologia.org.br, \"'Cozinha das Tradições' percorre territórios tradicionais do RJ para construir a alimentação do 12º CBA\" (18 Sept. 2023) · Brasil de Fato, \"Congresso Brasileiro de Agroecologia levará a Cozinha de Tradições para o Rio de Janeiro\" (20 Nov. 2023) · Rádio Yandê, \"Cozinha Tradições: tecnologia indígena\" · OTSS, \"Cozinha das Tradições: em cada prato um pedaço da história e resistência das comunidades tradicionais.\"", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "T", "M", "M", "M", "M", "T", "T", "W"], "nT": 4, "depth": "Transformative", "re": "P", "reCrit": "Yes: –  ·  Partly: C  ·  No: A, B"}, "link": "https://esdi.uerj.br/extensao/11282/cozinha-das-tradicoes"}, {"id": "RIO-20", "corpus": "rio", "name": "Ação da Cidadania Contra a Fome, a Miséria e pela Vida", "place": "Brazil (national)", "period": "1993–present", "desc": "", "fam": "D", "fam "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://empori.caritasambrosiana.it"}, {"id": "MI-05", "corpus": "milano", "name": "RECUP", "place": "Milan, Italy", "period": "2015–present", "desc": "A volunteer association that collects unsold fruit and vegetables at the end of Milan's street markets and redistributes them on the spot. Volunteers and recipients overlap, and the association campaigns on the rules for food recovery. It has spread to Rome.", "fam": "D", "fam2": null, "prim": ["P3", "P4", "P6", "P7", "P8"], "why": "P6 — Self-Determination and Competence; P8 — Interdependence and Reciprocity; P4 — Politics of Care. RECUP is particularly relevant because it combines three dimensions that are often separated in food-aid practices. First, the boundary between volunteer and recipient can remain permeable, allowing people who initially access food assistance to become active contributors. This creates opportunities for participation and reduces the conventional provider–recipient divide. Second, food recovery is organised through dense interdependence among market traders, volunteers, associations, businesses and public actors, with forms of material reciprocity emerging within the practice. Third, RECUP extends food recovery into political claims-making: its advocacy frames food surplus as a matter of public responsibility and calls for concrete regulatory and governance changes. The case therefore illustrates how a grassroots food-recovery practice can combine participation, interdependence and politicisation while progressively connecting to formal food-welfare infrastructure.", "sources": "RECUP, \"Chi siamo\" and \"Cosa facciamo\" — associazionerecup.org (history, 2016-2024 timeline, 2025 data, team, corporate volunteering, impact data) · RECUP, \"Firma la petizione\" — full legislative request text, EU aesthetic-selection data, 3,079 signatures · Comune di Milano / Radio Lombardia, \"Food Policy. Nel 2025 recuperate 1 lv": ["M", "M", "M", "W", "T", "M", "M", "M", "T"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: A, B  ·  No: C"}, "link": "https://www.milanoristorazione.it"}, {"id": "MI-10", "corpus": "milano", "name": "Foody Zero Sprechi", "place": "Milan, Italy", "period": "2020–present", "desc": "", "fam": "D", "fam2": null, "prim": ["P9"], "why": "", "sources": "[Primary / official sources] Comune di Milano, \"Contrasto allo spreco e aiuto alimentare\" (pagina ufficiale Food Policy, consultata luglio 2026) — https://www2.comune.milano.it/aree-tematiche/food_policy/contrasto-allo-spreco-e-aiuto-alimentare\n\nComune di Milano, \"Foody Zero Sprechi, nuovo Hub Aiuto Alimentare al Mercato Agroalimentare\" (Milano Cambia Aria, luglio 2025) — https://www2.comune.milano.it/web/milano-cambia-aria/-/foody-zero-sprechi-nuovo-hub-aiuto-alimentare-al-mercato-agroalimentare\n\nComune di Milano, Policy Brief \"Hub contro lo spreco alimentare nel mercato ortofrutticolo Foody Zero Sprechi\" (PDF ufficiale, SoGeMi/Comune/Fondazione Cariplo)\n\nComune di Milano, comunicato inaugurazione hub 15 dicembre 2021\n\n[News & secondary sources] Eco dalle Città, \"Food policy Milano, il 16 luglio l'inaugurazione dell'Hub Foody Zero Sprechi a Sogemi\" (luglio 2025) — ecodallecitta.it\n\nLa Voce dei Giornalisti, \"Milano, inaugurata nuova sede dell'Hub di Aiuto Alimentare Foody Zero Sprechi al Mercato Agroalimentare\" (luglio 2025)\n\nZarabazà, \"Food Policy. Taglio del nastro della nuova sede dell'Hub Aiuto Alimentare Foody Zero Sprechi\" (19 luglio 2025)\n\nIl Giorno, \"Milano e la rete contro gli sprechi\" (maggio 2025)\n\n[Panel / event sources] Trascrizione panel \"La rete Hub Aiuto Alimentare\", Milano Civil Week 2026, Politecnico di Milano — intervento di Luigi Vendola (Eco dalle Città), referente dell'Hub Foody: dati 2025 su tonnellate recuperate, quota sul totale cittadino, profilo dei volontari (inclusione lavorativa/sociale)\n\nSlide ufficiali del Comune di Milano, stesso evento — risultati di rete 2025 e infrastruttura digitale \"Bring the Food\"", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["M", "W", "M", "W", "M", "W", "M", "M", "T"], "nT": 1, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://www2.comune.milano.it/aree-tematiche/food_policy/contrasto-allo-spreco-e-aiuto-alimentare"}, {"id": "MI-11", "corpus": "milano", "name": "Isola", "place": "Milan, Italy", "period": "2016–present", "desc": "The first of Milan's neighbourhood food hubs, in the Isola district. Backed by the city, a business association and a university, it tested whether a shared local hub could recover surplus food better than separate charity efforts, with regular monitoring.", "fam": "D", "fam2": null, "prim": ["P5", "P6", "P9"], "why": "The case exemplifies how a single pilot can become the prototype of a public system: opened in 2019 under the ZeroSprechi protocol between the Comune di Milano, Assolombarda and Politecnico di Milano, the Isola hub was the first of Milan’s neighbourhood food-aid hubs and the model later replicated across the network. Its distinctive feature is responsiveness built into the infrastructure: continuous scientific monitoring and periodic review meetings have allowed the hub to adjust its processes over time and to scale rapidly during the Covid-19 emergency, before returning deliberately to a sustainable size. It is the corpus’s clearest example of a care practice institutionalised through a formal multi-actor agreement and improved through structured feedback. It also shares the limits of the waste-reduction register: recipients are reached only through intermediary organisations, with no rights language and no role in how the system is governed.", "sources": "[Primary / official sources] Comune di Milano / Comitato Quartiere Isola, \"Inaugurazione nuovo hub di quartiere Via Borsieri\" (14 gennaio 2019) — comitatoquartiereisola.it\n\nIl Giorno, \"Milano, nasce l'Hub di quartiere: raccolta e distribuzione di cibo ai poveri\" (14 gennaio 2019)\n\nPolitecnico di Milano School of Management, \"Inaugurazione Hub di Quartiere per promuovere il Dono del Cibo e ridurre lo Spreco Alimentare\" (febbraio 2019) — som.polimi.it\n\nSecondo Welfare, \"A Milano nasce l'Hub di quartiere per il recupero delle eccedenze alimentari\" (2021)\n\nfoodpolicymilano.org, \"Hub di Quartiere contro lo Spreco Alimentare\" (cronologia ufficiale hub, consultata luglio 2026)\n\nComune di Milano, \"Contrasto allo spreco e aiuto alimentare\" (pagina ufficiale Food Policy — dati Dispositivo Aiuto Alimentare Covid-19, marzo-giugno 2020)\n\nFondazione Cariplo, \"A Lambrate un nuovo hub contro lo spreco alimentare\" (giugno 2020) — fonte del dato reale del primo anno di Isola (77 t, 154.000 pasti, 21 onlus), citato lì come base per il secondo hub\n\nComune di Milano, \"Food policy. Inaugurato il nuovo hub contro lo spreco alimentare in via Bassini\" (7 ottobre 2020) — stesso dato\n\n[Panel / event sources] Trascrizione panel \"La rete Hub Aiuto Alimentare\", Milano Civil Week 2026, Politecnico di Milano — intervento di Ilaria Cattaneo (Esselunga, direzione assicurazione qualità), donatore GDO dal 2019 su Isola e Lambrate\n\nStessa trascrizione — intervento di un funzionario dell'amministrazione comunale (Area Food Policy) sulla genealogia 2015-2021 del sistema hub, sull'espansione Covid-19 e sull'Earthshot Prize\n\nSlide ufficiali del Comune di Milano, stesso evento — risultati di rete 2025 (1.057 tonnellate, 2,1 milioni di pasti-equivalenti, 18.000 nuclei familiari, ~155.000 beneficiari; infrastruttura digitale \"Bring the Food\")", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "W", "T", "T", "M", "M", "T"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://foodpolicymilano.org"}, {"id": "MI-12", "corpus": "milano", "name": "Lambrate", "place": "Milan, Italy", "period": "2016–present", "desc": "Milan's second neighbourhood food hub. The city opened it on the strength of the first hub's measured results, extending the model to the Lambrate district.", "fam": "D", "fam2": null, "prim": ["P5", "P9"], "why": "", "sources": "[Primary / official sources] Comune di Milano, \"Food policy. Inaugurato il nuovo hub contro lo spreco alimentare in via Bassini\" (7 ottobre 2020)\n\nComune di Milano, \"Food policy. Mercoledì 7 ottobre l'inaugurazione del nuovo hub di via Bassini\" (5 ottobre 2020) — elenco completo relatori\n\nFondazione Cariplo, \"A Lambrate un nuovo hub contro lo spreco alimentare\" (giugno 2020) — dettaglio accordo economico (AVIS, BCC Milano, Banco Alimentare)\n\nVita.it, \"Nasce a Lambrate un nuovo hub contro lo spreco alimentare\" (10 giugno 2020)\n\nMilano Post, \"Inaugurato il nuovo hub contro lo spreco alimentare in via Bassini\" (11 ottobre 2020)\n\nLa Milano, \"Milano, inaugurato il nuovo hub contro lo spreco alimentare in via Bassini\" (7 ottobre 2020) — elenco insegne GDO donatrici\n\n[Panel / event sources] Trascrizione panel \"La rete Hub Aiuto Alimentare\", Milano Civil Week 2026, Politecnico di Milano — intervento di Ilaria Cattaneo (Esselunga), donatore GDO su Isola e Lambrate dal 2019", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "W", "T", "A", "M", "M", "T"], "nT": 2, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://www.assolombarda.it/governance/gruppi/alimentazione/zero-sprechi/hub-di-quartiere"}, {"id": "MI-13", "corpus": "milano", "name": "Gallaratese — Spazio Indifesa", "place": "Milan, Italy", "period": "2016–present", "desc": "", "fam": "D", "fam2": null, "prim": ["P1", "P6", "P9"], "why": "", "sources": "[Primary / official sources] Terre des Hommes Italia, \"Terre des Hommes inaugura l'HUB indifesa a Milano\" (luglio 2021) — terredeshommes.it\n\nTerre des Hommes Italia, \"L'Hub contro lo spreco alimentare Spazio indifesa presenta nuovi servizi ampliati per rispondere all'Emergenza Ucraina\" (maggio 2022)\n\nTerre des Hommes Italia, pagina permanente \"Spazio Indifesa\" — terredeshommes.it/spazioindifesa\n\nMilanoToday, \"La Milano che non spreca cibo e lo distribuisce a chi ha bisogno\" (15 luglio 2021)\n\nDirect interview with the Director of Fondazione IBVA (see MI-03) — confirms IBVA's expansion to Gallaratese during the 2022 Ukraine crisis, confirmed by the researcher as referring to this hub\n\n[News & secondary sources] AgenSIR, \"Solidarietà: Milano, domani al via alle attività del nuovo Hub spazio 'indifesa delle famiglie'\" (16 settembre 2021)\n\nShareradio, \"Spazio Indifesa dei bambini e delle famiglie inaugura in Gallaratese\" (20 settembre 2021)\n\nOrdine degli Avvocati di Milano, \"Sportello in Municipio 8 con Terre des Hommes\" — conferma data 17 settembre 2021\n\nComune di Milano, \"Contrasto allo spreco e aiuto alimentare\" (pagina ufficiale — Gallaratese attivo dal 2021, gestore Terre des Hommes)", "img": null, "credit": "", "depth": null, "re": null, "full": false, "q": {"lv": ["T", "M", "M", "W", "M", "T", "M", "M", "T"], "nT": 3, "depth": "Enabling", "re": "P", "reCrit": "Yes: –  ·  Partly: B  ·  No: A, C"}, "link": "https://terredeshommes.it/spazioindifesa"}, {"id": "MI-14", "corpus": "milano", "name": "Selinunte", "place": "Milan, Italy", "period": "1999–present", "desc": "A food-aid hub in Milan's Selinunte area, run by a humanitarian organisation with experience in international emergencies. It turned a monthly food-parcel drop-off into a staffed distribution point for a public-housing neighbourhood.", "fam": "D", "fam2": null, "prim": ["P1", "P3", "P5", "P6", "P9"], "why": "", "sources": "[Primary / official sources] Comune di Milano, \"Food Policy. Inaugurato il nuovo Hub di quartiere contro lo spreco alimentare di piazzale Selinunte\" (21 giugno 2024)\n\nCOOPI, \"Milano, 21 giugno 2024: inaugurazione Hub di quartiere contro lo spreco alimentare\" — coopi.org\n\nCOOPI, \"Milano. Inaugurato l'Hub di quartiere contro lo spreco alimentare di Piazzale Selinunte\" — elenco completo relatori\n\nCOOPI, \"L'Hub di Piazzale Selinunte a Milano, uno spazio per alleviare la povertà alimentare\" (settembre 2025) — storia del progetto \"Contrasto alla povertà\" dal 1999, cifre e testimonianze dirette (incl. volontario \"Tino\")\n\nMunicipio 7 Milano Notizie dai Quartieri, \"Hub alimentare Selinunte\" — dettaglio Bando Luci a San Siro (2020) e accreditamento FEAD/OpT\n\nCOOPI, \"Milano. Con 'dona la spesa per la scuola' più di 1600 articoli raccolti\" (settembre 2024)\n\nQuindici News, \"Milano: nuovo hub di quartiere contro lo spreco alimentare in piazzale Selinunte\" (21 giugno 2024)\n\n[Panel / event sources] Trascrizione panel \"La rete Hub Aiuto Alimentare\", Milano Civil Week 2026, Politecnico di Milano — intervento diretto e dettagliato di Federico Pirola (COOPI), referente Hub Selinunte: framework a tre pilastri, cifre di rete (1.000 nuclei/3.500 beneficiari/400 diretti/8 enti), attivazione beneficiari, uso di BringTheFood e MiBase", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "M", "T", "T", "M", "M", "T"], "nT": 5, "depth": "Transformative", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://coopi.org"}, {"id": "MI-15", "corpus": "milano", "name": "Loreto (Hub diffuso)", "place": "Milan, Italy", "period": "2017–present", "desc": "A 'diffuse' food hub in Milan's Loreto area. Instead of a new building, the city recognised and connected a network of parishes, community centres and listening points that had supported the neighbourhood for years.", "fam": "D", "fam2": null, "prim": ["P2", "P5", "P9"], "why": "The case exemplifies the hub as a diffuse community network rather than a single site. Hub Loreto formalises a territorial network of trust built over years of prior work through the QuBì programme, and distributes it across three locations (a university space, a parish and a volunteer association) under a single coordination. Six partners hold distinct and complementary roles: cargo-bike logistics, urban and hydroponic growing, parish distribution, mutual aid and overall coordination, together with a design research lab. Food is one thread of a wider community project that also includes job seeking, health and group activities. Its strongest dimensions are attentiveness, rooted in a dense pre-existing listening infrastructure of parishes and help centres, and interdependence, with the most heterogeneous network in the Milan corpus. Like the other hubs, it remains outside a rights register, and recipients have no documented role in governance.", "sources": "Comune di Milano, \"Inaugurato il nuovo hub di quartiere contro lo spreco alimentare a Loreto\" (9 Jul. 2024) · Mi-Tomorrow, \"Viale Monza, nuovo hub contro lo spreco\" (7 Jul. 2024) — full speaker list, incl. the Politecnico professor and the UK Consul General · MilanoToday, confirms \"seventh hub,\" mentions composting · Vivere Milano and parallel local press coverage (9-10 Jul. 2024) · Comunità Pastorale Santi Marta, Maria e Lazzaro (Turro parish) · Fondazione Cariplo, preliminary announcement (Feb. 2024) | Panel / event sources: transcript, \"La rete Hub Aiuto Alimentare\" panel, Milano Civil Week 2026 — detailed intervention from the Comin representative for Hub Loreto: QuBì genealogy, six partners' roles, figures (roughly 1,000 households), Off Campus relocation, work/autonomy project groups.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "T", "M", "W", "T", "M", "M", "M", "T"], "nT": 3, "depth": "Enabling", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://www.assolombarda.it/governance/gruppi/alimentazione/zero-sprechi/hub-di-quartiere"}, {"id": "MI-16", "corpus": "milano", "name": "Refettorio Ambrosiano", "place": "Milan, Italy", "period": "2015–present", "desc": "A Caritas dining hall in a former parish theatre in Milan, created for Expo 2015 from an idea by chef Massimo Bottura and Davide Rampello. Guests referred by Caritas services are welcomed by name at fixed tables each evening for a dinner cooked mainly from surplus.", "fam": "D", "fam2": "E", "prim": ["P1", "P7"], "why": "The case exemplifies dignity built through design and beauty. Conceived by Massimo Bottura and Davide Rampello for Expo Milano 2015, in a former parish theatre restored by Politecnico di Milano and furnished by designers and artists, the Refettorio treats space, aesthetics and relationships as ethical rather than decorative choices. Guests, mostly homeless people referred by Caritas services, are called by name, keep the same table and share the meal with the same companions every evening, turning a canteen into a place of recognition. Over ten years the project has extended its reach to new groups, such as older people living alone, and to new forms of care, including surplus cooking and a renewable energy community. It is also the origin of the Food for Soul model later replicated internationally, including in Gastromotiva’s Refettorio in Rio de Janeiro (Chapter 6.1). Its limits mirror its strengths: access by referral and a stable group of guests make relationships possible but restrict reach, recipients have no structured path towards autonomy, and the right to food is affirmed in public statements rather than enacted through claims or participation.", "sources": "[Primary / official sources] Refettorio Ambrosiano, \"Il progetto\" — refettorioambrosiano.it/il-progetto (storia, ideatori, restauro, simbologia logo)\n\nRefettorio Ambrosiano, \"Mensa\" — refettorioambrosiano.it/mensa (modello relazionale, 96 ospiti, integrazione con SAM/SAI/SILOE)\n\nFarsi Prossimo, \"Refettorio Ambrosiano\" — farsiprossimo.it/project/refettorio-ambrosiano (dati operativi: orari, équipe, modalità di accesso, ret istening. Since 1998, the association’s mobile unit, a camper staffed by volunteers and a professional educator, has toured Milan four evenings a week, offering homeless people food, clothing and blankets as a way to build trust and accompany them towards shelters, canteens and health services. This principle is stated explicitly in a project funded by the Municipio 1, “Anche l’Ascolto Nutre” (“Listening also nourishes”). There, food becomes a tool to approach, interact and bring out needs that often remain unexpressed: the most explicit articulation of attentiveness in the Milan corpus. The street service is deliberately low-threshold and unconditional, kept distinct from a more structured, time-limited support for referred households, and it is coordinated with the City’s mobile-unit system to avoid overlaps. It shows how a small volunteer organisation can embed relational care within a multi-level public architecture, from the Municipio to European funding. Its limits lie in what follows from its role: autonomy is pursued only in the services downstream of the street encounter, and the right to healthy food, though named by its founder, is not pursued through claims or recipients’ participation.", "sources": "[Primary / official sources] Ronda Carità e Solidarietà, homepage — rondacaritamilano.com (dati aggregati: 15.000+ pasti/anno, 200 uscite notturne, 1.000+ sacchi a pelo/coperte, 50+ volontari)\n\nRonda Carità e Solidarietà, \"Unità mobile\" — rondacaritamilano.com/le-nostre-attivita/unita-mobile (descrizione del servizio, tabella dati 2024 completa)\n\nRonda Carità e Solidarietà, \"Sostegno alimentare\" (Pacchi viveri) — rondacaritamilano.com/le-nostre-attivita/pacchi-viveri (descrizione, integrazione FSE+/PN Inclusione, dati 2025, partnership Robin Foood dal 2017)\n\nRonda Carità e Solidarietà, \"Anche l'Ascolto Nutre, in collaborazione con il Municipio 1 di Milano\" — rondacaritamilano.com/progetti-conclusi (10 settembre 2024) — la formulazione più esplicita del principio del cibo come strumento relazionale\n\nRonda Carità e Solidarietà, \"La nostra storia\" — rondacaritamilano.com/chi-siamo/la-nostra-storia\n\nRonda Carità e Solidarietà, \"Struttura associativa\" — rondacaritamilano.com/chi-siamo/struttura-associativa (dati RUNTS, registro regionale, biografia della fondatrice e di uno staff educatore)\n\n[Press & secondary sources] Vita.it, \"Ronda della Carità da 19 anni con i senza dimora\" (2017) — intervista a Magda Baietta, citazione sul diritto a un'alimentazione sana, partnership Isacchi Samaja\n\nChiesa di Milano, \"Ronda della Carità: da 19 anni accanto ai senza dimora\" (2017) — stesso contenuto, fonte diocesana\n\nRadio Popolare, \"Senza dimora a Milano, il lavoro dell'associazione Ronda Carità e Solidarietà\" (2020) — intervista a Magda Baietta, conferma \"quattro sere a settimana\", chiusura ad agosto\n\nMilano Altruista, scheda \"Ronda Carità e Solidarietà Onlus\" — milanoaltruista.org\n\nRete del Dono, scheda \"Ronda Carità e Solidarietà Onlus\" — retedeldono.it (nota: riporta \"5 uscite serali e 2 diurne\", numero diverso dalle fonti più recenti — trattato come possibile variazione non riconciliata)\n\n[Sources consulted but not used] rondadellacaritaverona.org — controllato: sembra un'organizzazione di Verona con nome simile ma non risulta collegata organizzativamente a Ronda Carità e Solidarietà Milano; non usata come fonte.", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "W", "M", "M", "A", "M", "M"], "nT": 0, "depth": "Emergent", "re": "P", "reCrit": "Yes: –  ·  Partly: A  ·  No: B, C"}, "link": "https://rondacaritamilano.com"}, {"id": "MI-21", "corpus": "milano", "name": "Le Mense Storiche di Milano", "place": "Milan, Italy", "period": "1959–present", "desc": "", "fam": "D", "fam2": null, "prim": [], "why": "", "sources": "[Primary / official sources] Opera San Francesco per i Poveri, \"La Mensa\" — operasanfrancesco.it/servizi/la-mensa (1959, 2 function prinCard(p){

  return `<details class="prin" id="${p.id}"><summary><span class="pid">${p.id}</span><span class="pname">${esc(p.name)}</span><span class="psol en">${esc(p.solution)}</span><span class="more">Open the card</span></summary>

    ${v.why.length?`<details class="why"><summary>Why: the care lens</summary><div class="wl">${v.why.map(x=>`<div><b>${pl(esc(x[0]))}</b><span>${esc(x[1])}</span></div>`).join('')}</div></details>`:''}
    <section><h2>${esc(DATA.outputLabel)}</h2><ul class="bullets">${v.produce.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="small" style="margin-top:.4rem">Possible outputs, not prescribed ones: choose the tools and outputs useful for the situation.</p></section>
    <section><h2>Limits and possible returns</h2><p>${esc(v.limit)}</p><p style="margin-top:.5rem">Then: ${v.next.map(n=>`${dmLink(n[0])} ${esc(n[1])}`).join('; ')}.</p></section>
    <div class="next">${prev?`<a href="#dm-${prev}">← ${WMNAME[prev]}</a>`:'<span></span>'}${next?`<a href="#dm-${next}">${WMNAME[next]} →</a>`:''}</div>
  </div>
  <aside class="aside">
    <div class="panel"><div class="lbl">Tools</div>${tools}${v.toolsNote?`<p class="small">${esc(v.toolsNote)}</p>`:''}</div>
    <div class="panel"><div class="lbl">Closest role</div>${v.role.length>70?`<p class="small">${esc(v.role)}</p><p class="small"><a href="#guida-ruoli">The three design roles</a></p>`:`<p><a href="#guida-ruoli">${esc(v.role)}</a></p><p class="small">The position is chosen in FRAME and may change.</p>`}</div>
    <div class="panel"><div class="lbl">Empirical grounding</div><p class="small">${esc(v.evidence)}</p></div>
    <div class="panel atl"><div class="lbl">In the Atlas</div><p class="small">${esc(v.atlasNote||DATA.atlasNote)}</p>${v.atlas.map(a=>`<div class="atl-item">${caseLink(a.id)}<span class="small">${esc(a.w)}</span></div>`).join('')}</div>
  </aside></div>`;
}

let F = {corpus:'all', fam:'', prin:'', q:'', view:'grid'};
try { const s = JSON.parse(localStorage.getItem('cfd-filter')||'null'); if (s) F = Object.assign(F, s); } catch(e){}
function saveF(){ try { localStorage.setItem('cfd-filter', JSON.stringify(F)); } catch(e){} }
function vAtlas(){
  const corpora = [['all','All'],['food','Food welfare worldwide'],['rio','Rio de Janeiro'],['milano','Milan'],['crossdomain','Other fields of welfare']];
  const cnt = k => k==='all' ? DATA.cases.length : DATA.cases.filter(c=>c.corpus===k).length;
  return `<div class="sec-h"><span class="eyebrow">Atlas of Care(full) Practices</span><h1 style="font-size:var(--s-xxl)">Atlas</h1>
    <p>${DATA.cases.length} practices read with the same grammar. They are cues, not models to replicate: they come after reading the situation.</p></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="Corpus">${corpora.map(([k,l])=>`<button type="button" data-corpus="${k}" aria-pressed="${F.corpus===k}">${l} <span class="small">${cnt(k)}</span></button>`).join('')}</div>
    <div class="frow">
      <label for="f-fam">Family<select id="f-fam"><option value="">All families</option>${DATA.families.map(f=>`<option value="${f.code}" ${F.fam===f.code?'selected':''}>${f.code} · ${esc(f.thesis)}</option>`).join('')}</select></label>
      <label for="f-prin">Principle at T (food, Rio, Milan)<select id="f-prin"><option value="">All principles</option>${DATA.principles.map(p=>`<option value="${p.id}" ${F.prin===p.id?'selected':''}>${p.id} · ${esc(p.name)}</option>`).join('')}</select></label>
      <label for="f-q">Search<input id="f-q" type="search" placeholder="name, place, word" value="${esc(F.q)}"></label>
    </div>
    <div class="frow" style="justify-content:space-between"><div class="count" id="f-count"></div>
    <div class="seg" role="group" aria-label="View"><button type="button" data-view="grid" aria-pressed="${F.view==='grid'}">Cards</button><button type="button" data-view="map" aria-pressed="${F.view==='map'}">Map</button></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="mapbox" id="mapbox" hidden><div class="maptools"><div class="seg" role="group" aria-label="Zoom"><button type="button" data-zoom="world">World</button><button type="button" data-zoom="rio">Rio de Janeiro</button><button type="button" data-zoom="milano">Milan</button></div><span class="small">Drag and scroll to explore</span></div><div id="mapsvg"></div><div class="nogeo" id="nogeo"></div><div class="maptip" id="maptip" hidden></div></div>`;
}
function renderGrid(){
  const q = F.q.trim().toLowerCase();
  const list = DATA.cases.filter(c => (F.corpus==='all'||c.corpus===F.corpus) && (!F.fam||c.fam===F.fam||c.fam2===F.fam) && (!F.prin||c.prim.includes(F.prin)) && (!q || (c.name+' '+c.place+' '+c.desc).toLowerCase().includes(q)));
  $('#f-count').textContent = `${list.length} practices` + (F.fam ? ` · family ${F.fam}, ${FAM[F.fam].thesis}` : '');
  const isMap = F.view === 'map';
  $('#grid').hidden = isMap; $('#mapbox').hidden = !isMap;
  if (isMap) drawMap(list); else $('#grid').innerHTML = list.length ? list.map(specCard).join('') : `<p class="small">No practices match these filters.</p>`;
}
let MAP = null;
function drawMap(list){
  const box = $('#mapsvg');
  if (!window.d3 || !window.topojson) { box.innerHTML = '<p class="small" style="padding:1rem">The map did not load: the libraries could not be reached.</p>'; return; }
  const W = 960, H = 500;
  if (!MAP) {
    const proj = d3.geoNaturalEarth1().fitExtent([[8,8],[W-8,H-8]], {type:'Sphere'});
    const path = d3.geoPath(proj);
    box.innerHTML = '';
    const svg = d3.select(box).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role','img').attr('aria-label','Map of the Atlas practices');
    const g = svg.append('g');
    g.append('path').attr('class','sphere').attr('d', path({type:'Sphere'}));
    g.append('path').attr('class','land').attr('d', path(topojson.feature(LAND, LAND.objects.land)));
    const dots = g.append('g');
    const zoom = d3.zoom().scaleExtent([1, 400]).on('zoom', ev => { g.attr('transform', ev.transform); dots.selectAll('circle').attr('r', 5/Math.sqrt(ev.transform.k)).attr('stroke-width', 1/ev.transform.k); });
    svg.call(zoom);
    MAP = {svg, g, dots, proj, zoom, W, H};
    document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => zoomTo(b.dataset.zoom)));
  }
  const pts = list.filter(c => COORDS[c.id]);
  const tip = $('#maptip');
  MAP.dots.selectAll('circle').data(pts, d => d.id).join('circle')
    .attr('cx', d => MAP.proj([COORDS[d.id][1], COORDS[d.id][0]])[0])
    .attr('cy', d => MAP.proj([COORDS[d.id][1], COORDS[d.id][0]])[1])
    .attr('r', 5).style('fill', d => famColor(d.fam))
    .on('click', (ev, d) => { location.hash = 'caso-' + d.id; })
    .on('mousemove', (ev, d) => { const r = $('#mapbox').getBoundingClientRect(); tip.hidden = false; tip.textContent = shortName(d.name) + ' · ' + d.place; tip.style.left = (ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top + 12) + 'px'; })
    .on('mouseleave', () => { tip.hidden = true; });
  const miss = list.filter(c => !COORDS[c.id]);
  $('#nogeo').innerHTML = miss.length ? `Without a single location (networks or distributed projects): ${miss.map(c => caseLink(c.id)).join(', ')}` : '';
}
function zoomTo(where){
  const Z = {world:null, rio:[-43.35,-22.92, 90], milano:[9.19,45.47, 160]};
  const z = Z[where];
  let t = d3.zoomIdentity;
  if (z) { const [x,y] = MAP.proj([z[0], z[1]]); t = d3.zoomIdentity.translate(MAP.W/2, MAP.H/2).scale(z[2]).translate(-x, -y); }
  MAP.svg.transition().duration(600).call(MAP.zoom.transform, t);
}
function specCard(c){
  return `<a class="spec" href="#caso-${c.id}" style="--fc:${famColor(c.fam)}">
    <div class="ph">${c.img?`<img src="${esc(c.img)}" alt="">`:`<span class="lt">${c.fam||'·'}</span>`}</div>
    <div class="credit">${c.credit?esc(c.credit):'Image · credit to be added'}</div>
    <div class="b"><span class="pl">${esc(CORPUS[c.corpus])} · ${esc(c.place)}</span><h3>${esc(shortName(c.name))}</h3>
    <div class="tags">${c.fam?`<span class="pill"><span class="dot" style="background:${famColor(c.fam)}"></span>${c.fam} · ${esc(FAM[c.fam].thesis)}</span>`:'<span class="pill">no family assigned</span>'}</div></div></a>`;
}
function bindAtlas(){
  document.querySelectorAll('[data-corpus]').forEach(b => b.addEventListener('click', () => { F.corpus = b.dataset.corpus; document.querySelectorAll('[data-corpus]').forEach(x=>x.setAttribute('aria-pressed', x===b)); saveF(); renderGrid(); }));
  $('#f-fam').addEventListener('change', e => { F.fam = e.target.value; saveF(); renderGrid(); });
  $('#f-prin').addEventListener('change', e => { F.prin = e.target.value; saveF(); renderGrid(); });
  $('#f-q').addEventListener('input', e => { F.q = e.target.value; saveF(); renderGrid(); });
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { F.view = b.dataset.view; document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed', x===b)); saveF(); MAP = null; renderGrid(); }));
  MAP = null;
  renderGrid();
}

function vCase(id){
  const c = CASE[id]; if (!c) return vNotFound();
  const f = c.fam && FAM[c.fam];
  const links = [];
  if (f) links.push(`Family <a href="#guida-repertorio">${c.fam} · ${esc(f.thesis)}</a> in the repertoire`);
  (usedIn[id]||[]).forEach(h => links.push(h));
  const LV = {T:'transformative', M:'moderate', W:'weak', A:'absent', NV:'not verifiable'};
  const RE = {Y:'Rights-Enacting', P:'Partly Rights-Enacting', N:'Not Rights-Enacting'};
  const q = c.q;
  const quant = q ? `<div class="quant"><div class="lv">${q.lv.map((l,i)=>`<span class="${l}" title="P${i+1} · ${esc(PRIN['P'+(i+1)].name)}: ${LV[l]||l}">P${i+1}<b>${esc(l)}</b></span>`).join('')}</div>
      <div><b>${esc(q.depth)}</b> depth of care · ${q.nT} of 9 principles at T</div>
      <div><b>${esc(RE[q.re]||q.re)}</b> <span class="small">· criteria ${esc(q.reCrit)}</span></div>
      <div class="small">A absent · W weak · M moderate · T transformative · NV not verifiable. Readings made with the Care Matrix by a single researcher on the available sources (<a href="#guida-ricerca">about the research</a>).</div></div>`
    : `<span class="small">${c.corpus==='food'?'—':'Care Matrix data for this corpus to be added.'}</span>`;
  const prim = c.prim.map(p => `<span class="pill" title="${esc(PRIN[p].name)}">${p} · ${esc(PRIN[p].name.split(/[ ,&]/)[0])}</span>`).join(' ');
  return `<div class="crumbs"><a href="#atlas">Atlas</a><span>/</span><span>${esc(CORPUS[c.corpus])}</span><span>/</span><span>${esc(c.id)}</span></div>
  <article class="case" style="--fc:${famColor(c.fam)}">
    <div>
      <div class="media"><div class="ph">${c.img?`<img src="${esc(c.img)}" alt="">`:`<span class="lt">${c.fam||'·'}</span>`}</div><div class="credit">${c.credit?esc(c.credit):'Image · credit to be added'}</div></div>
      <dl class="meta">
        <div><dt>Where</dt><dd>${esc(c.place)}</dd></div>
        <div><dt>When</dt><dd>${esc(c.period)}</dd></div>
        <div><dt>Corpus</dt><dd>${esc(CORPUS[c.corpus])}</dd></div>
        <div><dt>Family</dt><dd>${f?famPill(c.fam):'not assigned'}${c.fam2?' '+famPill(c.fam2):''}</dd></div>
      </dl>
    </div>
    <div class="main">
      <div style="display:grid;gap:.5rem"><span class="eyebrow">${esc(c.id)}</span><h1>${esc(shortName(c.name))}</h1>${shortName(c.name)!==c.name?`<p class="small">${esc(c.name)}</p>`:''}</div>
      ${c.full?`<p class="desc">${esc(c.desc)}</p>${c.why?`<div class="sect"><h2>Why it is in the Atlas</h2><p>${esc(c.why)}</p></div>`:''}`:''}
      <div class="sect"><h2>Care Matrix reading</h2>${quant}</div>
      ${links.length?`<div class="sect"><h2>In the guide</h2><div class="linked">${links.map(l=>`<span>${l}</span>`).join('')}</div></div>`:''}
      ${c.link?`<div class="sect"><h2>Sources</h2><p class="small"><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.link.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a></p></div>`:''}
    </div>
  </article>`;
}
function vNotFound(){ return `<p>Page not found. <a href="#home">Back to the start</a>.</p>`; }

function route(){
  const h = (location.hash||'#home').slice(1);
  let html, after, nav = '';
  if (h === 'home' || h === '') html = vHome();
  else if (h === 'manifesto') { html = vManifesto(); nav = 'manifesto'; }
  else if (h === 'guida' || h.startsWith('guida-')) { html = vGuide(); nav = 'guida'; after = () => { if (h !== 'guida') { const el = document.getElementById(h); if (el) el.scrollIntoView(); } }; }
  else if (h.startsWith('dm-')) { html = vDM(h.slice(3)); nav = 'guida'; }
  else if (h.startsWith('wm-')) { html = vDM(h.slice(3)); nav = 'guida'; }
  else if (h === 'atlas') { html = vAtlas(); nav = 'atlas'; after = bindAtlas; }
  else if (h.startsWith('fam-')) { F.fam = h.slice(4); F.corpus = 'all'; F.prin=''; F.q=''; saveF(); html = vAtlas(); nav = 'atlas'; after = bindAtlas; }
  else if (h.startsWith('caso-')) { html = vCase(h.slice(5)); nav = 'atlas'; }
  else html = vNotFound();
  $('#app').innerHTML = `<div class="view">${html}</div>`;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (after) after(); else if (!h.startsWith('guida-')) window.scrollTo(0,0);
  if (h.startsWith('caso-') || h.startsWith('dm-')) window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
