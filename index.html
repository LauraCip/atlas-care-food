ponsive to local conditions, including the issue of access to safe and affordable housing."}, {"id": "F-13", "w": "People with direct experience of food insecurity imagined and built models of their ideal space for eating together. The participants' critiques contributed to modifying the project, while the travelling installation opened opportunities for alliances with networks active on land, mutual aid and food history."}], "limit": "Creating a space for dialogue does not guarantee that all actors can influence decisions in the same way, nor that the proposals developed will be implemented. Participation can reproduce existing inequalities and transfer further work onto people and communities who are already overburdened. When claims require political decisions, public resources or regulatory changes, ACTIVATE can help to articulate them and to identify the responsible interlocutors, but it cannot take their place.", "next": [["BUILD", "to develop and test the selected proposals"], ["SURFACE", "when the discussion brings out conflicts, asymmetries or positions that the previous readings had not captured"]], "evidence": "Partly tested through workshops and teaching activities at PUC-Rio.", "atlasNote": "The cases reported were not designed through Care(full) Design. They illustrate different ways in which dialogue between actors, collective elaboration and the construction of claims can contribute to orienting policies and transformations of food systems."}, {"id": "BUILD", "code": "DM-05", "space": "Space of making", "rde": "D", "sub": "Developing solutions through the care lens", "q": "How can we develop a solution that organises care more justly?", "status": "partial", "one": "Designing, testing and consolidating concrete solutions — services, spaces, infrastructures, programmes, policies and governance arrangements — assessing how they distribute responsibilities, resources and care work.", "does": ["BUILD turns the issues that emerged in the previous phases, or the initial intuitions of a project, into concrete solutions. It may involve prototyping, testing, iteration and implementation, using the design methods best suited to the context. The care lens orients these activities towards a further question: not only whether a solution works, but how it organises care, for whom and under what conditions. It therefore leads to questioning the distribution of responsibilities, the recognition of the work needed for it to function, the possibilities of access and the conditions of continuity over time.", "BUILD can start from the outcomes of the other design moves, for example from the proposals formulated in ACTIVATE, or be used on its own. In both cases, the Framework has a generative function: the characteristics of a care(full) solution become criteria for developing and comparing alternatives; the Care Matrix helps to identify the dimensions of care that a proposal strengthens or risks weakening; the Atlas offers a repertoire of mechanisms to be adapted to the context, not models to be replicated in full."], "when": ["When a service, a space, a rule or an organisational arrangement needs to be designed or modified.", "When a proposal that emerged from ACTIVATE, or from another process, needs to be developed, tested or made operational."], "do": [["Define the design criteria", "Use the characteristics of the care(full) solution to orient development and compare alternatives."], ["Question the proposal with the Care Matrix", "Identify which dimensions of care are strengthened, which remain unresolved and which risk being weakened."], ["Read the solution within the existing system", "Use the Care Spot Map to recognise services and resources already present, possible overlaps and gaps, and to understand how the proposal relates to them."], ["Adapt mechanisms from the Atlas", "Examine how other cases address specific issues — for example, access without means-testing, the recognition of care work, feedback channels or continuity beyond funding — and assess what is transferable, under what conditions and with what limits."], ["Design the operating conditions", "Move, where appropriate, from the temporary prototype to a more stable arrangement, making explicit responsibilities, resources, the work required, maintenance and conditions of continuity."]], "ask": [["P3", "Who will be accountable for care, and with what resources? Is responsibility shared and sustained, or transferred onto those who already carry its burden?"], ["P6", "Who will carry out the work needed for the solution to function, and with what recognition? Can the solution continue to function without the presence of those who designed it?"], ["P5", "Through which channels will care-receivers and care-givers be able to report what is not working? Who will collect these reports and be responsible for responding to them?"], ["P7, P8", "Who will take care of maintenance? What material, social and ecological costs does the solution entail, and on whom or on what do they fall?"], ["P9", "How can what works be made durable without eroding the autonomy of the people involved and the relational dimension of care?"]], "why": [], "tools": ["TOOL-01", "TOOL-02"], "toolsNote": "Characteristics of the care(full) solution (Tab. 7.1-02); mechanisms from the Atlas.", "produce": ["Prototypes, services, spaces or organisational arrangements developed and, where possible, tested.", "Responsibilities, resources and care work needed for functioning made explicit.", "Criteria for observing functioning over time and identifying what will need to be maintained, modified or supported at the end of the project."], "role": "Embedded Collaborator", "atlas": [{"id": "RIO-03", "w": "Mechanism: a law that recognises and funds kitchens born from social movements, leaving their management to the communities."}, {"id": "F-24", "w": "Mechanism: access without distinction between those who pay and those who do not, in the same space and at the same tables."}, {"id": "F-22", "w": "Mechanism: infrastructures for food, water and energy co-designed so that residents can maintain them on their own."}, {"id": "F-12", "w": "Mechanism: those who complete the course receive a kit to start a garden at home, with a gradual pathway towards production and sale."}, {"id": "RIO-17", "w": "Mechanism: a mandatory share of purchases from small-scale family farming within a universal school meals service."}], "limit": "BUILD can develop and test a proposal, but it cannot replace the political and institutional decisions needed to guarantee its implementation, resources or continuity. Mechanisms borrowed from the Atlas must be assessed and adapted to the context: the conditions that make them viable in one case may not be present in another.", "next": [["EVALUATE", "to observe the effects of the solution over time and correct its critical issues"], ["ACTIVATE", "if testing brings out voices, conflicts or neglected issues that require a new collective discussion"]], "evidence": "Partly tested through student projects at PUC-Rio; the generative use of the Care Matrix has not been tested.", "atlasNote": "These cases were not designed with Care(full) Design. They illustrate some ways in which specific dimensions of care can be translated into organisational, institutional or spatial solutions."}, {"id": "EVALUATE", "code": "DM-06", "space": "Evaluative return", "rde": "E", "sub": "Evaluating and repairing through care", "q": "What has changed, for whom, and what needs to be repaired?", "status": "partial", "one": "Assessing what an intervention has transformed, reproduced or displaced, and deciding what to adapt, reorient or discontinue.", "does": ["EVALUATE + REPAIR complements assessments of effectiveness, efficiency and impact with a reading of how the intervention has reorganised care, responsibilities and relationships. Repair draws on the conception of care proposed by Fisher and Tronto (1990): evaluating also means recognising what has not worked and deciding how to intervene, adapting, reorienting, scaling down or abandoning what has proved inadequate.", "The care lens draws attention to four aspects: the depth of care and the effective recognition of rights may evolve in different directions; responsibilities and care work may be redistributed or simply transferred onto other subjects; adapting an intervention on the basis of the data collected is not necessarily the same as responding to the experiences and requests of care-receivers and care-givers; finally, it is necessary to consider what remains at the end of the project and on whom the responsibilities and costs of its continuity fall."], "when": ["After an intervention, at different intervals, to observe its effects over time.", "When the actors involved, the mandate or the resources on which the intervention rests change."], "do": [["Re-read the practice with the Care Matrix", "with the same dimensions used in SITUATE, looking for continuities, transformations and new critical issues."], ["Re-read the system", "Use the Care Spot Map and the Urban Food Conflict Map to observe how the distribution of care, the relations between actors and the tensions present in the context have changed."], ["Compare perspectives", "of care-receivers and care-givers and of those who manage the intervention."], ["Decide what to repair", "On the basis of what has emerged, establish what to adapt, reorient, scale down or discontinue, making explicit the reasons for the decisions and the subjects called upon to implement them."]], "ask": [["P3", "Have responsibilities and care work been redistributed, or transferred onto those who already carried their burden?"], ["P2, P6", "Have care-receivers been able to influence decisions and their revision?"], ["P5", "Are there channels through which critical issues can be reported? Who is required to collect the reports and respond?"], ["P9", "Does care maintain over time its relational character and the capacity of the people involved to act and influence decisions?"]], "why": [], "tools": ["TOOL-01", "TOOL-02", "TOOL-03", "TOOL-04"], "toolsNote": "", "produce": ["A reading of the effects of the intervention, compared with the initial situation and with the experiences of the subjects involved.", "Reasoned decisions on what to adapt, reorient, scale down or discontinue, and on who should intervene.", "Indications on which design move to reactivate to address the critical issues that have emerged."], "role": "Embedded Collaborator", "atlas": [{"id": "F-13", "w": "The prototype was reconfigured in response to the participants' critiques. The case shows how dialogue with the people involved can lead to modifying a solution during the process."}, {"id": "MI-12", "w": "A second hub was launched on the basis of the measured results of the first. The case makes it possible to question the difference between adapting an intervention on the basis of data and responding to the experiences and perspectives of the people involved."}], "limit": "EVALUATE + REPAIR can identify critical issues and formulate indications for intervening, but it cannot replace the political decisions or the allocation of public resources on which the effects and continuity of the intervention depend. Evaluation can make these dependencies visible and indicate who must be involved in resolving them, without being able to guarantee that the necessary conditions are met.", "next": [["SITUATE", "if new gaps emerge in the response to needs or in the organisation of care"], ["SURFACE", "if conflicts or contested responsibilities emerge that need to be made visible"], ["ACTIVATE", "if the discussion needs to be reopened and the proposals reformulated"], ["BUILD", "if a solution or the conditions of its functioning need to be modified"], ["FRAME", "if the mandate, the actors involved or the institutional conditions of the intervention change"]], "evidence": "Tested in analytical form through the re-reading of practices with the Care Matrix; a complete cycle of evaluation and repair was not observed in the research.", "atlasNote": "These cases were not designed with Care(full) Design. They illustrate some ways in which the revision of a practice or a solution can contribute to changing how it functions, also highlighting the difference between adapting an intervention and responding to the experiences of the people involved."}], "tools2": [{"code": "TOOL-01", "n": "Care Matrix", "k": "Reading a practice", "status": "research", "use": "Reading how a food welfare practice organises care through the nine principles of the Framework. It keeps distinct the depth of care and its capacity to translate into rights (Rights-Enacting), and uses specific alerts to flag critical issues, such as the invisibilisation of conflict or care-washing.", "gen": "Applied to a proposal rather than to an existing practice, it helps to question design choices: which dimensions of care could be strengthened, which would remain unresolved and which would risk being weakened. This generative use is proposed by the Framework but has not yet been tested in the research.", "coll": "It can be used as a guide for discussion between those who organise, provide and receive care, or to discuss different practices in the same territory. The aim would be to make explicit the divergences between readings and the criteria by which a practice is assessed. This mode of collective use has not yet been tested.", "miss": "It analyses the characteristics of the practice on the basis of the available evidence, but does not, on its own, convey the system of relationships, institutions and conflicts in which the practice is embedded. The reading depends on the quality and completeness of the sources.", "dm": ["SITUATE", "SURFACE", "BUILD", "EVALUATE"], "refs": [], "refsIntro": ""}, {"code": "TOOL-02", "n": "Care Spot Map", "k": "Reading a territory", "status": "research", "use": "Reading the territorial distribution of care practices. It locates in urban space the practices analysed through the Care Matrix, making observable concentrations, gaps, prevailing models and possible intermediary actors capable of connecting initiatives and services.", "gen": "In BUILD, it helps to locate a proposal within the existing territorial system: which services and resources are already present, which relationships can be activated, where overlaps occur and which gaps remain.", "coll": "", "miss": "The map depends on the documented practices and may leave out informal or less visible initiatives. Spatial distribution does not, on its own, show the power relations, conflicts and conditions of access that characterise the practices represented.", "dm": ["SITUATE", "BUILD", "EVALUATE"], "refs": [], "refsIntro": ""}, {"code": "TOOL-03", "n": "Urban Food Conflict Map", "k": "Reading conflicts", "status": "research", "use": "Making urban food conflicts legible. Through the Participatory Urban Conflict Mapping (PUCM) protocol, it maps in a participatory way explicit and latent conflicts, the actors involved, divergent interests and the conditions that contribute to generating or maintaining them.", "gen": "", "coll": "Mapping is conceived as a participatory process, not only as a representation of the territory. The maps can become resources for sharing interpretations, formulating claims and supporting collective action.", "miss": "It cannot automatically represent conflicts that are not recognised or named, nor the perspectives of those who do not take part in the mapping. Making actors, experiences and tensions visible can also expose vulnerable people and groups: the conditions of participation and of reporting back therefore require attention.", "dm": ["SURFACE", "EVALUATE"], "refs": [], "refsIntro": ""}, {"code": "TOOL-04", "n": "Guided diary", "k": "Documenting the field", "status": "adapted", "use": "Documenting fieldwork experience through a guide structured around the principles of care, combining the recording of situations and practices with a reflection on one's own position and involvement.", "gen": "It can also be used as a cultural probe, inviting different actors involved in the project — for example care-receivers and care-givers, operators and organisations — to document experiences, perceptions and everyday practices. The traces collected can bring out meanings, needs and tensions that are difficult to detect through other tools, offering materials to be discussed and compared collectively.", "coll": "", "miss": "The notes convey situated and partial points of view, influenced by the position of whoever keeps the diary and by the conditions in which they do so. The experiences documented are not necessarily representative of those of other actors and must be interpreted and compared with other sources. The use of the diary as a cultural probe kept by several actors is a possibility to be tested, not a mode validated by the research.", "dm": ["SITUATE", "EVALUATE"], "refs": [], "refsIntro": ""}, {"code": "TOOL-05", "n": "Interdependence map", "k": "Setting up the collaboration", "status": "proposal", "use": "Building a first representation of the people, organisations, institutions, places, resources and more-than-human actors on which a food welfare situation depends. The map helps to question the relations between these elements, mutual dependencies, power asymmetries and the actors or conditions that risk remaining excluded from the reading of the system.", "gen": "The map can be built and revised together with the actors involved in the project, bringing out less visible dependencies, shared resources, power relations and subjects absent from decision-making processes. It can also orient the choice of situations to be explored further and of the questions to be brought into the subsequent phases of research and design.", "coll": "", "miss": "The map conveys a situated and provisional representation of the system: it does not automatically make all relationships visible, nor does it, on its own, convey the quality of dependencies or the inequalities and conflicts that run through them. If built collectively, it does not in itself guarantee equitable participation: the conditions under which the map is produced and the power differences between participants must be considered explicitly. The combination of the three references is a methodological proposal to be developed and tested.", "dm": ["FRAME"], "refsIntro": "The map can be developed by bringing three complementary approaches into dialogue:", "refs": ["Stakeholder mapping and stakeholder analysis, to identify the actors involved, their interests, their capacity for influence and their access to decision-making processes. In food welfare, this reading must also be extended to those who bear the consequences of decisions without taking part in them, avoiding reducing relationships to categories of power or interest.", "Actor-Network Theory and relational mapping, to explore the dependencies between human and more-than-human actors, organisations, infrastructures and material resources that make care practices possible. This reference makes it possible to read welfare as a network of relationships and interdependencies, without presuming that such relationships are necessarily symmetrical.", "Participatory systems mapping, to build and discuss a shared representation of the relationships, constraints and dynamics that structure the system. From this perspective, the map can become not only a tool for preliminary analysis, but also a device for dialogue between actors with different experiences and positions."]}], "roles": [{"n": "Embedded Collaborator", "when": "When working within or alongside organisations, services and communities already engaged in food welfare, to understand their practices, recognise their resources and contribute to transforming how they function. This may involve, for example, revising the organisation of a distribution service, strengthening a territorial network or rethinking the relationships between care-givers and care-receivers.", "does": "It works from situated knowledges and existing relationships, supporting processes of mutual learning and capacity building. In food welfare, this means understanding not only how a service works, but also which idea of need, access and responsibility it embodies; which care practices it sustains; and which activities or relationships it risks making invisible. The collaboration aims to transform practices from within, without assuming that what exists must necessarily be preserved.", "risk": ["Adopting the organisation's point of view and reproducing its priorities, without questioning the institutional conditions and asymmetries that structure the service.", "Listening mainly to those who manage or provide the service, leaving in the background the experiences and claims of care-receivers.", "Protecting the collaborative relationship by avoiding the conflicts needed to challenge discriminatory practices, unfair access or unrecognised responsibilities."], "ref": "Light & Akama (2014); Corubolo & Meroni (2024)", "code": "ROLE-01", "dm": ["SITUATE", "BUILD", "EVALUATE"]}, {"n": "Agonistic Mediator", "when": "When the transformation of food welfare involves actors with different interests, resources and responsibilities: public institutions, third-sector organisations, mutual aid networks, operators and people who use the services. It is particularly relevant when there are disagreements about who should be accountable for access to food, how to distribute resources and work, or which needs should orient decisions.", "does": "It makes visible and understandable the conflicts that run through food welfare, creating conditions for them to be expressed, documented and negotiated without being prematurely reduced to consensus. Its task is not to neutralise divergences, but to help make the responsibilities, priorities and choices that organise care open to discussion. It can support the production of evidence from the experiences of those with less decision-making power, and make explicit who is responsible for the issues that the design process cannot resolve on its own.", "risk": ["Presenting as neutral positions and procedures that reflect unequal power relations.", "Reducing participation to a tool of pacification, avoiding conflicts concerning rights, resources and public responsibilities.", "Speaking on behalf of the people and groups involved, substituting for their capacity to formulate claims and influence decisions."], "ref": "Mouffe (2013); DiSalvo (2012); Björgvinsson, Ehn & Hillgren (2012a)", "code": "ROLE-02", "dm": ["SURFACE", "ACTIVATE"]}, {"n": "Provocateur / Scenario Builder", "when": "When the assumptions that organise food welfare narrow the field of imaginable solutions. For example, when tackling food poverty is associated mainly with the distribution of surplus; when access to food is conditional on the classification of beneficiaries; or when existing services are considered the only possible response, rather than a historical and political configuration open to transformation.", "does": "It challenges dominant representations of food poverty, of assistance and of welfare recipients, making alternatives explorable through scenarios, narratives, prototypes and speculative proposals. It can contribute to imagining forms of welfare that recognise people as rights-holders and as subjects capable of influencing decisions, or that redistribute responsibilities differently among public institutions, communities and care networks. Design provocation does not stop at imagining an alternative: it also questions its material, organisational and political implications.", "risk": ["Producing abstract scenarios, disconnected from the resources, infrastructures and political conditions needed to realise them.", "Using experiences of food poverty to fuel provocations or narratives without the people involved having chosen how to be represented."], "ref": "DiSalvo (2012)", "code": "ROLE-03", "dm": ["ACTIVATE"]}], "limits": [["Power cannot always be designed", "Participation does not automatically redistribute power. Declare who decides, and what remains off the table."], ["Visibility can produce conflict", "Making a conflict visible can expose actors and create new vulnerabilities. Those who are at risk decide."], ["Participation does not guarantee agency", "A channel for voice before a role: who decides what, not only who does what."], ["Building an alternative does not guarantee transformation", "A new service can improve provision without changing the relationships that produce the need."], ["Institutionalisation can stabilise and depoliticise care", "What should be institutionalised, by whom, with what rules, and what must remain autonomous."], ["Care can become another demand", "Taking part can transfer further work onto people who are already overburdened. Recognise it and compensate for it."], ["Not everything is a design problem", "Some problems require political decisions, resources, laws or mobilisation. Knowing when not to design is part of Care(full) Design."]], "start": [["Starting a project or entering a new organisation, network or territory", "FRAME", "Interdependence map"], ["Analysing an existing practice to identify critical issues and possibilities of intervention", "SITUATE", "Care Matrix"], ["Exploring a territory, system or food welfare network not yet known", "SITUATE", "Care Spot Map, guided diary"], ["Surfacing needs, experiences or conflicts that are not adequately recognised", "SURFACE", "Urban Food Conflict Map"], ["Presence of subjects/agents with needs or claims who have limited possibilities of influencing decisions", "ACTIVATE", "Repertoire, Atlas, scenarios"], ["Need to design or reconfigure a service, a space or a rule", "BUILD", "Solution characteristics, Care Matrix in generative use"], ["Assessing the effects of an intervention and identifying any critical issues to be addressed", "EVALUATE", "Care Matrix (re-reading), maps"]], "atlasNote": "These cases were not designed with Care(full) Design. They show one of the ways in which this kind of work can take shape, in the process or in the solution.", "manifesto": [{"t": "Rethinking food welfare as part of the transformation of food systems", "b": true}, {"t": "Food is a vital necessity, an everyday practice, a social relationship and a political question. The right to adequate food is recognised internationally, and yet millions of people, in our cities too, are unable to access it regularly (FAO et al., 2025). Moreover, rising food prices often do not translate into fairer conditions for those who produce food, process it and bring it to the table.", "b": false}, {"t": "Food welfare intervenes in this contradiction. It can also become one of the places from which to rethink the social, material and ecological conditions through which food is produced, distributed, prepared and shared.", "b": false}, {"t": "Care(full) Design invites those who design in this field to broaden their horizon.", "b": false}, {"t": "Beyond techno-solutionism. Food inequalities are not resolved by more efficient tools, more accessible platforms or better-organised logistics if the conditions that produce them remain unchanged.", "b": false}, {"t": "Beyond the idea that surplus recovery can, on its own, reconcile waste and poverty. Recovery can be part of the response. When it is presented as a solution in which everyone wins, however, it risks leaving the causes of waste and food insecurity unnamed, and replacing the right with what is left over.", "b": false}, {"t": "Beyond the idea that collective care concerns only public institutions and the third sector. Care runs through the entire food chain: it involves labour, resources and responsibilities that are often invisible, undervalued or unequally distributed, and that fall above all on volunteers and communities. Recognising this does not reduce the responsibility of those who have the duty to guarantee the right to food: it makes it more precise.", "b": false}, {"t": "Beyond the idea that conflict is an obstacle to be removed. Tensions around food signal where rights, resources and responsibilities are unequally distributed. Making them visible and negotiable, instead of translating them into technical questions, is part of the design work.", "b": false}, {"t": "Beyond the separation between food welfare and urban food environments. A distribution service organises access, steers choices, defines relationships and establishes which experience of food is possible. The same holds for canteens, markets, places and policies through which food enters the everyday life of cities.", "b": false}, {"t": "Designing these devices means questioning the dignity of people, their possibility to choose, the cultural adequacy of food, the social dimension of meals and the conditions of labour and care that make them possible. It means asking who benefits from the solutions designed and who bears their costs, which needs are recognised and which remain invisible. It means asking who decides how care is organised, and whether those who receive it can take part in that decision and claim what they are entitled to. It means remembering that food depends on soils, waters, species and territories, which also bear the costs of the choices we make.", "b": false}, {"t": "What if the transformation of food systems could also start from the places where the system shows its deepest inequalities?", "b": true}, {"t": "From distribution services, canteens, places of food access, the infrastructures of urban welfare. To improve the response to existing needs, and to experiment with other forms of organisation, other policies, other food environments and other ways of sharing responsibilities.", "b": false}, {"t": "We do not imagine a future in which food welfare ceases to be necessary by decree, nor do we deny the urgency of immediate responses for those who experience food insecurity. We ask how to design responses that do not consolidate the separation between those who can choose and those who must make do, between those who take part in the food life of the community and those who receive what is left over.", "b": false}, {"t": "We imagine a food welfare that contributes to transforming the system, as well as compensating for its inequalities. Food systems in which access to adequate food does not depend on the ability to pay its price, and in which social justice is not pursued at the expense of ecological justice, nor vice versa. A horizon that holds together those who need to access food and those who produce, distribute, prepare and care for it.", "b": false}, {"t": "This is the horizon of Care(full) Design: designing to respond to food needs and to contribute to transforming, together with the people who experience them, the conditions that produce them and the relationships through which we can collectively take care of them, treating food that is nutritionally, culturally and sustainably adequate as a right to be made effective together.", "b": true}], "status": {"research": "Developed and tested in the research", "cases": "Derived from case analysis", "adapted": "Adapted from existing methods", "proposal": "Proposal to be tested", "partial": "Partly tested in the research"}, "promise": "It does not prescribe a single method, nor does it offer predefined solutions: it proposes resources for critically questioning existing practices and imagining alternatives. Using Care(full) Design does not, in itself, guarantee just outcomes; it requires continuously assessing how design choices redistribute resources, power and responsibilities, and what consequences they produce for people, communities and ecosystems.", "distinct": "Care(full) Design orients design decisions by relating care, rights, conflicts and the distribution of responsibilities. It connects this perspective to an empirical repertoire of documented practices, to help interpret existing conditions critically, question the implications of choices and identify possible directions of transformation towards eco-social justice.", "registers": [["Manifesto", "It declares the normative and political horizon of Care(full) Design. It can be assertive: it states what is desirable."], ["Thesis", "It argues how that horizon was built: with which references, which data, which limits."], ["Guide", "It translates some of the research findings into usable orientations, tools and questions, declaring the status of each."]], "glossary": [["Design move", "A type of design work, in Schön's (1983) sense: a move made in conversation with the situation. The six design moves (FRAME, SITUATE, SURFACE, ACTIVATE, BUILD, EVALUATE + REPAIR) can be used on their own, combined or chained."], ["Space of reading · space of making", "SITUATE and SURFACE read the context (R); ACTIVATE and BUILD develop proposals and arrangements (D); EVALUATE + REPAIR assesses after the intervention (E)."], ["Participatory design · co-design", "In participatory design, people take part in one or more design moves. In co-design, the same people take part from beginning to end: this is a rare condition, which requires time, resources and a mandate."], ["Care-receivers / care-givers", "Tronto (1993): relational positions, not identities."], ["Rights-holders / duty-bearers", "Those who hold a right and those who have the duty to guarantee it."], ["More-than-human", "Puig de la Bellacasa (2017): soils, waters, species and territories that take part in relations of care."], ["Depth of care", "How many dimensions of care a practice enacts at the highest level (Emergent, Enabling, Transformative)."], ["Rights-Enacting", "Whether a practice uses the language of rights, addresses claims to those who have the duty to respond, and involves care-receivers as political subjects."], ["Reading alerts", "Interpretive signals (care-washing, invisibilisation of conflict, amplification of distances, decontextualisation). They are readings made with the framework, supported by evidence indicated in the card, not established facts."]], "logic": [["Principles", "They orient decisions", "They define the perspectives through which to question food welfare and the normative horizon towards which to orient the project."], ["Tools", "They support analysis and reflection", "They help to collect, organise and interpret information on practices, territories, conflicts and experiences, at different scales."], ["Design moves", "They organise design work", "They identify the modes of work relevant to different situations: framing a question, analysing relations of care, surfacing conflicts, activating subjects, developing interventions, assessing their effects and repairing their critical issues."], ["Design roles", "They make the design positioning explicit", "They help to clarify from which position the designer operates, which responsibilities they take on and how they relate to the other actors involved."], ["Repertoire and Atlas", "They broaden the possibilities of intervention", "They make available documented practices from which to draw indications, mechanisms and design possibilities, also considering the limits and conditions of their transfer to other contexts."]], "readingRule": "Reading a practice or a system through the lens of the ethics of care can help to formulate design questions, recognise tensions and identify possible directions of inquiry, which must be assessed in the light of the material, institutional and political conditions of the context. A critical issue that emerges from the Care Matrix does not, on its own, identify either the priority of intervention or the possibility of acting. Design choices require considering existing constraints, available resources, conflicting objectives and the distribution of responsibilities, distinguishing what design can affect from what requires decisions or interventions by other actors.", "p3levels": [["Principle", "Care is a collective responsibility, to be distributed and sustained over time, beyond the logic of individual charity."], ["What it implies for the solution", "The continuity of the service should not depend exclusively on voluntary work, especially when this lacks recognition, resources and adequate conditions."], ["What to do in the process", "Reconstruct with the people involved how tasks and responsibilities are distributed, which resources sustain them and which conditions are necessary to guarantee the continuity of the service."], ["What to observe in practice", "Observe who performs care work, how it is recognised and which resources sustain its continuity, using the “Care work” block of the Care Matrix."]], "components": [["Grammar P1–P9", "Ethics of care (Tronto, Kittay, Puig de la Bellacasa, Collins, The Care Collective); claims-making (Fraser); agonism (Mouffe)", "Semi-systematic literature review; refined through application to the corpora", "Applied to 116 cases", "It allows practices and proposals to be questioned. It is neither a scale of value nor a measure of impact."], ["Care Matrix", "Grammar P1–P9; Framework Analysis", "Built and revised by applying it to the Atlas and to the Rio and Milan cases; coded by a single researcher", "Tested in analytical use; generative use not tested", "It reads the care documented in a practice. It does not measure the impact on the system and depends on the available sources."], ["Care Spot Map", "Counter-cartography", "Arose from a limit that emerged during the course at PUC-Rio; built for Rio and Milan", "Tested in two cities", "It shows where and how presences of care are distributed. It does not show the relations between practices or the conflicts."], ["Urban Food Conflict Map (PUCM)", "Conflict theories; participatory mapping; agonism", "Workshops in Milan and Rio; protocol adapted to latent conflict", "Tested in research and teaching contexts, not in an ongoing cycle", "It makes manifest and latent tensions legible. It does not redistribute power; the sources are often from one side only."], ["Guided Diary", "Autoethnography", "Used by the researcher in Rio and Milan", "Adapted", "It conveys situated experience. It is not generalisable and requires time from those who write it."], ["Interdependence map", "P8, P3", "None", "Proposal to be tested", "It serves to start the reading in FRAME. It does not replace SITUATE."], ["FRAME", "Participatory design; positionality; grammar (P1, P2, P3, P6, P8)", "Derived from fieldwork experience", "Proposal to be tested", "It sets up the work and the choice of role; its effect has not been observed."], ["SITUATE · SURFACE", "Grammar; reading tools", "They correspond to the activities carried out in the research", "Tested directly", "They produce readings and questions, not solutions."], ["ACTIVATE · BUILD", "Agonistic participatory design; design-oriented scenarios", "Workshops, PUC-Rio course, Atlas practices", "Partly tested", "They orient the production of scenarios and arrangements; no complete intervention has been carried out."], ["EVALUATE + REPAIR", "Repair as an activity of care (Fisher & Tronto)", "Re-readings with the Care Matrix", "Tested in analytical form", "A complete cycle with the same actors over time has not been observed."], ["Design roles", "Light & Akama; agonistic participatory design; scenarios", "Only indirect evidence (position of design in the Atlas practices)", "Theoretical proposal", "They help to declare one's own position. They are not derived from the data."], ["Transformation families", "Empirically built typologies", "55 food cases; assignment by prevailing mechanism", "A–E consolidated; F–H emerging", "They allow mechanisms to be compared. They are not a universal taxonomy; their validity outside the corpus has not been verified."], ["Pathways, conflict clusters, actor configurations", "Distinction between manifest and latent conflict", "Pathways: 55 cases; clusters and actors: 35 cases documented in depth", "Derived from the cases; open repertoire", "They indicate tendencies in the corpus, on small numbers. The cases that do not fit them mark their limits."], ["Atlas", "Inclusion criteria: at least four principles at Moderate level or above; maximum variation", "116 cases from secondary sources and fieldwork, with confidence levels", "Non-representative corpus, skewed towards Europe", "It offers mechanisms and caveats. It is not a catalogue of good practices to be replicated."]], "processIntro": ["In Care(full) Design, care works on two registers. It is an object of design: welfare services, programmes and policies are read as infrastructures of collective care, which distribute responsibilities and make rights effective, or fail to. And it is a practice of design: the way in which the process unfolds, who listens, who takes part, who decides, who carries the burden of the work. The meeting point is caring with (Tronto, 2013): care is just when those who receive it take part in deciding how it is organised.", "The process is addressed to those who design, with meso-level actors (organisations, institutions, networks, intermediaries), urban food welfare services, spaces, programmes, infrastructures or policies. It is a set of six design moves, in Schön's (1983) sense: moves made in a reflective conversation with the situation, observing what the situation gives back before deciding on the next move. They can be used individually, combined or chained, in a way of working close to the bricolage of many participatory design processes (Louridas, 1999).", "The process as a whole is conceived as co-design, with the same people from the definition of the problem to evaluation (Sanders & Stappers, 2008). When this is not possible, the individual design moves propose participatory design approaches: participatory mapping of conflicts, ideation and scenario workshops, participatory evaluation.", "The relations between the design moves do not define a rigid sequence; they identify some conditions that orient their activation. ACTIVATE and BUILD benefit from a preliminary phase of reading the context; BUILD also requires a practice, a proposal or a configuration to be developed, while EVALUATE + REPAIR presupposes an intervention on which to reflect critically and act. The path can start from an existing practice, a territory or a conflict, depending on the conditions and questions from which the design process starts."], "across": ["One question orients all the design moves: who can act, decide and claim their rights, and who sustains the work of care, in its human and more-than-human dimensions? The research findings show how these dimensions risk remaining at the margins of processes. In Milan, for example, shared design mainly involves those who organise care, while the work needed to sustain it is not explicitly recognised in 21 of the 22 practices analysed.", "<b>From the temporary to the permanent.<\/b> In the Atlas, practices linked to funded programmes and projects show the lowest levels of depth of care and no fully Rights-Enacting case. A participatory process confined to the duration of a project can generate initiative and engagement without guaranteeing their continuity. For this reason, BUILD and EVALUATE + REPAIR invite us to ask what will remain once the funding runs out: which relationships, resources and responsibilities will be able to continue, who will take charge of them, and which institutional conditions will sustain their continuity?"], "paths": ["The design moves do not define a single path. Depending on the context, the issues at stake and the starting conditions, the process can activate readings, actions and moments of revision in different orders. The two trajectories below, developed from the comparison between Milan and Rio de Janeiro, illustrate some of these possibilities. They are exploratory scenarios, not interventions that have been carried out.", "<b>Milan — From practice to system.<\/b> The process can start from an existing practice, through SITUATE, to understand its actors, relationships and operating conditions. The analysis may bring out issues that the single practice cannot address on its own, such as the limited political involvement of care-receivers or dependence on food surplus. These critical issues point towards SURFACE, to investigate the systemic conditions that produce them, and then towards ACTIVATE, to explore the possibilities of broadening the participation and the capacity for intervention of the people involved.", "<b>Rio de Janeiro — From claims to action.<\/b> When claims are already articulated and run through institutions, the process may require an initial, more circumscribed reading phase, and then focus on ACTIVATE and BUILD: creating the conditions for translating existing demands into capacity for action and concrete configurations. The subsequent evaluation may reopen SURFACE, should limits emerge in the effective participation of care-receivers. In this trajectory, design is not called upon to formulate claims on behalf of the actors, but to question the conditions that make their realisation possible — or limit it."], "familiesHow": [["Unit of analysis", "La pratica, letta attraverso la sua funzione nel sistema alimentare e il meccanismo di trasformazione che la caratterizza."], ["Assignment criterion", "Il meccanismo di design più sostenuto dalle evidenze disponibili, incrociato con la posizione nella filiera e con l'oggetto della rivendicazione."], ["More than one family", "Sì. Ogni pratica ha una famiglia principale; 47 dei 55 casi food ne hanno anche una secondaria e 17 una terza. Le affiliazioni secondarie servono a vedere quali meccanismi attraversano le famiglie."], ["Robustness", "A–E raccolgono sei casi o più, in gran parte documentati in profondità. F, G e H sono emergenti: pochi casi, in maggioranza documentati con meno fonti."], ["What is lost", "Una pratica complessa ridotta al suo meccanismo prevalente perde le sue combinazioni. Per questo la scheda di ogni pratica riporta anche le famiglie secondarie e i limiti."]], "examples": [{"title": "Milan · Refettorio Ambrosiano", "cases": ["MI-16"], "conv": "A service design reading would look above all at the guests' experience and the quality of the place, which are already high.", "change": "The reading with the grammar confirms the strength of the practice on contextual sensitivity, but shows four gaps: guests' self-determination, the access threshold, political voice, dependence on surplus. Placed within the system, part of these gaps concerns the Caritas and social services network. The question shifts from “how to improve the dinner” to “which link is missing between the Refettorio and the network, and who decides on access”.", "open": "The Care Matrix reads what is documented; some assessments are debatable (for example P7). The scenarios are hypothetical and are not recommendations to the organisation."}, {"title": "Rio de Janeiro · Quilombo Cafundá Astrogilda", "cases": ["RIO-16"], "conv": "A conventional reading would see an environmental conflict between a park and its residents.", "change": "The reading with the Conflict Map shows it as a conflict between conservation and care of the territory, which the existing clusters do not cover well. The repertoire points to Horto Natureza, where evidence produced by the community turned an accusation into a claim. A risk also emerges: making the roças visible means making a prohibited practice visible.", "open": "The institutional parties to the conflict are still to be verified. Land titling and park regulation remain beyond the reach of design."}], "research": ["Le Guidelines sono una sintesi operativa della tesi di dottorato <i>Care(full) Design: Enabling Eco-Social Transitions in Urban Food Welfare through Design Informed by Care Ethics<\/i> (Laura Cipriani, Dottorato in Design, Politecnico di Milano, 2026; supervisore Prof. Stefano Maffei).", "<b>Base empirica.<\/b> Due revisioni semi-sistematiche della letteratura; l'Atlas of Care(full) Practices (55 casi di welfare alimentare, 17 di altri ambiti del welfare); un caso studio comparativo su Rio de Janeiro e Milano (44 pratiche urbane lette con la Care Matrix, Urban Food Conflict Map e Care Spot Map, dodici diari di campo, quattro interviste, un panel istituzionale); un corso alla PUC-Rio.", "<b>Criteri dell'Atlas.<\/b> Pratiche con almeno quattro principi a livello Moderate o superiore, scelte per massima variazione. L'Atlas si basa in gran parte su fonti secondarie, con livelli di confidenza dichiarati, e non è un campione rappresentativo.", "<b>Limiti.<\/b> Nessun caso ha attraversato tutte le design moves con gli stessi attori nel tempo. SITUATE e SURFACE sono state sperimentate direttamente; ACTIVATE, BUILD ed EVALUATE + REPAIR in parte; FRAME e i ruoli di design sono proposte. La codifica con la Care Matrix è stata condotta da una sola ricercatrice. La dimensione ecologica (P7) non è stata indagata sul campo con un protocollo dedicato."], "sec1": {"offre_h": "What this guide offers", "offre": ["Care(full) Design is addressed to designers and practitioners who work with the intermediate actors of urban food systems (services, organisations, networks and institutions) and who are engaged in designing or transforming food welfare services, programmes and policies.", "The guide takes the urban scale as its field of intervention: a scale at which needs, resources, responsibilities and relationships meet, and at which it is possible to act on the infrastructures that organise access to food, without losing sight of the wider social and ecological dynamics on which they depend.", "Through guiding questions, tools for analysis and design, examples and references to practices documented in the Atlas, the guide helps to recognise the dimensions of care and the conflicts that run through food welfare, to explore possibilities of transformation and to orient design decisions towards a horizon of eco-social justice."], "promessa": "It does not prescribe a single method, nor does it offer predefined solutions: it proposes resources for critically questioning existing practices and imagining alternatives. Using Care(full) Design does not, in itself, guarantee just outcomes; it requires continuously assessing how design choices redistribute resources, power and responsibilities, and what consequences they produce for people, communities and ecosystems.", "introduce_h": "What Care(full) Design introduces", "distingue": "Care(full) Design orients design decisions by relating care, rights, conflicts and the distribution of responsibilities. It connects this perspective to an empirical repertoire of documented practices, to help interpret existing conditions critically, question the implications of choices and identify possible directions of transformation towards eco-social justice.", "registri_h": "Manifesto, research and tools for design", "registri0": "The platform brings together three contributions to Care(full) Design. Each answers a different question: which horizon to pursue, on what foundations it rests, and how it can orient design practice?", "registri": [["Manifesto", "It declares the political and normative horizon of Care(full) Design: it states the principles and the directions of transformation to strive towards."], ["Thesis", "It argues how this horizon was developed, making explicit its theoretical references, the research process, the empirical evidence and the limits."], ["Guide", "It translates some of the research findings into orientations, tools and questions for design practice, clarifying their possible uses and their limits."]], "risorse_h": "The resources of the guide", "materiali": [["Principles", "The perspectives through which to read food welfare critically and orient design decisions."], ["Design moves", "The modes of design intervention that can be activated depending on the situation. They can be used individually or in combination."], ["Design roles", "The different positions that designers can take, in relation to the actors involved, the responsibilities and the possibilities of intervention."], ["Tools", "Devices for collecting, organising, interpreting and discussing information useful to the design process."], ["Guiding questions", "Questions to support individual and collective reflection, challenge initial assumptions and explore the implications of choices."], ["Examples", "Illustrative situations that show how to use the approach to read problems and possibilities of intervention, without providing solutions to be replicated automatically."], ["Atlas", "A repertoire of documented practices from which to draw indications, mechanisms, possibilities and critical issues useful for orienting design."]], "statuto_h": "Where the resources of the guide come from", "statuto0": "The tools, design moves and roles presented in the guide do not all have the same origin. Some derive directly from the research; others are a design reworking of it or a proposal developed from its findings. The labels associated with each content make its provenance and level of development explicit, helping to understand its foundations and to assess its usefulness in relation to the context in which one works.", "statuto": [["Developed and tested in the research", "Developed and used directly in the research process, in the corpora analysed and in the contexts of Milan and Rio de Janeiro."], ["Partly tested in the research", "Some components were used in research activities, workshops, teaching activities or re-readings of the cases. The functioning of the whole has not been fully tested."], ["Derived from case analysis", "Derived from the analysis of the practices documented in the Atlas. It describes elements that emerged from the analysis, without implying that they have been tested as design tools"], ["Adapted from existing methods", "Derived from an existing method, modified to respond to the aims and context of the research."], ["Proposal to be tested", "Developed from the research or its implications, but not yet tested in practice."]], "start_h": "Finding your way in the design process"}, "sec2": {"intro": "Care(full) Design brings together elements with distinct and complementary functions. Understanding their role helps to find one's way among the available resources and to choose how to use them in relation to the context and the questions addressed.", "logic": [["Principles", "They orient decisions", "They define the perspectives through which to question food welfare and the normative horizon towards which to orient the project."], ["Tools", "They support analysis and reflection", "They help to collect, organise and interpret information on practices, territories, conflicts and experiences, at different scales."], ["Design moves", "They organise design work", "They identify the modes of work relevant to different situations: framing a question, analysing relations of care, surfacing conflicts, activating subjects, developing interventions, assessing their effects and repairing their critical issues."], ["Design roles", "They make the design positioning explicit", "They help to clarify from which position the designer operates, which responsibilities they take on and how they relate to the other actors involved."], ["Repertoire and Atlas", "They broaden the possibilities of intervention", "They make available documented practices from which to draw indications, mechanisms and design possibilities, also considering the limits and conditions of their transfer to other contexts."]], "regola_h": "From reading to intervention", "regola": ["Reading a practice or a system through the lens of the ethics of care can help to formulate design questions, recognise tensions and identify possible directions of inquiry, which must be assessed in the light of the material, institutional and political conditions of the context.", "A critical issue that emerges from the Care Matrix does not, on its own, identify either the priority of intervention or the possibility of acting. Design choices require considering existing constraints, available resources, conflicting objectives and the distribution of responsibilities, distinguishing what design can affect from what requires decisions or interventions by other actors."], "passaggio": "Design directions are defined through dialogue with the people involved, in the spaces of discussion and negotiation that ACTIVATE aims to build. The tools support analysis by formulating questions, while the repertoire offers practices and experiences to be discussed critically, not solutions to be applied.", "p3_h": "From the same principle to design choices", "p3_0": "An example of how the principle of collective responsibility orients design, from decisions on solutions to analysis and evaluation activities.", "p3": [["Principle", "Care is a collective responsibility, to be distributed and sustained over time, beyond the logic of individual charity."], ["What it implies for the solution", "The continuity of the service should not depend exclusively on voluntary work, especially when this lacks recognition, resources and adequate conditions."], ["What to do in the process", "Reconstruct with the people involved how tasks and responsibilities are distributed, which resources sustain them and which conditions are necessary to guarantee the continuity of the service."], ["What to observe in practice", "Observe who performs care work, how it is recognised and which resources sustain its continuity, using the “Care work” block of the Care Matrix."]]}, "sec3intro": "The nine principles provide the lenses through which to examine existing situations and assess design proposals. For each principle, the guide presents its underlying concept, the characteristics of a Care(full) Design solution, and the corresponding operational principle. It also offers questions to guide research and design, alongside an example from the Atlas illustrating how the principle may inform practice.", "sec4uso": "Each design move is articulated according to a common structure, which clarifies its function and the specific contribution of the care lens, its conditions of application and the possible actions. The presentation includes: the guiding questions derived from the grammar of care; the possible outcomes; the tools that can be used, the most relevant design role and illustrative cases drawn from the Atlas; finally, the limits and the possibilities of reopening or reorienting the process.", "diagramNote": "The diagram illustrates one possible articulation of the process and the main dependencies between the design moves. ACTIVATE and BUILD can be oriented by the readings of the context; BUILD requires a practice, a proposal or a configuration to be developed, while EVALUATE + REPAIR presupposes an intervention to be submitted to evaluation and revision. The relations are bidirectional: evaluation can reopen the readings, orient new actions or prompt a reformulation of FRAME. The diagram therefore does not prescribe a linear sequence; it describes an adaptive process, in which the design moves can be activated at different moments, taken up again recursively or combined according to the context and the needs that emerge.", "vol5": ["The roles describe three positions that designers can take in contributing to the transformation of food welfare systems. They do not identify exclusive professions or competences, nor do they define a work sequence: they are design positions to be taken in relation to the context, the actors involved and the type of transformation pursued.", "In food welfare, designing means engaging with existing assistance practices, asymmetrical relationships between those who organise and those who receive support, public and collective responsibilities, and different conceptions of what constitutes just access to food. The three roles help to make explicit how designers position themselves with respect to these conditions: working from within practices, making conflicts and responsibilities negotiable, or challenging the assumptions that delimit the alternatives that can be imagined.", "This is a theoretical proposal to be tested. The research found indirect evidence of it in the positions that design takes in the practices documented in the Atlas, but it did not empirically verify the three roles as distinct configurations. The roles therefore serve to make the design position explicit and open to discussion, not to classify designers. The initial position is declared in FRAME and may change during the process."], "vol6": "Each tool has a purpose, a status and limits. It does not provide prescriptive indications, nor does it determine, on its own, what to do: it produces readings of the situation to be interpreted and discussed in the light of the context, the experiences involved and the aims of transforming food welfare (section 2).", "hide": {"glossary": true, "components": true}, "outputLabel": "Possible outcomes", "rep": {"intro": ["The 55 food practices collected in the Atlas form a repertoire of experiences through which to explore different ways of transforming food welfare. The eight families group the practices according to their prevailing transformation mechanism, relating experiences that address similar issues, even when they operate in different contexts.", "The repertoire can be consulted starting from an issue that emerged during research or design: an under-developed dimension of care, a conflict to be addressed, a power relation to be made visible or a responsibility to be reorganised. The family provides a first orientation for searching for relevant cases and for questioning what they made possible, the conditions on which they depend and the limits they present.", "The cases are not models to be replicated. They are experiences from which to draw hypotheses of transformation, to be discussed and tested in the context in which one is designing. Their interest lies not only in the solutions adopted, but also in the tensions they make visible: what changes, for whom, through which relationships and under what conditions?"], "how": [["Unit of analysis", "The practice, considered in relation to the function it performs in the food system and to the transformation mechanism that characterises it."], ["Assignment criterion", "Each practice has one primary family; 47 of the 55 food cases also have a secondary family and 17 a third. Secondary affiliations make it possible to recognise mechanisms that cut across several families and to read the combinations through which practices intervene in food welfare."], ["Robustness", "Families A–E each gather at least six cases and rest on a relatively larger number of practices. F, G and H are emerging families, with few cases and, in most instances, less extensive documentation. The distinction signals a different strength of evidence in the corpus, not a different design relevance."], ["What the repertoire offers", "The families help to identify relevant experiences, compare transformation mechanisms and formulate questions for one's own context. They do not indicate which solution to adopt, nor do they make it possible to predict its effects. For each practice, the Atlas card makes it possible to explore the case, its secondary families and the limits of its documentation."], ["What is lost", "The families are typologies built from the cases (Kluge, 2000), not a universal taxonomy. Their validity outside the corpus has not been verified; the Rio de Janeiro and Milan cases were assigned to the families a posteriori. The classification of these cases should therefore be considered an analytical proposal to be verified, not an independent confirmation of the structure of the repertoire."]], "steps_h": "From the problem to the case, from the case to a design question", "steps": [["Identify the issue.", "Start from a dimension of care, a conflict or a relationship that emerged in the previous phases."], ["Explore the relevant families.", "Look for the transformation mechanisms that address similar issues, without necessarily limiting yourself to a single family."], ["Question the cases.", "Examine which changes they produced or pursued, which actors and resources they involved, and which limits or tensions emerge from the documentation."], ["Reformulate the issue in your own context.", "Ask yourself which conditions would make a similar transformation possible, what would need to be changed and which unintended effects should be considered."]], "steps_end": "The result is not the selection of a model to be transferred, but the formulation of one or more design hypotheses to be developed and tested.", "mech": {"A": [{"t": "An informal occupation that becomes a recognised collective infrastructure", "ids": ["F-27", "F-18"]}, {"t": "Food sovereignty claims translated into means of production", "ids": ["F-07", "F-31"]}, {"t": "Cooperative reappropriation of the supply chain", "ids": ["F-26"]}, {"t": "Donated or public land turned into collectively governed infrastructure", "ids": ["F-10", "F-42"]}, {"t": "Food production as a pathway to autonomy", "ids": ["F-05", "F-12", "F-15", "F-49"]}], "B": [{"t": "Customary governance of land and food, independent of the State", "ids": ["F-09"]}, {"t": "Recovery of Indigenous food practices", "ids": ["F-23"]}, {"t": "Coordination among Indigenous communities across colonial borders", "ids": ["F-28"]}, {"t": "Co-production of biocultural knowledges", "ids": ["F-30"]}, {"t": "Access to land as reparation", "ids": ["F-21"]}, {"t": "Community governance of land", "ids": ["F-29", "F-45"]}], "C": [{"t": "Integrating food access into a municipal public system", "ids": ["F-14"]}, {"t": "Using public procurement as a lever for change", "ids": ["F-16"]}, {"t": "Making political commitment a condition for taking part", "ids": ["F-19"]}, {"t": "Participatory diagnosis and inquiry before intervention", "ids": ["F-19", "F-08", "F-47"]}, {"t": "Grassroots legislative proposals", "ids": ["F-34"]}, {"t": "Shared value commitments within a network", "ids": ["F-20", "F-53"]}], "D": [{"t": "Removing distinctions between recipients based on economic condition", "ids": ["F-01", "F-24", "F-25"]}, {"t": "The shared table as a device against stigma", "ids": ["F-38"]}, {"t": "Reversing the relationship between those who give and those who receive", "ids": ["F-17", "F-41"]}, {"t": "Integrating food into a broader welfare infrastructure", "ids": ["F-04"]}, {"t": "Combining distribution with political and civic education", "ids": ["F-25"]}, {"t": "Connecting redistribution and production", "ids": ["F-39"]}, {"t": "Technological infrastructures to coordinate redistribution", "ids": ["F-33", "F-40"], "note": "Limit: they leave the surplus model unchanged."}], "E": [{"t": "Care provided by those who share identity and experience with those who receive it", "ids": ["F-35"]}, {"t": "Collective memory and mutual aid as infrastructures of continuity", "ids": ["F-35"]}, {"t": "Sustaining community care through commercial activities", "ids": ["F-03"], "note": "Risk: care-washing."}, {"t": "Turning waste into a public convivial event", "ids": ["F-36"]}], "F": [{"t": "Design and research artefacts that make hidden resources or injustices visible", "ids": ["F-02", "F-13", "F-54"]}], "G": [{"t": "Cooperative ownership and risk-sharing between those who produce and those who consume", "ids": ["F-32", "F-52", "F-48"]}], "H": [{"t": "Culinary knowledge recognised as a skill and a route into work", "ids": ["F-50", "F-43", "F-06"]}]}, "other_h": "Pathways, conflict clusters, actor configurations", "other0": "The repertoire also includes seven innovation pathways, six conflict clusters and nine actor configurations. The pathways are derived from the 55 cases; the clusters and configurations from the 35 cases documented in depth. They indicate tendencies in the corpus, on small numbers; the cases that do not fit them mark their limits.", "comp": [["Transformation families", "Through which mechanisms can food welfare be transformed?", "Prevailing mechanism of the 55 food cases"], ["Innovation pathways", "How do transformations arise and develop?", "Origin and trajectory of the 55 cases; each case has one main pathway"], ["Conflict clusters", "Which tensions recur in the experiences analysed?", "35 cases documented in depth"], ["Actor configurations", "Who builds the practices, and through which relationships?", "35 cases documented in depth, according to who takes the initiative in founding and governance"]], "lists": [{"h": "Seven innovation pathways", "src": "(not mutually exclusive)", "items": [{"n": "Bottom-up institutionalisation.", "t": "An informal action gains recognition and structure.", "ids": ["F-27"]}, {"n": "Driven by participatory design.", "t": "Listening, co-design and co-governance with those involved; this is the pathway in which expert design is concentrated.", "ids": ["F-19"]}, {"n": "Transformation within institutions.", "t": "An existing service changes from within.", "ids": ["F-04"]}, {"n": "Enabled by a crisis.", "t": "A shock opens a window for new arrangements.", "ids": ["F-28"]}, {"n": "Driven by a claim.", "t": "A service arises as the material expression of a claim; this is the rights pathway (5 cases out of 6 fully Rights-Enacting).", "ids": ["F-34"]}, {"n": "From the biographical to the collective.", "t": "A personal experience of exclusion becomes a collective initiative.", "ids": ["F-29"]}, {"n": "Programme-induced.", "t": "A call for funding or a project defines its purpose, duration and partners; this is the pathway with the lowest care intensity.", "ids": ["F-54"]}]}, {"h": "Six conflict clusters", "src": "", "items": [{"n": "Stigma and everyday access.", "t": "Family D.", "ids": ["F-24"]}, {"n": "Land as a contested resource.", "t": "Family B.", "ids": ["F-09"]}, {"n": "Coloniality and food racism.", "t": "Families B, D and E.", "ids": ["F-23"]}, {"n": "Exploitation along the supply chain and invisibilised labour.", "t": "Family A.", "ids": ["F-26"]}, {"n": "Institutional fragmentation.", "t": "Family C.", "ids": ["F-16"]}, {"n": "Environmental extractivism.", "t": "No family addresses it as its main conflict; it remains a cross-cutting dimension.", "ids": ["F-09", "F-31"]}]}, {"h": "Nine actor configurations", "src": "(number of cases in brackets)", "items": [{"n": "Founder + organisation (8):", "t": "a personal experience becomes organisational construction.", "ids": []}, {"n": "Third-sector coalition (8):", "t": "initiative distributed among organisations.", "ids": []}, {"n": "Movement or crisis committee (4):", "t": "mobilisation in response to a threat.", "ids": []}, {"n": "University or action-research laboratory (4):", "t": "experimentation and absorption of risk.", "ids": []}, {"n": "Public institution initiating from above (3):", "t": "institutional activation.", "ids": []}, {"n": "Hybrid partnership (3):", "t": "initiative distributed across sectors.", "ids": []}, {"n": "Translation platform between grassroots and government (3):", "t": "translates practices into institutional forms.", "ids": ["F-19", "F-16"]}, {"n": "Cooperative as political infrastructure (1):", "t": "collective ownership and governance.", "ids": []}, {"n": "Informal grassroots collective (1):", "t": "community initiative without a reference organisation.", "ids": []}], "note": "Examples are given only where the thesis names the case."}]}, "ex0": "Two situations read with the framework during the research. For each, what is documented, what the framework adds to the reading and what remains open are kept distinct. The scenarios are hypothetical and are not recommendations to the organisations involved.", "lim0": "Design cannot do everything. These limits concern every design move and should be kept in mind from the beginning, not at the end.", "res": {"intro": "The guide originates from doctoral research (Politecnico di Milano) that combined a literature review, the analysis of an Atlas of 116 practices and two case studies of urban food welfare, in Rio de Janeiro and Milan.", "blocks": [{"h": "The Atlas", "items": ["116 practices: 55 food welfare practices in different countries, 17 from other fields of care (cross-domain), 22 in Rio de Janeiro, 22 in Milan.", "Inclusion criteria for the food practices: practices that enact at least four principles at Moderate level or above; maximum variation sampling (Patton) by type of actor, scale, position in the supply chain and context.", "Sources: fieldwork, academic literature, organisational documents, press. Each case has a source confidence level; the evidential weight is not the same.", "The corpus is not representative and is skewed towards Europe (28 food cases out of 55). Comparing practices from different political contexts serves to see mechanisms, not to transfer models."]}, {"h": "How to read the cards", "items": ["The description reports what is documented.", "The assessments (depth of care, Rights-Enacting) are readings made with the Care Matrix, coded by a single researcher on the basis of the available sources.", "The alerts are interpretations: each is accompanied by the evidence on which it is based and can be discussed."]}, {"h": "Limits", "items": ["Coding by a single researcher: the assessments are reasoned interpretations, not measurements.", "Small numbers: comparisons indicate tendencies in the corpus, not causal relationships.", "The process as a whole has not been tested with the same actors over time. SITUATE and SURFACE were tested directly; ACTIVATE, BUILD and EVALUATE + REPAIR in part; FRAME and the design roles are proposals.", "The tools read documented care; what leaves no trace in the sources remains invisible."]}]}, "cases": [{"id": "F-01", "corpus": "food", "name": "Il Frigo di Quartiere — Turin", "place": "Turin, Italy", "period": "2019–present", "desc": "Il Frigo di Quartiere is a network of shared refrigerators placed in existing community spaces in Turin, such as urban gardens, elderly centres, youth hubs and neighbourhood houses, in areas including Barriera di Milano and San Salvario. It is open to residents without means-testing, and access and sharing rules are co-defined by the community at periodic meetings. The fridges are managed by 17+ third-sector organisations through the Im.patto Torino network, co-designed with the retail cooperative Nova Coop (Cibo e futuro project), and receive weekly deliveries of fresh Coop surplus. Prototypes were tested from 2019, the first permanent fridge opened in April 2022 at Orto Boschetto, and there were four sites by April 2024. The fridges follow HACCP hygiene rules and the anti-waste Law 166/2016 for food traceability, and are stocked only through certified channels: surplus from local Coop supermarkets, or traceable ready meals prepared in professional kitchens from unsold produce of markets such as Porta Palazzo. Partner associations include Babelica APS, Cooperativa Valpiana and RePoPP.", "fam": "D", "fam2": null, "prim": ["P1", "P3", "P6", "P8"], "why": "Exemplary for Collective Responsibility (P3): the most thoroughly documented Italian case of a community fridge with participatory governance; also shows structural limits of the Enabling model that Care(full) Design guidelines must name explicitly.", "sources": "Im.patto Torino; Nova Coop \"Cibo e futuro\" project materials; local press coverage", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "T", "M", "M", "T", "M", "T", "M"], "nT": 4, "depth": "Transformative", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://www.disuguaglianzedisalute.it/il-frigo-di-quartiere-innovazione-e-comunita-per-un-modello-di-intervento-sociale-a-torino/"}, {"id": "F-02", "corpus": "food", "name": "Fruit Are Heavy — Prototype Public IoT System to Support Urban Foraging", "place": "Atlanta, Georgia, USA", "period": "2015–2019 (prototype); ongoing as Fruit Are Here", "desc": "Fruit Are Heavy was a prototype public IoT system developed as a Georgia Tech design-research project (Carl DiSalvo, Public Design Workshop) with Intel funding, published by DiSalvo and Jenkins at DIS'17 (ACM). It served food redistribution in Atlanta, Georgia, working with the nonprofit Concrete Jungle, a partner since 2014. Low-cost environmental sensors were placed on urban fruit trees to detect ripening and optimise harvesting. Concrete Jungle harvests roughly 21,000 lbs of fruit per year, and the Georgia Tech/Concrete Jungle relationship has lasted 10+ years. The prototype ran from 2015 to 2019 and evolved into the participatory tree-mapping platform Fruit Are Here, active from 2019 to the present.", "fam": "F", "fam2": null, "prim": ["P7"], "why": "Exemplary for Attentiveness and Ecology of Care as a design-research project using technology as a device of ecological care — the only corpus case where technology is designed explicitly as a care device for non-human urban food resources. Relevant to Care(full) Design guidelines as an example of \"tinkering-as-care.\"", "sources": "DiSalvo & Jenkins, DIS'17 (ACM); DiSalvo (2022) Design as Democratic Inquiry; carldisalvo.com; Concrete Jungle materials", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["M", "M", "M", "M", "NV", "NV", "T", "M", "W"], "nT": 1, "depth": "Emergent", "re": "N", "reCrit": "Yes: –  ·  Partly: –  ·  No: A, B, C"}, "link": "https://carldisalvo.com"}, {"id": "F-03", "corpus": "food", "name": "Ghetto Gastro", "place": "Bronx, New York, USA", "period": "2012–present", "desc": "Ghetto Gastro is a culinary collective founded in the Bronx, New York, in 2012 by Jon Gray, Pierre Serrao and Lester Walker, all Bronx natives, growing out of underground 'Freestyle Fridays' apartment dinners, with 'Everybody eats' as its central mission claim. It works through events, own-label food products, activism, physical spaces and collaborations with Nike, Cartier, MoMA and Serpentine. It has run Labyrinth 1.1 in the Bronx since 2019 and opened the Gourmega restaurant in SoHo, Manhattan, in April 2026, with 100% of profits going to Rethink Food. Its products were sold at Target in 2023-2024 until it withdrew in November 2024 for undisclosed reasons, and it was a 2020 Basque Culinary World Prize finalist.", "fam": "E", "fam2": null, "prim": ["P1", "P4"], "why": "Exemplary for Politics of Care: food as explicit terrain of political struggle and identity claim, embodying the 'right to adequate food' as sovereignty, not assistance — a rare model of luxury as redistributive mechanism, culture as care, brand as instrument of justice.", "sources": "ghettogastro.com; Ghetto Gastro manifesto book (2022); press coverage of Target partnership/exit and Gourmega opening", "img": null, "credit": "", "depth": null, "re": null, "full": true, "q": {"lv": ["T", "M", "M", "T", "M", "M", "M", "M", "A"], "nT": 2, "depth": "Enabling", "re": "P", "reCrit": "Yes: A  ·  Partly: B  ·  No: C"}, "link": "https://ghettogastro.com"}, {"id": "F-04", "corpus": "food", "name": "The Stop Community Food Centre", "place": "Toronto, Ontario, Canada", "period": "1982–present", "desc": "The Stop Community Food Centre is a Toronto organisation founded in 1982 as a food bank at St. Stephen's-in-the-Fields Church and transformed from 1998, under Executive Director Nick Saul, into the first 'Community Food Centre' model. It targets Davenport West and is designed around dignity rather than eligibility screening. The model combines a food bank, kitchens, gardens, peer advocacy and structural policy advocacy in one hub, at 1884 Davenport Road, the Green Barn (Wychwood Barns) and Wychwood Open Door. In F2024 it provided 37,233 meals to 14,031 individuals, with $2.8M CAD in programme spending and $806K CAD in dona
